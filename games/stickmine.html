<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

button{border:0;color:inherit}
.hidden{display:none!important}
.screen{position:fixed;inset:0}
#menuScreen{overflow:auto;background:

.menuWrap{width:min(980px,100%);margin:auto}
.logo{font-size:clamp(44px,10vw,94px);font-weight:1000;letter-spacing:-6px;line-height:.9;margin:6vh 0 8px;text-shadow:0 7px 0 #050709}

.subtitle{color:var(--muted);font-size:13px;margin-bottom:24px}

.bigBtn,.secondaryBtn,.tinyBtn{cursor:pointer;transition:transform .08s,filter .08s;background:var(--panel);border:1px solid var(--line)}

.bigBtn{min-height:112px;text-align:left;padding:18px;border-radius:15px}

.menuFooter{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.secondaryBtn{padding:12px 14px;border-radius:10px}
.version{margin-left:auto;color:#647386;padding:12px 0;font-size:11px}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#161c23;border:1px solid #3c4a5d;border-radius:16px;padding:18px;box-shadow:0 24px 90px rgba(0,0,0,.55)}
.modal h2{margin:0 0 14px;font-size:21px}
.field{display:grid;gap:6px;margin:11px 0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{width:100%;background:#0d1217;border:1px solid #364353;border-radius:9px;color:white;padding:12px}
.row{display:flex;gap:9px}.row>*{flex:1}
.modalActions{display:flex;gap:9px;margin-top:16px}
.modalActions button{flex:1;padding:13px;border-radius:9px;background:#26313d;border:1px solid #3f5062}

.publicList{display:grid;gap:8px;max-height:50vh;overflow:auto}
.roomCard{display:flex;gap:10px;align-items:center;padding:11px;background:#0f151b;border:1px solid #303c4a;border-radius:10px}
.roomCard .grow{flex:1}.roomCard b{display:block}.roomCard small{color:#8fa0b4}
.roomCard button{padding:9px 12px;border-radius:8px;background:#2b4e27;border:1px solid #4d8547}
#gameScreen{background:#7dc6f2}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(8px + var(--safeT)) calc(8px + var(--safeR)) calc(8px + var(--safeB)) calc(8px + var(--safeL))}
.topHud{display:flex;align-items:flex-start;gap:7px}
.hudPanel{background:rgba(10,14,19,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(7px);border-radius:10px;padding:7px 9px;text-shadow:0 1px #000}
#stats{font-size:12px;line-height:1.45;min-width:136px}
#roomInfo{font-size:11px;color:#d8e4ef}

#hotbar{position:absolute;left:50%;bottom:calc(8px + var(--safeB));transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto;background:rgba(8,11,15,.62);padding:5px;border-radius:10px;border:1px solid rgba(255,255,255,.12)}
.hotSlot{position:relative;width:48px;height:48px;background:#232b34;border:2px solid #526172;border-radius:7px;display:flex;align-items:center;justify-content:center;image-rendering:pixelated}
.hotSlot.sel{border-color:#fff;box-shadow:0 0 0 2px #1a222b}
.hotSlot canvas{width:32px;height:32px;image-rendering:pixelated}
.hotSlot .count{position:absolute;right:3px;bottom:1px;font-size:11px;text-shadow:0 1px 2px #000}
.hotSlot .key{position:absolute;left:3px;top:1px;font-size:8px;color:#9fb0c2}
#xpBar{position:absolute;left:50%;bottom:calc(65px + var(--safeB));transform:translateX(-50%);width:min(390px,56vw);height:7px;background:rgba(0,0,0,.58);border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
#xpFill{height:100%;width:0;background:#77e64c}
#mobileControls{position:absolute;inset:0;pointer-events:none}
.joyBase{position:absolute;left:calc(26px + var(--safeL));bottom:calc(30px + var(--safeB));width:128px;height:128px;border-radius:50%;background:rgba(12,18,24,.28);border:2px solid rgba(255,255,255,.18);pointer-events:auto;touch-action:none}

.actionCluster{position:absolute;right:calc(22px + var(--safeR));bottom:calc(28px + var(--safeB));width:176px;height:144px;pointer-events:none}
.act{position:absolute;width:58px;height:58px;border-radius:50%;pointer-events:auto;background:rgba(18,25,33,.68);border:2px solid rgba(255,255,255,.20);font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
.act.jump{right:4px;bottom:48px}.act.mine{left:43px;bottom:0}.act.place{left:0;top:0}.act.attack{right:40px;top:0}
#inventoryBtn{position:absolute;right:calc(9px + var(--safeR));top:calc(60px + var(--safeT));width:44px;height:44px;pointer-events:auto;border-radius:10px;background:rgba(10,14,19,.75);border:1px solid rgba(255,255,255,.17);font-size:20px}
#crosshair{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;opacity:.7}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:white;box-shadow:0 1px #000}
#crosshair:before{left:5px;top:0;width:2px;height:12px}#crosshair:after{top:5px;left:0;width:12px;height:2px}
#inventoryPanel{position:fixed;inset:0;z-index:65;background:rgba(6,9,12,.82);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--safeT)) calc(12px + var(--safeR)) calc(12px + var(--safeB)) calc(12px + var(--safeL))}
.invWindow{width:min(980px,100%);height:min(610px,94vh);background:#171d24;border:1px solid #435164;border-radius:15px;padding:14px;display:grid;grid-template-columns:1.15fr .85fr;gap:13px;overflow:hidden}
.invLeft,.invRight{min-width:0;overflow:auto}
.invHeader{display:flex;align-items:center;gap:8px;margin-bottom:10px}.invHeader h2{margin:0;flex:1}
.closeBtn{width:40px;height:40px;border-radius:8px;background:#303c49}

.invSlot{position:relative;aspect-ratio:1;background:#232c36;border:1px solid #465668;border-radius:6px;display:flex;align-items:center;justify-content:center;min-width:0}
.invSlot canvas{width:80%;height:80%;image-rendering:pixelated}.invSlot .count{position:absolute;right:3px;bottom:1px;font-size:10px}
.sectionTitle{font-size:12px;color:#9cabbc;margin:12px 0 7px}
.gearLayout{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gearSlot{min-height:72px;border:1px solid #465668;background:#202832;border-radius:8px;padding:7px;font-size:10px}
.gearSlot b{display:block;font-size:11px;margin-bottom:4px}.gearSlot .empty{color:#6f7e8e}
.gearBag{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.gearCard{background:#202832;border:1px solid #465668;border-radius:8px;padding:8px;font-size:10px;cursor:pointer}
.gearCard b{display:block;font-size:11px;margin-bottom:3px}.gearCard small{color:#9cacbe}
.r-common{border-color:#6e7c8b}.r-uncommon{border-color:#6cd96c}.r-rare{border-color:#5ca8ff}.r-epic{border-color:#b767ff}.r-legendary{border-color:#ffb94d}

.modal.wide{width:min(820px,100%)}
.styleLocker{display:grid;grid-template-columns:210px 1fr;gap:15px;min-height:410px}
.stylePreviewBox{background:#0d1319;border:1px solid #344354;border-radius:13px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:9px;align-self:start}

.styleRight{min-width:0;max-height:64vh;overflow:auto;padding-right:2px}
.styleSection{margin:0 0 13px}

.colorGrid{display:grid;grid-template-columns:repeat(8,30px);gap:7px}
.colorSwatch{width:30px;height:30px;border-radius:7px;border:2px solid #415064;cursor:pointer;position:relative}
.colorSwatch.sel{border-color:#fff;box-shadow:0 0 0 2px #17202a}

.cosGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.cosCard{min-height:59px;background:#202832;border:1px solid #465668;border-radius:9px;padding:8px;cursor:pointer;text-align:left;position:relative}
.cosCard b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cosCard small{display:block;color:#91a1b3;font-size:8px;margin-top:4px}
.cosCard.sel{box-shadow:inset 0 0 0 2px #fff}.cosCard.locked{filter:saturate(.25);opacity:.57;cursor:default}.cosCard .lock{position:absolute;right:7px;top:7px;font-size:11px}

#toast{position:fixed;left:50%;top:calc(16px + var(--safeT));transform:translate(-50%,-20px);z-index:120;background:#111820;border:1px solid #415063;border-radius:10px;padding:10px 14px;opacity:0;pointer-events:none;transition:.18s;max-width:90vw;text-align:center;font-size:12px}

  #rotateNotice{display:flex;position:fixed;z-index:250;inset:0;background:#0d1217;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:18px}
}
@media (pointer:fine){
  #mobileControls{display:none}
  #inventoryBtn{top:calc(8px + var(--safeT));right:calc(62px + var(--safeR))}
}
@media(max-width:720px){
  .menuGrid{grid-template-columns:1fr 1fr}.bigBtn{min-height:92px;padding:13px}.bigBtn strong{font-size:15px}.bigBtn small{font-size:10px}
  .logo{margin-top:2vh}

  .invGrid{grid-template-columns:repeat(6,minmax(34px,1fr))}
  .hotSlot{width:39px;height:39px}.hotSlot canvas{width:28px;height:28px}
  #hotbar{bottom:calc(5px + var(--safeB))}
  #xpBar{bottom:calc(52px + var(--safeB))}
}

<div id="rotateNotice">↻<br><br>Stickmine se joue en paysage.<br>Tourne ton téléphone.</div>

<section id="menuScreen" class="screen">
  <div class="menuWrap">
    <div class="logo">STICK<span>MINE</span></div>
    <div class="subtitle">Mine, cultive, construis et survis. Ton petit monde reste toujours là.</div>
    <div class="profileBar">
      <div id="authDot" class="statusDot"></div>
      <div id="profileAvatar" class="profileAvatar" title="Personnaliser"><canvas id="profileMini" width="48" height="48"></canvas></div>
      <input id="pseudoInput" maxlength="18" placeholder="Ton pseudo">
      <button id="styleBtn" class="styleBtn">STYLE<small id="collectionCount">Collection</small></button>
      <div id="authText" style="font-size:10px;color:#8fa0b4">Connexion…</div>
    </div>
    <div class="menuGrid">
      <button class="bigBtn primary" id="soloBtn"><strong>▶ SOLO</strong><small>Lance immédiatement un Skyblock local.</small></button>
      <button class="bigBtn" id="createBtn"><strong>＋ CRÉER</strong><small>Crée un Skyblock ou un monde normal, privé ou public.</small></button>
      <button class="bigBtn" id="joinBtn"><strong>⌁ REJOINDRE</strong><small>Entre le code d'un monde créé par un ami.</small></button>
      <button class="bigBtn" id="browseBtn"><strong>◎ PARTIES PUBLIQUES</strong><small>Rejoins des joueurs qui ont ouvert leur monde.</small></button>
    </div>
    <div class="menuFooter">
      <button class="secondaryBtn" id="importBtn">Importer une sauvegarde</button>
      <button class="secondaryBtn" id="helpBtn">Contrôles</button>
      <span class="version">Stickmine V3.0 · Survival Pixel</span>
    </div>
  </div>
</section>

<section id="gameScreen" class="screen hidden">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="topHud">
      <div class="hudPanel" id="stats"></div>
      <div class="hudPanel" id="roomInfo"></div>
      <button id="pauseBtn">Ⅱ</button>
    </div>
    <button id="inventoryBtn"><canvas id="bagIcon" width="16" height="16"></canvas></button>
    <div id="xpBar"><div id="xpFill"></div></div><div id="hungerBar"><div id="hungerFill"></div></div>
    <div id="hotbar"></div>
    <div id="crosshair"></div>
    <div id="mobileControls">

      <div class="actionCluster">

        <button class="act attack" id="attackAct"><canvas id="attackIcon" width="16" height="16"></canvas></button>
      </div>
    </div>
  </div>
</section>

<div id="inventoryPanel" class="hidden">

    <div class="invTop"><h2 class="grow">Sac du mineur</h2><small id="invHint">Inventaire</small><button class="closeBtn" id="closeInv">✕</button></div>
    <div class="invTabs">

      <button class="invTab" data-tab="craft">Craft</button>

    </div>
  </div>
</div>

}

}

function hash(seed,x,y=0){

function baseBlockAt(x,y){

    if(dx<=7){
      const top=30+Math.floor(Math.abs(x)*.23);
      if(y===top)return BLOCK.GRASS;
      if(y>top&&y<=top+3)return BLOCK.DIRT;
      if(y>top+3&&y<=38-Math.floor(dx*.45))return BLOCK.STONE;
    }
    // starter island props
    if((x===-4||x===4) && y>=26&&y<=29)return x<0?BLOCK.OAK_LOG:BLOCK.BIRCH_LOG;
    const tree=(tx,kind)=>{
      const top=26; const dx2=Math.abs(x-tx),dy=y-top;
      if(dy>=-2&&dy<=1&&dx2<=2 && !(dx2===2&&Math.abs(dy)===2))return kind;
      return null;
    };

    l=tree(4,BLOCK.BIRCH_LEAVES);if(l)return l;
    if(x===0&&y===29)return BLOCK.CRAFT;
    if(x===-7&&y===29)return BLOCK.WATER;
    if(x===7&&y===31)return BLOCK.LAVA;
    return BLOCK.AIR;
  }
  const seed=currentWorld?.seed||12345;
  if(y===95)return BLOCK.BEDROCK;
  const sy=surfaceY(x,seed);
  // trees are deterministic overlays
  for(let tx=x-2;tx<=x+2;tx++){
    if(hash(seed,tx,1001)>.965){
      const tsy=surfaceY(tx,seed);
      if(y>=tsy-4&&y<tsy && x===tx)return hash(seed,tx,1002)>.5?BLOCK.BIRCH_LOG:BLOCK.OAK_LOG;
      if(y>=tsy-6&&y<=tsy-3&&Math.abs(x-tx)<=2){
        const birch=hash(seed,tx,1002)>.5;
        if(!(Math.abs(x-tx)===2&&y===tsy-6))return birch?BLOCK.BIRCH_LEAVES:BLOCK.OAK_LEAVES;
      }
    }
  }
  if(y<sy)return BLOCK.AIR;
  if(y===sy)return BLOCK.GRASS;
  if(y<=sy+3)return BLOCK.DIRT;
  if(y>84 && hash(seed,x,y)>.985)return BLOCK.LAVA;
  if(y>45 && hash(seed,x,y+10)>.992)return BLOCK.WATER;
  const r=hash(seed,x,y);
  if(y>70&&r>.985)return BLOCK.DIAMOND;
  if(y>55&&r>.975)return BLOCK.GOLD;
  if(y>40&&r>.94)return BLOCK.IRON;
  if(y>34&&r>.90)return BLOCK.COAL;
  if(y>sy+3)return BLOCK.STONE;

}

function updateGrowth(dt){

  for(const [k,id] of entries){const [x,y]=k.split("_").map(Number),d=blockDefs[id];if(id===BLOCK.OAK_SAPLING||id===BLOCK.BIRCH_SAPLING){if(Math.random()<.08)growTree(x,y,id===BLOCK.BIRCH_SAPLING);continue}if(!d?.crop||d.stage>=4)continue;const hydrated=hasWaterNear(x,y+1),chance=hydrated?.36:.18;if(Math.random()>chance)continue;setBlockWorld(x,y,id+1)}

function updateFluids(dt){
  if(!isHost||paused)return;
  fluidTimer+=dt;if(fluidTimer<(currentWorld.mode==="skyblock"?.24:.30))return;fluidTimer=0;
  // scan around active player plus queue to keep implementation deterministic enough
  const minX=Math.floor((player.x-canvas.width*.7)/TILE),maxX=Math.floor((player.x+canvas.width*.7)/TILE);
  const minY=Math.max(0,Math.floor((player.y-canvas.height*.6)/TILE)),maxY=Math.min(95,Math.floor((player.y+canvas.height*.7)/TILE));
  let candidates=[];
  for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){let id=getBlock(x,y);if(isLiquid(id))candidates.push([x,y,id])}
  candidates=candidates.slice(0,160);
  for(const [x,y,id] of candidates){
    const def=blockDefs[id],kind=def.liquid,level=def.level||0;
    const below=getBlock(x,y+1);
    if(isLiquid(below)&&blockDefs[below].liquid!==kind){awaitFluidMix(x,y+1,id,below);continue}
    if(below===BLOCK.AIR){setBlockWorld(x,y+1,kind==="water"?BLOCK.WATER1:BLOCK.LAVA1);continue}
    if(level<(kind==="water"?4:3)){
      const next=kind==="water"?BLOCK.WATER+Math.min(4,level+1)+11:BLOCK.LAVA+Math.min(3,level+1)+14;
      for(const nx of [x-1,x+1]){
        const side=getBlock(nx,y);
        if(isLiquid(side)&&blockDefs[side].liquid!==kind){awaitFluidMix(nx,y,id,side);continue}
        if(side===BLOCK.AIR&&Math.random()<(kind==="water"?.9:.42))setBlockWorld(nx,y,next);
      }
    }
  }
}
function awaitFluidMix(x,y,a,b){
  const A=blockDefs[a],B=blockDefs[b];if(!A?.liquid||!B?.liquid||A.liquid===B.liquid)return;
  const source=(A.level===0||B.level===0);setBlockWorld(x,y,source?BLOCK.OBSIDIAN:BLOCK.COBBLE);

function cleanWorldData(w){
  return {
    mode:w.mode||"skyblock",seed:Number(w.seed)||Math.floor(Math.random()*1e9),
    name:(w.name||"Mon monde").slice(0,28),public:!!w.public,hostUid:w.hostUid||user?.uid||"",
    createdAt:w.createdAt||Date.now(),hostOnline:w.hostOnline!==false,maxPlayers:w.maxPlayers||4,time:Number.isFinite(w.time)?w.time:.24
  };
}
function generateCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";
  for(let i=0;i<16;i++){if(i&&i%4===0)s+="-";s+=chars[Math.floor(Math.random()*chars.length)]}return s;
}
function normalizeCode(s){return (s||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").match(/.{1,4}/g)?.join("-")||""}

async function createOnlineWorld(opts){
  if(!user)return toast("Firebase n'est pas encore connecté");
  loading("Création du monde…");
  let code=generateCode();
  for(let i=0;i<4;i++){const snap=await get(ref(db,`worlds/${code}/meta`));if(!snap.exists())break;code=generateCode()}
  const meta={name:opts.name||"Mon monde",mode:opts.mode||"skyblock",seed:Math.floor(Math.random()*1e9),public:!!opts.public,hostUid:user.uid,createdAt:serverTimestamp(),lastActive:serverTimestamp(),hostOnline:true,maxPlayers:4,time:.24};
  await set(ref(db,`worlds/${code}/meta`),meta);
  await enterWorld(code,{...meta,createdAt:Date.now()},true,false);
}
async function joinOnlineWorld(code){
  code=normalizeCode(code);if(!code)return;
  loading("Recherche du monde…");
  try{
    const snap=await get(ref(db,`worlds/${code}/meta`));
    if(!snap.exists()){unloading();toast("Monde introuvable");return}
    const meta=cleanWorldData(snap.val());
    if(meta.hostOnline===false){unloading();toast("L'hôte est hors ligne");return}
    await enterWorld(code,meta,meta.hostUid===user.uid,false);
  }catch(e){unloading();toast("Impossible de rejoindre : "+e.message)}
}
async function enterWorld(code,meta,host,solo){
  cleanupListeners();worldCode=code;currentWorld=cleanWorldData(meta);isHost=host;isSolo=solo;worldTime=currentWorld.time??.24;patches={};mobs={};remotePlayers={};projectiles=[];
  let saved=null;
  if(solo){
    const raw=localStorage.getItem(`stickmine_world_${code}`);if(raw){try{saved=JSON.parse(raw);patches=saved.patches||{};if(Number.isFinite(saved.meta?.time)){worldTime=saved.meta.time;currentWorld.time=worldTime}}catch{}}
  }else{
    const ps=await get(ref(db,`worlds/${code}/patches`));patches=ps.val()||{};
  }
  resetPlayerForWorld(true);
  if(solo&&saved?.player)loadPlayerData(saved.player);
  if(!solo&&user){
    const pSnap=await get(ref(db,`worlds/${code}/players/${user.uid}`));
    if(pSnap.exists())loadPlayerData(pSnap.val());
    const pRef=ref(db,`worlds/${code}/players/${user.uid}`);
    await onDisconnect(pRef).remove();
    await set(pRef,playerNetData(true));
    const prRef=ref(db,`worlds/${code}/players`);
    listeners.push(onValue(prRef,s=>{remotePlayers=s.val()||{}}));
    const patchRef=ref(db,`worlds/${code}/patches`);
    listeners.push(onValue(patchRef,s=>{patches=s.val()||{}}));
    const mobRef=ref(db,`worlds/${code}/mobs`);
    listeners.push(onValue(mobRef,s=>{if(!isHost)mobs=s.val()||{}}));
    const metaRef=ref(db,`worlds/${code}/meta`);
    listeners.push(onValue(metaRef,s=>{
      const m=s.val();if(!m)return;
      currentWorld={...currentWorld,...cleanWorldData(m)};
      if(!isHost&&m.hostOnline===false){toast("L'hôte s'est déconnecté",4000);setTimeout(leaveWorld,2500)}
    }));
    if(isHost){
      await update(metaRef,{hostOnline:true,lastActive:serverTimestamp()});
      onDisconnect(ref(db,`worlds/${code}/meta/hostOnline`)).set(false);
    }
  }
  $("#menuScreen").classList.add("hidden");$("#gameScreen").classList.remove("hidden");gameRunning=true;paused=false;inventoryOpen=false;
  $("#inventoryPanel").classList.add("hidden");renderHotbar();unloading();toast(currentWorld.mode==="skyblock"?"Bienvenue sur ton Skyblock":"Monde généré");
  lastTime=performance.now();requestAnimationFrame(loop);
}

async function importWorldCode(code){

      }

    autosaveTimer+=dt;networkTimer+=dt;mobNetworkTimer+=dt;
    if(autosaveTimer>5){autosaveTimer=0;saveNow()}
    if(!isSolo&&user&&networkTimer>.18){networkTimer=0;set(ref(db,`worlds/${worldCode}/players/${user.uid}`),playerNetData(false)).catch(()=>{})}
    if(!isSolo&&isHost&&mobNetworkTimer>.8){mobNetworkTimer=0;set(ref(db,`worlds/${worldCode}/mobs`),mobs).catch(()=>{})}
  }
  updateAim();draw();updateHud();requestAnimationFrame(loop);
}

function openPause(){
  paused=true;
  modal(`<h2>Pause</h2>
    <div style="font-size:12px;color:#aab6c5;line-height:1.7">
      Monde : <b>${escapeHtml(currentWorld?.name||"")}</b><br>
      ${isSolo?"Sauvegarde locale":`Code : <b style="user-select:all">${worldCode}</b>`}
    </div>
    <div class="modalActions" style="flex-wrap:wrap">
      <button id="resume">Reprendre</button>
      <button id="pauseStyle">Style</button>
      <button id="exportSave">Exporter</button>
      <button id="quitGame" style="border-color:#7c3d43">Quitter</button>
    </div>`);
  $("#resume").onclick=()=>{closeModal();paused=false};
  $("#pauseStyle").onclick=()=>openStyleLocker(true);
  $("#exportSave").onclick=exportWorld;
  $("#quitGame").onclick=()=>{closeModal();leaveWorld()};
}

function setupUI(){
  $("#pseudoInput").value=player.pseudo;
  renderProfileMini();
  $("#styleBtn").onclick=()=>openStyleLocker(false);
  $("#profileAvatar").onclick=()=>openStyleLocker(false);
  $("#pseudoInput").addEventListener("change",()=>{
    let v=$("#pseudoInput").value.trim().replace(/[^\p{L}\p{N}_ -]/gu,"").slice(0,18)||"Mineur";
    player.pseudo=v;$("#pseudoInput").value=v;localStorage.setItem("stickmine_pseudo",v);renderProfileMini();
    if(gameRunning&&!isSolo&&user)set(ref(db,`worlds/${worldCode}/players/${user.uid}`),playerNetData(false)).catch(()=>{});
  });
  $("#soloBtn").onclick=()=>{
    const meta={name:"Skyblock local",mode:"skyblock",seed:Math.floor(Math.random()*1e9),public:false,hostUid:"local",createdAt:Date.now(),hostOnline:true,maxPlayers:1};
    const code="LOCAL-"+(localStorage.getItem("stickmine_last_solo")||Math.floor(Math.random()*1e7));
    localStorage.setItem("stickmine_last_solo",code.replace("LOCAL-",""));enterWorld(code,meta,true,true);
  };
  $("#createBtn").onclick=()=>{
    modal(`<h2>Créer une partie</h2>
      <div class="field"><label>Nom du monde</label><input id="worldName" maxlength="28" value="${escapeHtml(player.pseudo)}'s world"></div>
      <div class="row">
        <div class="field"><label>Mode</label><select id="worldMode"><option value="skyblock">Skyblock</option><option value="normal">Monde normal</option></select></div>
        <div class="field"><label>Accès</label><select id="worldPublic"><option value="0">Privé</option><option value="1">Public</option></select></div>
      </div>
      <div style="font-size:10px;color:#8191a4">Privé : seuls les joueurs avec le code peuvent rejoindre. Public : le monde apparaît dans la liste.</div>
      <div class="modalActions"><button id="cancelModal">Annuler</button><button class="go" id="doCreate">Créer</button></div>`);
    $("#cancelModal").onclick=closeModal;$("#doCreate").onclick=()=>{const opts={name:$("#worldName").value.trim()||"Mon monde",mode:$("#worldMode").value,public:$("#worldPublic").value==="1"};closeModal();createOnlineWorld(opts)}
  };
  $("#joinBtn").onclick=()=>{
    modal(`<h2>Rejoindre</h2><div class="field"><label>Code du monde</label><input id="joinCode" autocomplete="off" autocapitalize="characters" placeholder="ABCD-EFGH-JKLM-NPQR"></div><div class="modalActions"><button id="cancelModal">Annuler</button><button class="go" id="doJoin">Rejoindre</button></div>`);
    $("#cancelModal").onclick=closeModal;$("#doJoin").onclick=()=>{const c=$("#joinCode").value;closeModal();joinOnlineWorld(c)}
  };
  $("#browseBtn").onclick=openPublicBrowser;
  $("#importBtn").onclick=()=>{
    modal(`<h2>Importer une sauvegarde</h2><div class="field"><label>Code commençant par SM1:</label><input id="backupCode" placeholder="SM1:..."></div><div class="modalActions"><button id="cancelModal">Annuler</button><button class="go" id="doImport">Importer</button></div>`);
    $("#cancelModal").onclick=closeModal;$("#doImport").onclick=()=>{const c=$("#backupCode").value.trim();closeModal();importWorldCode(c)}
  };
  $("#helpBtn").onclick=()=>{
    modal(`<h2>Contrôles</h2><div style="font-size:12px;line-height:1.8;color:#c3cfdb">
      <b>PC</b><br>Q/D ou A/D : marcher · Espace : sauter · Clic gauche : miner · Clic droit : poser · F : attaquer · E : inventaire · 1–9 : hotbar<br><br>
      <b>Mobile</b><br>Joystick gauche · ↑ saut · ⛏ mine · ▣ utilise l'objet (poser, manger, labourer) · ⚔ attaque · 🎒 sac.<br><br>
      Touche une table de craft pour ouvrir directement les recettes. Les aliments se mangent avec ▣ quand ils sont sélectionnés.
      </div><div class="modalActions"><button id="cancelModal">Fermer</button></div>`);
    $("#cancelModal").onclick=closeModal;
  };
  $("#pauseBtn").onclick=openPause;$("#inventoryBtn").onclick=()=>toggleInventory(true,"bag");$("#closeInv").onclick=()=>toggleInventory(false);document.querySelectorAll(".invTab").forEach(b=>b.onclick=()=>setInventoryTab(b.dataset.tab));
}
setupUI();

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(!gameRunning)return;
  if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();
  if(e.key===" ")jump();
  if(e.key.toLowerCase()==="e")toggleInventory(undefined,"bag");
  if(e.key.toLowerCase()==="f")attack();
  if(e.key.toLowerCase()==="x")mining.key=null;
  if(/^[1-9]$/.test(e.key)){selectedSlot=Number(e.key)-1;renderHotbar()}
  if(e.key==="Escape"){if(inventoryOpen)toggleInventory(false);else openPause()}
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

canvas.addEventListener("pointermove",e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;updateAim()});
canvas.addEventListener("pointerdown",e=>{
  if(!gameRunning||inventoryOpen||paused)return;
  const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;updateAim();
  if(e.pointerType==="mouse"){
    if(e.button===0)mouse.down=true;if(e.button===2){e.preventDefault();useSelected(false)}
  }else{
    if(interactTarget(false))return;mouse.down=true;setTimeout(()=>{if(e.buttons===0)mouse.down=false},120);
  }
});
addEventListener("pointerup",()=>{mouse.down=false;mouse.right=false;resetMining()});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

function setupHold(btn,down,up=()=>{}){
  btn.addEventListener("pointerdown",e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);down(e)});
  btn.addEventListener("pointerup",e=>{e.preventDefault();up(e)});
  btn.addEventListener("pointercancel",up);
}
setupHold($("#jumpAct"),()=>jump());
let mineAuto=false;
setupHold($("#mineAct"),()=>{mineAuto=true;keys["x"]=true},()=>{mineAuto=false;keys["x"]=false;resetMining()});
setupHold($("#placeAct"),()=>useSelected(true));
setupHold($("#attackAct"),()=>attack());

const jb=$("#joyBase"),jk=$("#joyKnob");
function joyMove(e){
  const r=jb.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=43,mag=Math.hypot(dx,dy)||1,q=Math.min(1,max/mag);
  const ox=dx*q,oy=dy*q;jk.style.transform=`translate(${ox}px,${oy}px)`;joy.x=clamp(dx/max,-1,1);joy.y=clamp(dy/max,-1,1);
}
jb.addEventListener("pointerdown",e=>{joy.active=true;joy.id=e.pointerId;jb.setPointerCapture?.(e.pointerId);joyMove(e)});
jb.addEventListener("pointermove",e=>{if(joy.active&&e.pointerId===joy.id)joyMove(e)});
function joyEnd(){joy.active=false;joy.x=joy.y=0;jk.style.transform="translate(0,0)"}
jb.addEventListener("pointerup",joyEnd);jb.addEventListener("pointercancel",joyEnd);

document.addEventListener("visibilitychange",()=>{if(document.hidden&&gameRunning)saveNow()});
addEventListener("beforeunload",()=>{if(gameRunning)saveNow()});

makeTextures();
function decorateMenuIcons(){const map=[["#soloBtn",BLOCK.GRASS],["#createBtn",BLOCK.CRAFT],["#joinBtn",BLOCK.CHEST],["#browseBtn",BLOCK.DIAMOND]];for(const [sel,id] of map){const b=$(sel);if(!b||b.querySelector("canvas.menuIcon"))continue;const c=copyCanvas(getBlockTexture(id,1,1));c.className="menuIcon";b.prepend(c)}const logo=$(".logo");if(logo&&!logo.querySelector(".logoPick")){const c=copyCanvas(getItemTex("iron_pickaxe"));c.className="logoPick";logo.prepend(c)}paintCanvas($("#mineIcon"),getItemTex("iron_pickaxe"));paintCanvas($("#attackIcon"),getItemTex("iron_sword"));paintCanvas($("#bagIcon"),getBlockTexture(BLOCK.CHEST,0,0))}
decorateMenuIcons();renderHotbar();

async function initFirebase(){
  try{
    await setPersistence(auth,browserLocalPersistence);
    onAuthStateChanged(auth,u=>{
      user=u;authReady=true;$("#authDot").classList.toggle("on",!!u);$("#authText").textContent=u?"Firebase connecté":"Hors ligne";
      if(u)unloading();
    });
    if(!auth.currentUser)await signInAnonymously(auth);
  }catch(e){
    console.error(e);$("#authText").textContent="Firebase indisponible";unloading();toast("Mode en ligne indisponible. Le solo fonctionne.",3500);
  }
}
initFirebase();
</script>
