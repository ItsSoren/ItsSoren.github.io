<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Stickmine</title>
<style>
:root{
  --bg:#0f1318;--panel:#171d24;--panel2:#202833;--line:#344152;--text:#f4f7fb;
  --muted:#9ba9ba;--accent:#7ed957;--danger:#ff5e67;--gold:#ffd166;--blue:#5fc5ff;
  --safeT:env(safe-area-inset-top,0px);--safeR:env(safe-area-inset-right,0px);
  --safeB:env(safe-area-inset-bottom,0px);--safeL:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;touch-action:manipulation}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
button{border:0;color:inherit;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game,.joyBase,.joyKnob,.act,#hotbar,.hotSlot,#pauseBtn,#inventoryBtn{touch-action:none}.modal,.invPane,.styleRight,.publicList{touch-action:pan-y}
.hidden{display:none!important}
.screen{position:fixed;inset:0}
#menuScreen{overflow:auto;background:
  radial-gradient(circle at 20% 20%,rgba(85,150,255,.12),transparent 34%),
  radial-gradient(circle at 82% 12%,rgba(126,217,87,.10),transparent 26%),
  linear-gradient(#111720,#0c1015);padding:calc(20px + var(--safeT)) calc(18px + var(--safeR)) calc(22px + var(--safeB)) calc(18px + var(--safeL))}
.menuWrap{width:min(980px,100%);margin:auto}
.logo{font-size:clamp(44px,10vw,94px);font-weight:1000;letter-spacing:-6px;line-height:.9;margin:6vh 0 8px;text-shadow:0 7px 0 #050709}
.logo span{color:var(--accent)}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:24px}
.profileBar{display:flex;gap:10px;align-items:center;background:rgba(23,29,36,.88);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:14px}
.profileBar input{min-width:0;flex:1;background:#0f141a;color:white;border:1px solid #354252;border-radius:9px;padding:12px}
.profileAvatar{width:46px;height:46px;flex:0 0 46px;border-radius:10px;background:#0c1117;border:1px solid #3b4959;display:grid;place-items:center;overflow:hidden;cursor:pointer}

.styleBtn{flex:0 0 auto;min-height:44px;padding:7px 11px;border-radius:9px;background:#252f3a;border:1px solid #445468;cursor:pointer;font-weight:800;font-size:11px}
.styleBtn small{display:block;color:#91a3b6;font-size:8px;margin-top:2px;font-weight:500}
.statusDot{width:10px;height:10px;border-radius:50%;background:#8b94a0;box-shadow:0 0 0 4px rgba(255,255,255,.04)}
.statusDot.on{background:#69df72;box-shadow:0 0 12px #69df72}
.menuGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bigBtn,.secondaryBtn,.tinyBtn{cursor:pointer;transition:transform .08s,filter .08s;background:var(--panel);border:1px solid var(--line)}
.bigBtn:active,.secondaryBtn:active,.tinyBtn:active{transform:translateY(2px);filter:brightness(.9)}
.bigBtn{min-height:112px;text-align:left;padding:18px;border-radius:15px}
.bigBtn strong{display:block;font-size:19px;margin-bottom:7px}
.bigBtn small{color:var(--muted);line-height:1.35}
.bigBtn.primary{background:linear-gradient(135deg,#244820,#182c19);border-color:#4e8c45}
.menuFooter{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.secondaryBtn{padding:12px 14px;border-radius:10px}
.version{margin-left:auto;color:#647386;padding:12px 0;font-size:11px}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#161c23;border:1px solid #3c4a5d;border-radius:16px;padding:18px;box-shadow:0 24px 90px rgba(0,0,0,.55)}
.modal h2{margin:0 0 14px;font-size:21px}
.field{display:grid;gap:6px;margin:11px 0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{width:100%;background:#0d1217;border:1px solid #364353;border-radius:9px;color:white;padding:12px}
.row{display:flex;gap:9px}.row>*{flex:1}
.modalActions{display:flex;gap:9px;margin-top:16px}
.modalActions button{flex:1;padding:13px;border-radius:9px;background:#26313d;border:1px solid #3f5062}
.modalActions .go{background:#32622c;border-color:#539b49}
.publicList{display:grid;gap:8px;max-height:50vh;overflow:auto}
.roomCard{display:flex;gap:10px;align-items:center;padding:11px;background:#0f151b;border:1px solid #303c4a;border-radius:10px}
.roomCard .grow{flex:1}.roomCard b{display:block}.roomCard small{color:#8fa0b4}
.roomCard button{padding:9px 12px;border-radius:8px;background:#2b4e27;border:1px solid #4d8547}
#gameScreen{background:#7dc6f2}
#game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(8px + var(--safeT)) calc(8px + var(--safeR)) calc(8px + var(--safeB)) calc(8px + var(--safeL))}
.topHud{display:flex;align-items:flex-start;gap:7px}
.hudPanel{background:rgba(10,14,19,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(7px);border-radius:10px;padding:7px 9px;text-shadow:0 1px #000}
#stats{font-size:12px;line-height:1.45;min-width:136px}
#roomInfo{font-size:11px;color:#d8e4ef}
#pauseBtn{margin-left:auto;pointer-events:auto;width:44px;height:44px;border-radius:11px;background:rgba(10,14,19,.78);border:1px solid rgba(255,255,255,.18);font-size:20px}
#hotbar{position:absolute;left:50%;bottom:calc(8px + var(--safeB));transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto;background:rgba(8,11,15,.62);padding:5px;border-radius:10px;border:1px solid rgba(255,255,255,.12)}
.hotSlot{position:relative;width:48px;height:48px;background:#232b34;border:2px solid #526172;border-radius:7px;display:flex;align-items:center;justify-content:center;image-rendering:pixelated}
.hotSlot.sel{border-color:#fff;box-shadow:0 0 0 2px #1a222b}
.hotSlot canvas{width:32px;height:32px;image-rendering:pixelated}
.hotSlot .count{position:absolute;right:3px;bottom:1px;font-size:11px;text-shadow:0 1px 2px #000}
.hotSlot .key{position:absolute;left:3px;top:1px;font-size:8px;color:#9fb0c2}
#xpBar{position:absolute;left:50%;bottom:calc(65px + var(--safeB));transform:translateX(-50%);width:min(390px,56vw);height:7px;background:rgba(0,0,0,.58);border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
#xpFill{height:100%;width:0;background:#77e64c}
#mobileControls{position:absolute;inset:0;pointer-events:none}
.joyBase{position:absolute;left:calc(26px + var(--safeL));bottom:calc(30px + var(--safeB));width:128px;height:128px;border-radius:50%;background:rgba(12,18,24,.28);border:2px solid rgba(255,255,255,.18);pointer-events:auto;touch-action:none}
.joyKnob{position:absolute;left:34px;top:34px;width:58px;height:58px;border-radius:50%;background:rgba(230,241,250,.38);border:2px solid rgba(255,255,255,.28)}
.actionCluster{position:absolute;right:calc(22px + var(--safeR));bottom:calc(28px + var(--safeB));width:176px;height:144px;pointer-events:none}
.act{position:absolute;width:58px;height:58px;border-radius:50%;pointer-events:auto;background:rgba(18,25,33,.68);border:2px solid rgba(255,255,255,.20);font-size:20px;display:flex;align-items:center;justify-content:center;touch-action:none}
.act.jump{right:4px;bottom:48px}.act.mine{left:43px;bottom:0}.act.place{left:0;top:0}.act.attack{right:40px;top:0}
#inventoryBtn{position:absolute;right:calc(9px + var(--safeR));top:calc(60px + var(--safeT));width:44px;height:44px;pointer-events:auto;border-radius:10px;background:rgba(10,14,19,.75);border:1px solid rgba(255,255,255,.17);font-size:20px}
#crosshair{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;opacity:.7}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:white;box-shadow:0 1px #000}
#crosshair:before{left:5px;top:0;width:2px;height:12px}#crosshair:after{top:5px;left:0;width:12px;height:2px}
#inventoryPanel{position:fixed;inset:0;z-index:65;background:rgba(6,9,12,.82);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--safeT)) calc(12px + var(--safeR)) calc(12px + var(--safeB)) calc(12px + var(--safeL))}
.invWindow{width:min(980px,100%);height:min(610px,94vh);background:#171d24;border:1px solid #435164;border-radius:15px;padding:14px;display:grid;grid-template-columns:1.15fr .85fr;gap:13px;overflow:hidden}
.invLeft,.invRight{min-width:0;overflow:auto}
.invHeader{display:flex;align-items:center;gap:8px;margin-bottom:10px}.invHeader h2{margin:0;flex:1}
.closeBtn{width:40px;height:40px;border-radius:8px;background:#303c49}
.invGrid{display:grid;grid-template-columns:repeat(9,minmax(38px,1fr));gap:5px}
.invSlot{position:relative;aspect-ratio:1;background:#232c36;border:1px solid #465668;border-radius:6px;display:flex;align-items:center;justify-content:center;min-width:0}
.invSlot canvas{width:80%;height:80%;image-rendering:pixelated}.invSlot .count{position:absolute;right:3px;bottom:1px;font-size:10px}
.sectionTitle{font-size:12px;color:#9cabbc;margin:12px 0 7px}
.gearLayout{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gearSlot{min-height:72px;border:1px solid #465668;background:#202832;border-radius:8px;padding:7px;font-size:10px}
.gearSlot b{display:block;font-size:11px;margin-bottom:4px}.gearSlot .empty{color:#6f7e8e}
.gearBag{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.gearCard{background:#202832;border:1px solid #465668;border-radius:8px;padding:8px;font-size:10px;cursor:pointer}
.gearCard b{display:block;font-size:11px;margin-bottom:3px}.gearCard small{color:#9cacbe}
.r-common{border-color:#6e7c8b}.r-uncommon{border-color:#6cd96c}.r-rare{border-color:#5ca8ff}.r-epic{border-color:#b767ff}.r-legendary{border-color:#ffb94d}
.recipeList{display:grid;gap:6px}.recipe{display:flex;align-items:center;gap:8px;background:#202832;border:1px solid #3e4c5d;border-radius:8px;padding:8px}
.recipe .grow{flex:1}.recipe small{display:block;color:#93a2b3;margin-top:3px}.recipe button{padding:8px;border-radius:7px;background:#315f2d;border:1px solid #4d8748}

.modal.wide{width:min(820px,100%)}
.styleLocker{display:grid;grid-template-columns:210px 1fr;gap:15px;min-height:410px}
.stylePreviewBox{background:#0d1319;border:1px solid #344354;border-radius:13px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:9px;align-self:start}
#stylePreview{width:180px;height:180px;max-width:100%;image-rendering:pixelated;border-radius:10px;background:linear-gradient(#73bde8 0 62%,#5e8e47 62% 66%,#74553a 66%)}
.collectionLine{font-size:11px;color:#a9b7c6;text-align:center;line-height:1.45}
.styleRight{min-width:0;max-height:64vh;overflow:auto;padding-right:2px}
.styleSection{margin:0 0 13px}
.styleSection h3{font-size:11px;color:#9eafc0;letter-spacing:.08em;margin:0 0 7px;text-transform:uppercase}
.colorGrid{display:grid;grid-template-columns:repeat(8,30px);gap:7px}
.colorSwatch{width:30px;height:30px;border-radius:7px;border:2px solid #415064;cursor:pointer;position:relative}
.colorSwatch.sel{border-color:#fff;box-shadow:0 0 0 2px #17202a}
.colorSwatch.sel:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:white;text-shadow:0 1px 2px #000;font-size:14px;font-weight:900}
.cosGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.cosCard{min-height:59px;background:#202832;border:1px solid #465668;border-radius:9px;padding:8px;cursor:pointer;text-align:left;position:relative}
.cosCard b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cosCard small{display:block;color:#91a1b3;font-size:8px;margin-top:4px}
.cosCard.sel{box-shadow:inset 0 0 0 2px #fff}.cosCard.locked{filter:saturate(.25);opacity:.57;cursor:default}.cosCard .lock{position:absolute;right:7px;top:7px;font-size:11px}
.findHint{font-size:9px;color:#7f90a3;line-height:1.45;margin-top:7px}
@media(max-width:720px){.profileAvatar{width:40px;height:40px;flex-basis:40px}.profileAvatar canvas{width:40px;height:40px}.styleBtn{min-height:40px;padding:6px 8px}.styleLocker{grid-template-columns:145px 1fr;gap:9px;min-height:330px}.stylePreviewBox{padding:8px}#stylePreview{width:126px;height:126px}.cosGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.cosCard{min-height:48px;padding:6px}.colorGrid{grid-template-columns:repeat(8,26px);gap:5px}.colorSwatch{width:26px;height:26px}.styleRight{max-height:72vh}}
#toast{position:fixed;left:50%;top:calc(16px + var(--safeT));transform:translate(-50%,-20px);z-index:120;background:#111820;border:1px solid #415063;border-radius:10px;padding:10px 14px;opacity:0;pointer-events:none;transition:.18s;max-width:90vw;text-align:center;font-size:12px}

#loading{position:fixed;inset:0;background:#0c1117;z-index:150;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spinner{width:40px;height:40px;border-radius:50%;border:4px solid #263341;border-top-color:#7ed957;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#rotateNotice{display:none}
@media (orientation:portrait) and (max-width:900px){
  #rotateNotice{display:flex;position:fixed;z-index:250;inset:0;background:#0d1217;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:18px}
}
@media (pointer:fine){
  #mobileControls{display:none}
  #inventoryBtn{top:calc(8px + var(--safeT));right:calc(62px + var(--safeR))}
}
@media(max-width:720px){
  .menuGrid{grid-template-columns:1fr 1fr}.bigBtn{min-height:92px;padding:13px}.bigBtn strong{font-size:15px}.bigBtn small{font-size:10px}
  .logo{margin-top:2vh}
  .invWindow{grid-template-columns:1fr 1fr;padding:9px;gap:8px}
  .invGrid{grid-template-columns:repeat(6,minmax(34px,1fr))}
  .hotSlot{width:39px;height:39px}.hotSlot canvas{width:28px;height:28px}
  #hotbar{bottom:calc(5px + var(--safeB))}
  #xpBar{bottom:calc(52px + var(--safeB))}
}

<div id="rotateNotice">↻<br><br>Stickmine se joue en paysage.<br>Tourne ton téléphone.</div>

<section id="menuScreen" class="screen">
  <div class="menuWrap">
    <div class="logo">STICK<span>MINE</span></div>

    <div class="profileBar">
      <div id="authDot" class="statusDot"></div>

      <input id="pseudoInput" maxlength="18" placeholder="Ton pseudo">
      <button id="styleBtn" class="styleBtn">STYLE<small id="collectionCount">Collection</small></button>
      <div id="authText" style="font-size:10px;color:#8fa0b4">Connexion…</div>
    </div>
    <div class="menuGrid">
      <button class="bigBtn primary" id="soloBtn"><strong>▶ SOLO</strong><small>Lance immédiatement un Skyblock local.</small></button>
      <button class="bigBtn" id="createBtn"><strong>＋ CRÉER</strong><small>Crée un Skyblock ou un monde normal, privé ou public.</small></button>
      <button class="bigBtn" id="joinBtn"><strong>⌁ REJOINDRE</strong><small>Entre le code d'un monde créé par un ami.</small></button>
      <button class="bigBtn" id="browseBtn"><strong>◎ PARTIES PUBLIQUES</strong><small>Rejoins des joueurs qui ont ouvert leur monde.</small></button>
    </div>
    <div class="menuFooter">
      <button class="secondaryBtn" id="importBtn">Importer une sauvegarde</button>
      <button class="secondaryBtn" id="helpBtn">Contrôles</button>
      <span class="version">Stickmine V3.3 · Fluid & Mobile Fix</span>
    </div>
  </div>
</section>

<section id="gameScreen" class="screen hidden">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="topHud">
      <div class="hudPanel survivalHud" id="stats"><div class="statRow" id="heartRow"></div><div class="statRow" id="foodRow"></div></div>
      <div class="hudPanel" id="roomInfo"></div>
      <button id="pauseBtn">Ⅱ</button>

    <button id="inventoryBtn"><canvas id="bagIcon" width="16" height="16"></canvas></button>
    <div id="xpLevel">1</div><div id="xpBar"><div id="xpFill"></div></div>

        <button class="act attack" id="attackAct"><canvas id="attackIcon" width="16" height="16"></canvas></button>
      </div>
    </div>
  </div>
</section>

function defaultStyle(){return {bodyColor:"#171b21",head:"head_none",face:"face_classic",back:"back_none",aura:"aura_none",unlocked:[...starterCosmetics],finds:0}}
function normalizeStyle(st){
  const d=defaultStyle(),src=st&&typeof st==="object"?st:{};
  const unlocked=[...new Set([...starterCosmetics,...(Array.isArray(src.unlocked)?src.unlocked.filter(id=>cosmeticById[id]):[])])];
  const bodyColor=bodyColors.some(c=>c.value===src.bodyColor)?src.bodyColor:d.bodyColor;
  const out={...d,...src,bodyColor,unlocked,finds:Number(src.finds)||0};
  for(const type of ["head","face","back","aura"]){if(!cosmeticById[out[type]]||cosmeticById[out[type]].type!==type||!unlocked.includes(out[type]))out[type]=d[type]}
  return out;
}
function normalizeLook(st){
  const d=defaultStyle(),src=st&&typeof st==="object"?st:{};
  const out={bodyColor:bodyColors.some(c=>c.value===src.bodyColor)?src.bodyColor:d.bodyColor};
  for(const type of ["head","face","back","aura"]){const id=src[type];out[type]=cosmeticById[id]&&cosmeticById[id].type===type?id:d[type]}
  return out;
}
function loadStyleProfile(){try{return normalizeStyle(JSON.parse(localStorage.getItem("stickmine_style_v2")||"null"))}catch{return defaultStyle()}}
function saveStyleProfile(){player.style=normalizeStyle(player.style);localStorage.setItem("stickmine_style_v2",JSON.stringify(player.style));renderProfileMini()}
function playerLookData(){const s=normalizeStyle(player.style);return {bodyColor:s.bodyColor,head:s.head,face:s.face,back:s.back,aura:s.aura}}
function mergeStyleProfile(local,remote){
  const a=normalizeStyle(local),b=normalizeStyle(remote),unlocked=[...new Set([...a.unlocked,...b.unlocked])];
  return normalizeStyle({...a,unlocked,finds:Math.max(a.finds||0,b.finds||0)});
}

function gearPower(g){
  if(!g)return 0;
  return Math.round(gearTypes[g.type].base*(materialMult[g.material]||1)*rarityData[g.rarity].mult*10)/10;
}
function rollRarity(){
  const r=Math.random();
  return r<.03?"legendary":r<.10?"epic":r<.25?"rare":r<.52?"uncommon":"common";
}
function makeGear(type,material="wood",rarity=rollRarity()){
  const power=gearPower({type,material,rarity});
  return {uid:crypto.randomUUID?.()||Math.random().toString(36).slice(2),type,material,rarity,
    enchant:Math.random()<.32?enchants[Math.floor(Math.random()*enchants.length)]:null,
    bonus:Math.round(power*rand(.05,.22)*10)/10};
}

function hash(seed,x,y=0){

function baseBlockAt(x,y){

    const dx=Math.abs(x);
    if(dx<=7){
      const top=30+Math.floor(Math.abs(x)*.23);
      if(y===top)return BLOCK.GRASS;
      if(y>top&&y<=top+3)return BLOCK.DIRT;
      if(y>top+3&&y<=38-Math.floor(dx*.45))return BLOCK.STONE;
    }
    // starter island props
    if((x===-4||x===4) && y>=26&&y<=29)return x<0?BLOCK.NAT_OAK_LOG:BLOCK.NAT_BIRCH_LOG;
    const tree=(tx,kind)=>{
      const top=26; const dx2=Math.abs(x-tx),dy=y-top;
      if(dy>=-2&&dy<=1&&dx2<=2 && !(dx2===2&&Math.abs(dy)===2))return kind;
      return null;
    };
    let l=tree(-4,BLOCK.OAK_LEAVES);if(l)return l;
    l=tree(4,BLOCK.BIRCH_LEAVES);if(l)return l;
    if(x===0&&y===29)return BLOCK.CRAFT;
    if(x===-7&&y===29)return BLOCK.WATER;
    if(x===7&&y===31)return BLOCK.LAVA;
    return BLOCK.AIR;
  }
  const seed=currentWorld?.seed||12345;
  if(y===95)return BLOCK.BEDROCK;
  const sy=surfaceY(x,seed);
  // trees are deterministic overlays
  for(let tx=x-2;tx<=x+2;tx++){
    if(hash(seed,tx,1001)>.965){
      const tsy=surfaceY(tx,seed);
      if(y>=tsy-4&&y<tsy && x===tx)return hash(seed,tx,1002)>.5?BLOCK.NAT_BIRCH_LOG:BLOCK.NAT_OAK_LOG;
      if(y>=tsy-6&&y<=tsy-3&&Math.abs(x-tx)<=2){
        const birch=hash(seed,tx,1002)>.5;
        if(!(Math.abs(x-tx)===2&&y===tsy-6))return birch?BLOCK.BIRCH_LEAVES:BLOCK.OAK_LEAVES;
      }
    }
  }
  if(y<sy)return BLOCK.AIR;
  if(y===sy)return BLOCK.GRASS;
  if(y<=sy+3)return BLOCK.DIRT;
  if(y>84 && hash(seed,x,y)>.985)return BLOCK.LAVA;
  if(y>45 && hash(seed,x,y+10)>.992)return BLOCK.WATER;
  const r=hash(seed,x,y);
  if(y>70&&r>.985)return BLOCK.DIAMOND;
  if(y>55&&r>.975)return BLOCK.GOLD;
  if(y>40&&r>.94)return BLOCK.IRON;
  if(y>34&&r>.90)return BLOCK.COAL;

  for(let i=0;i<player.inv.length&&count>0;i++){let st=player.inv[i];if(st&&st.id===id&&st.count<max){let add=Math.min(max-st.count,count);st.count+=add;count-=add}}
  for(let i=0;i<player.inv.length&&count>0;i++){if(!player.inv[i]){let add=Math.min(max,count);player.inv[i]={id,count:add};count-=add}}
  if(count>0)toast("Inventaire plein");renderHotbar();if(inventoryOpen)renderInventory();
}
function removeItem(id,count=1){
  let have=count;
  for(let i=player.inv.length-1;i>=0&&have>0;i--){
    let s=player.inv[i];if(s?.id===id){let take=Math.min(s.count,have);s.count-=take;have-=take;if(s.count<=0)player.inv[i]=null}
  }

}

function gainXp(n){

  while(player.xp>=need){player.xp-=need;player.level++;player.maxHp+=3;player.hp=player.maxHp;toast(`Niveau ${player.level} !`);sound("craft");need=20+player.level*15}
}
function armor(){
  return ["head","chest","legs","boots"].reduce((n,s)=>n+(player.equip[s]?gearPower(player.equip[s])+player.equip[s].bonus:0),0);
}
function toolSpeed(blockId){
  const def=blockDefs[blockId],sel=selectedItem(),it=sel?itemDefs[sel.id]:null;
  if(it?.tool&&it.tool===def?.tool)return it.speed||1.5;
  if(!def?.tool)return 1;
  const legacy=def.tool==="pickaxe"?player.equip.pickaxe:null;
  if(legacy)return 1+gearPower(legacy)*.62+(legacy.enchant==="Célérité"?.65:0);
  return .55;
}
function weaponDamage(){
  const sel=selectedItem(),it=sel?itemDefs[sel.id]:null;if(it?.tool==="sword")return it.damage||6;
  const g=player.equip.weapon;return g?4+gearPower(g)*1.7+g.bonus+(g.enchant==="Puissance"?3:0):3;
}

function rectCollides(x,y,w,h){
  const x0=Math.floor(x/TILE),x1=Math.floor((x+w-1)/TILE),y0=Math.floor(y/TILE),y1=Math.floor((y+h-1)/TILE),me={x,y,w,h};
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const id=getBlock(tx,ty);if(!isSolid(id))continue;
    for(const r of blockCollisionRects(id,tx,ty))if(rectsOverlap(me,r))return true;
  }
  return false;
}
function movePlayer(dt){
  if(paused||inventoryOpen)return;
  let dir=0;
  if(keys["a"]||keys["arrowleft"])dir-=1;if(keys["d"]||keys["arrowright"])dir+=1;
  dir+=joy.x;dir=clamp(dir,-1,1);
  const accel=player.onGround?14:7;
  player.vx=lerp(player.vx,dir*MOVE_SPEED,clamp(accel*dt,0,1));
  if(Math.abs(dir)>.1)player.facing=Math.sign(dir);
  const cx=Math.floor((player.x+player.w/2)/TILE),cy=Math.floor((player.y+player.h/2)/TILE);
  player.onLadder=!!blockDefs[getBlock(cx,cy)]?.ladder;
  const liquid=isLiquid(getBlock(cx,cy)),wasSwim=player.swim;
  player.swim=!!liquid;
  if(player.onLadder){
    player.vy=0;
    let v=0;if(keys["w"]||keys["arrowup"])v-=1;if(keys["s"]||keys["arrowdown"])v+=1;v+=joy.y;
    player.vy=v*120;
  }else if(player.swim){
    player.vy+=GRAVITY*dt*.14;
    const up=(keys[" "]||keys["w"]||keys["arrowup"]||joy.y<-.45),down=(keys["s"]||keys["arrowdown"]||joy.y>.55);
    if(up)player.vy=lerp(player.vy,-176,clamp(dt*8,0,1));else if(down)player.vy=lerp(player.vy,116,clamp(dt*5,0,1));
    player.vy=clamp(player.vy,-210,138);player.vx=clamp(player.vx,-145,145);
  }else{
    if(wasSwim)player.vy=clamp(player.vy,-215,240);
    player.vy+=GRAVITY*dt;
  }
  // horizontal
  let nx=player.x+player.vx*dt;
  if(!rectCollides(nx,player.y,player.w,player.h))player.x=nx;else{
    const stepHeight=player.onGround?16:(player.swim?18:0),canStep=stepHeight&&!rectCollides(nx,player.y-stepHeight,player.w,player.h);
    if(canStep){player.y-=stepHeight;player.x=nx}else{
      const step=Math.sign(player.vx);
      for(let i=0;i<Math.abs(player.vx*dt);i++){if(!rectCollides(player.x+step,player.y,player.w,player.h))player.x+=step;else break}
      player.vx=0;
    }
  }
  // vertical
  player.onGround=false;
  let ny=player.y+player.vy*dt;
  if(!rectCollides(player.x,ny,player.w,player.h))player.y=ny;else{
    const step=Math.sign(player.vy);
    for(let i=0;i<Math.abs(player.vy*dt);i++){if(!rectCollides(player.x,player.y+step,player.w,player.h))player.y+=step;else break}
    if(player.vy>0)player.onGround=true;player.vy=0;
  }
  const feet=getBlock(Math.floor((player.x+player.w/2)/TILE),Math.floor((player.y+player.h-2)/TILE));
  if(blockDefs[feet]?.liquid==="lava")damagePlayer(18*dt);
  if(currentWorld?.mode==="skyblock"&&player.y>55*TILE){damagePlayer(999)}else if(player.y>110*TILE){damagePlayer(999)}
  player.attackCd=Math.max(0,player.attackCd-dt);player.hurtCd=Math.max(0,player.hurtCd-dt);
}
function updateSurvival(dt){
  if(paused)return;const moving=Math.abs(player.vx)>30;player.hunger=clamp(player.hunger-dt*(moving?.13:.075),0,player.maxHunger);
  player.starveCd=Math.max(0,(player.starveCd||0)-dt);if(player.hunger<=0&&player.starveCd<=0){damagePlayer(4);player.starveCd=2.4}
  if(player.hunger>82&&player.hp<player.maxHp)player.hp=Math.min(player.maxHp,player.hp+dt*.45);

function jump(){
  if(!gameRunning||paused||inventoryOpen)return;
  if(player.onGround||player.onLadder){player.vy=-JUMP;player.onGround=false;sound("jump")}
  else if(player.swim){player.vy=-205;sound("jump")}
}
function damagePlayer(n){
  if(player.hurtCd>0&&n<50)return;
  const reduction=clamp(armor()*.025,0,.68);
  player.hp-=n*(1-reduction);player.hurtCd=.45;cam.shake=8;sound("hurt");
  if(player.hp<=0)respawn();
}
function respawn(){
  const sp=findSpawn();player.x=sp.x;player.y=sp.y;player.vx=player.vy=0;player.hp=player.maxHp;player.hunger=Math.max(55,player.hunger||0);
  toast("Tu es mort. Retour au spawn.");

function validReach(tx,ty,reach=4.3){
  const px=(player.x+player.w/2)/TILE,py=(player.y+player.h/2)/TILE;
  return Math.hypot(tx+.5-px,ty+.5-py)<=reach;
}
function updateAim(){
  mouse.worldX=mouse.x+cam.x;mouse.worldY=mouse.y+cam.y;
  mouse.tileX=Math.floor(mouse.worldX/TILE);mouse.tileY=Math.floor(mouse.worldY/TILE);

function mobileAimVector(){
  let ax=joy.x,ay=joy.y,mag=Math.hypot(ax,ay);
  if(mag<.30){ax=player.facing;ay=0;mag=1}
  else{const a=Math.atan2(ay,ax),snap=Math.round(a/(Math.PI/4))*(Math.PI/4);ax=Math.cos(snap);ay=Math.sin(snap)}
  return {x:ax,y:ay};
}
function hasBuildAnchor(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>getBlock(x+dx,y+dy)!==BLOCK.AIR)}
function autoTarget(mode="mine"){
  const px=(player.x+player.w/2)/TILE,py=(player.y+player.h*.46)/TILE,a=mobileAimVector();
  if(mode==="place"){
    let best=null,bestScore=-1e9;
    for(let y=Math.floor(py-4);y<=Math.floor(py+4);y++)for(let x=Math.floor(px-4);x<=Math.floor(px+4);x++){
      if(getBlock(x,y)!==BLOCK.AIR||!validReach(x,y,4.25)||!hasBuildAnchor(x,y))continue;
      const vx=x+.5-px,vy=y+.5-py,dist=Math.hypot(vx,vy);if(dist<.65)continue;
      const dot=(vx*a.x+vy*a.y)/(dist||1);if(dot<.22)continue;
      const score=dot*5-dist*.34-(Math.abs(vy)>2.7?.35:0);
      if(score>bestScore){bestScore=score;best={x,y}}
    }
    if(best)return best;
    return {x:Math.floor(px+a.x*1.55),y:Math.floor(py+a.y*1.55)};
  }
  let best=null,bestScore=-1e9;
  for(let y=Math.floor(py-4);y<=Math.floor(py+4);y++)for(let x=Math.floor(px-4);x<=Math.floor(px+4);x++){
    const id=getBlock(x,y);if(id===BLOCK.AIR||blockDefs[id]?.liquid||!validReach(x,y,4.25))continue;
    const vx=x+.5-px,vy=y+.5-py,dist=Math.hypot(vx,vy);if(dist<.45)continue;
    const dot=(vx*a.x+vy*a.y)/(dist||1);if(dot<.30)continue;
    const score=dot*5-dist*.45;
    if(score>bestScore){bestScore=score;best={x,y}}

  return best||{x:Math.floor(px+a.x*1.4),y:Math.floor(py+a.y*1.4)};
}
function mineHeld(dt,forceAuto=false){

  if(!validReach(t.x,t.y))return resetMining();
  const id=getBlock(t.x,t.y),def=blockDefs[id];
  if(!def||id===BLOCK.AIR||def.hard>=999||def.liquid)return resetMining();
  const k=pkey(t.x,t.y);

  mining.progress+=dt*toolSpeed(id)/def.hard;

function resetMining(){mining.key=null;mining.progress=0}
async function breakBlock(x,y,id){

    const bottomY=def.half==="top"?y+1:y,topY=bottomY-1,drop=def.door==="oak"?"oak_door":"birch_door";
    await setBlockWorld(x,bottomY,BLOCK.AIR);await setBlockWorld(x,topY,BLOCK.AIR);sound("mine");addItem(drop,1);gainXp(.25);return;
  }
  await setBlockWorld(x,y,BLOCK.AIR);sound("mine");
  if(id===BLOCK.CHEST&&currentWorld?.chests)delete currentWorld.chests[pkey(x,y)];
  if(def?.crop){
    if(def.crop==="wheat"){if(def.stage>=4){addItem("wheat",1+Math.floor(Math.random()*2));addItem("wheat_seeds",1+Math.floor(Math.random()*3))}else addItem("wheat_seeds",1)}
    else if(def.crop==="carrot"){addItem("carrot",def.stage>=4?2+Math.floor(Math.random()*3):1)}
  }else if(def?.drop){let qty=1;if(player.equip.pickaxe?.enchant==="Fortune"&&Math.random()<.26)qty++;addItem(def.drop,qty)}
  if(id===BLOCK.OAK_LEAVES){if(Math.random()<.20)addItem("oak_sapling",1);if(Math.random()<.055)addItem("apple",1)}
  if(id===BLOCK.BIRCH_LEAVES&&Math.random()<.22)addItem("birch_sapling",1);
  if(id===BLOCK.GRASS&&Math.random()<.32)addItem("wheat_seeds",1);
  gainXp(def?.xp||.25);
  if(id===BLOCK.FLOWER_RED||id===BLOCK.FLOWER_BLUE)unlockCosmetic("head_flower");
  const findChance=id===BLOCK.DIAMOND?.22:id===BLOCK.GOLD?.09:id===BLOCK.IRON?.035:id===BLOCK.COAL?.012:0;if(findChance)tryCosmeticFind(findChance);
}
async function toggleDoorAt(x,y,id){

  if(d.door==="oak"){await setBlockWorld(x,bottomY,opening?BLOCK.OAK_DOOR_OPEN_B:BLOCK.OAK_DOOR_B);await setBlockWorld(x,topY,opening?BLOCK.OAK_DOOR_OPEN_T:BLOCK.OAK_DOOR_T)}

function chestStore(){currentWorld.chests=currentWorld.chests||{};return currentWorld.chests}
function emptySlots(n=24){return Array.from({length:n},()=>null)}
function getChestSlots(x,y){const k=pkey(x,y),store=chestStore();if(!store[k])store[k]=emptySlots(24);while(store[k].length<24)store[k].push(null);return store[k]}

function openChestAt(x,y){

    bg.innerHTML="";player.inv.forEach((st,i)=>{const el=chestSlotHtml(st);el.onclick=()=>{if(st){const left=putInChest(slots,st.id,st.count);if(left===0)player.inv[i]=null;else player.inv[i].count=left;renderHotbar();render();saveNow()}};bg.appendChild(el)});

function putInChest(slots,id,count){
  let left=count; for(const st of slots){if(st&&st.id===id&&st.count<99){const take=Math.min(99-st.count,left);st.count+=take;left-=take;if(left<=0)return 0}}

  const t=forceAuto?autoTarget("mine"):{x:mouse.tileX,y:mouse.tileY};if(!validReach(t.x,t.y,4.6))return false;const id=getBlock(t.x,t.y);

function drawBlock(id,sx,sy,x,y){

    const h=above?TILE:(level?Math.max(10,TILE-level*5):TILE);
    const srcH=Math.max(1,Math.round(TEX*h/TILE));

  $("#closeStyle").onclick=()=>{if(returnToPause)openPause();else closeModal()};renderStyleLocker(returnToPause);
}

function cleanWorldData(w){
  return {
    mode:w.mode||"skyblock",seed:Number(w.seed)||Math.floor(Math.random()*1e9),
    name:(w.name||"Mon monde").slice(0,28),public:!!w.public,hostUid:w.hostUid||user?.uid||"",
    createdAt:w.createdAt||Date.now(),hostOnline:w.hostOnline!==false,maxPlayers:w.maxPlayers||4,time:Number.isFinite(w.time)?w.time:.24
  };
}
function generateCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";
  for(let i=0;i<16;i++){if(i&&i%4===0)s+="-";s+=chars[Math.floor(Math.random()*chars.length)]}return s;
}
function normalizeCode(s){return (s||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").match(/.{1,4}/g)?.join("-")||""}

async function createOnlineWorld(opts){
  if(!user)return toast("Firebase n'est pas encore connecté");
  loading("Création du monde…");
  let code=generateCode();
  for(let i=0;i<4;i++){const snap=await get(ref(db,`worlds/${code}/meta`));if(!snap.exists())break;code=generateCode()}
  const meta={name:opts.name||"Mon monde",mode:opts.mode||"skyblock",seed:Math.floor(Math.random()*1e9),public:!!opts.public,hostUid:user.uid,createdAt:serverTimestamp(),lastActive:serverTimestamp(),hostOnline:true,maxPlayers:4,time:.24};
  await set(ref(db,`worlds/${code}/meta`),meta);
  await enterWorld(code,{...meta,createdAt:Date.now()},true,false);
}
async function joinOnlineWorld(code){
  code=normalizeCode(code);if(!code)return;
  loading("Recherche du monde…");
  try{
    const snap=await get(ref(db,`worlds/${code}/meta`));
    if(!snap.exists()){unloading();toast("Monde introuvable");return}
    const meta=cleanWorldData(snap.val());
    if(meta.hostOnline===false){unloading();toast("L'hôte est hors ligne");return}
    await enterWorld(code,meta,meta.hostUid===user.uid,false);
  }catch(e){unloading();toast("Impossible de rejoindre : "+e.message)}
}
async function enterWorld(code,meta,host,solo){
  cleanupListeners();worldCode=code;currentWorld=cleanWorldData(meta);isHost=host;isSolo=solo;worldTime=currentWorld.time??.24;patches={};mobs={};remotePlayers={};projectiles=[];
  let saved=null;
  if(solo){
    const raw=localStorage.getItem(`stickmine_world_${code}`);if(raw){try{saved=JSON.parse(raw);patches=saved.patches||{};if(Number.isFinite(saved.meta?.time)){worldTime=saved.meta.time;currentWorld.time=worldTime}}catch{}}
  }else{
    const ps=await get(ref(db,`worlds/${code}/patches`));patches=ps.val()||{};
  }
  const cleanedFlows=await purgeLegacyFluidFlood(!solo&&host);
  resetPlayerForWorld(true);
  if(solo&&saved?.player)loadPlayerData(saved.player);
  repairLoadedPlayerPosition();
  if(!solo&&user){
    const pSnap=await get(ref(db,`worlds/${code}/players/${user.uid}`));
    if(pSnap.exists())loadPlayerData(pSnap.val());
    if(repairLoadedPlayerPosition())toast("Position invalide réparée · retour au spawn",2600);
    const pRef=ref(db,`worlds/${code}/players/${user.uid}`);
    await onDisconnect(pRef).remove();
    await set(pRef,playerNetData(true));
    const prRef=ref(db,`worlds/${code}/players`);
    listeners.push(onValue(prRef,s=>{remotePlayers=s.val()||{}}));
    const patchRef=ref(db,`worlds/${code}/patches`);
    listeners.push(onValue(patchRef,s=>{patches=s.val()||{}}));
    const mobRef=ref(db,`worlds/${code}/mobs`);
    listeners.push(onValue(mobRef,s=>{if(!isHost)mobs=s.val()||{}}));
    const metaRef=ref(db,`worlds/${code}/meta`);
    listeners.push(onValue(metaRef,s=>{
      const m=s.val();if(!m)return;
      currentWorld={...currentWorld,...cleanWorldData(m)};
      if(!isHost&&m.hostOnline===false){toast("L'hôte s'est déconnecté",4000);setTimeout(leaveWorld,2500)}
    }));
    if(isHost){
      await update(metaRef,{hostOnline:true,lastActive:serverTimestamp()});
      onDisconnect(ref(db,`worlds/${code}/meta/hostOnline`)).set(false);
    }
  }
  $("#menuScreen").classList.add("hidden");$("#gameScreen").classList.remove("hidden");gameRunning=true;paused=false;inventoryOpen=false;
  $("#inventoryPanel").classList.add("hidden");renderHotbar();if(cleanedFlows&&solo)saveNow();unloading();toast(cleanedFlows?`Ancienne coulée nettoyée · ${cleanedFlows} blocs`:(currentWorld.mode==="skyblock"?"Bienvenue sur ton Skyblock":"Monde généré"));
  lastTime=performance.now();requestAnimationFrame(loop);
}
function loadPlayerData(d){
  if(Number.isFinite(d.x))player.x=d.x;if(Number.isFinite(d.y))player.y=d.y;
  player.hp=d.hp||player.maxHp;player.maxHp=d.maxHp||100;player.hunger=Number.isFinite(d.hunger)?d.hunger:100;player.level=d.level||1;player.xp=d.xp||0;
  if(Array.isArray(d.inv))player.inv=d.inv;
  if(Array.isArray(d.gearBag))player.gearBag=d.gearBag;
  if(d.equip)player.equip={...player.equip,...d.equip};
  if(d.style){player.style=mergeStyleProfile(player.style,d.style);saveStyleProfile()}
}
function playerNetData(full=false){
  const base={pseudo:player.pseudo,x:Math.round(player.x*10)/10,y:Math.round(player.y*10)/10,facing:player.facing,hp:Math.round(player.hp),hunger:Math.round(player.hunger),level:player.level,held:selectedItem()?.id||null,look:playerLookData(),lastSeen:Date.now()};
  if(full)Object.assign(base,{maxHp:player.maxHp,maxHunger:player.maxHunger,xp:player.xp,inv:player.inv,gearBag:player.gearBag,equip:player.equip,style:normalizeStyle(player.style)});
  return base;
}
async function saveNow(){
  if(!gameRunning)return;
  if(isSolo){
    localStorage.setItem(`stickmine_world_${worldCode}`,JSON.stringify({meta:currentWorld,patches,player:playerNetData(true),savedAt:Date.now()}));
  }else if(user){
    try{
      await set(ref(db,`worlds/${worldCode}/players/${user.uid}`),playerNetData(true));
      if(isHost)await update(ref(db,`worlds/${worldCode}/meta`),{lastActive:serverTimestamp(),hostOnline:true,time:worldTime});
    }catch{}
  }
}
function cleanupListeners(){for(const u of listeners)try{u()}catch{}listeners=[]}
async function leaveWorld(){
  if(!gameRunning)return;
  await saveNow();
  if(!isSolo&&isHost)try{await update(ref(db,`worlds/${worldCode}/meta`),{hostOnline:false,lastActive:serverTimestamp()})}catch{}
  cleanupListeners();gameRunning=false;paused=false;inventoryOpen=false;$("#gameScreen").classList.add("hidden");$("#inventoryPanel").classList.add("hidden");$("#menuScreen").classList.remove("hidden");
  currentWorld=null;worldCode="";mobs={};remotePlayers={};projectiles=[];patches={};
}

async function exportWorld(){
  if(!currentWorld)return;
  loading("Création de la sauvegarde…");
  let data;
  if(isSolo)data={version:1,meta:currentWorld,patches,players:{local:playerNetData(true)}};
  else{
    const snap=await get(ref(db,`worlds/${worldCode}`));data={version:1,...snap.val(),exportedAt:Date.now()};
  }
  const json=JSON.stringify(data);
  const code="SM1:"+btoa(unescape(encodeURIComponent(json)));
  try{await navigator.clipboard.writeText(code);toast("Sauvegarde copiée dans le presse-papiers",2500)}
  catch{prompt("Copie ce code de sauvegarde :",code)}
  unloading();
}
async function importWorldCode(code){
  try{
    if(!code?.startsWith("SM1:"))throw new Error("Format inconnu");
    const data=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));
    if(!data.meta)throw new Error("Sauvegarde incomplète");
    loading("Import de la sauvegarde…");
    if(user){
      const newCode=generateCode(),meta={...cleanWorldData(data.meta),hostUid:user.uid,hostOnline:true,public:false,createdAt:serverTimestamp(),lastActive:serverTimestamp()};
      await set(ref(db,`worlds/${newCode}/meta`),meta);
      await set(ref(db,`worlds/${newCode}/patches`),data.patches||{});
      if(data.players){
        // preserve only local-like inventory by attaching first player to importer
        const first=Object.values(data.players)[0];if(first)await set(ref(db,`worlds/${newCode}/players/${user.uid}`),{...first,pseudo:player.pseudo});
      }
      await enterWorld(newCode,{...meta,createdAt:Date.now()},true,false);
    }else throw new Error("Firebase non connecté");
  }catch(e){unloading();toast("Import impossible : "+e.message,3000)}
}

async function openPublicBrowser(){
  modal(`<h2>Parties publiques</h2><div id="publicRooms" class="publicList"><div style="color:#8fa0b4">Chargement…</div></div><div class="modalActions"><button id="cancelModal">Fermer</button><button class="go" id="refreshRooms">Actualiser</button></div>`);
  $("#cancelModal").onclick=closeModal;$("#refreshRooms").onclick=loadPublicRooms;loadPublicRooms();
}
async function loadPublicRooms(){
  const box=$("#publicRooms");if(!box)return;box.innerHTML=`<div style="color:#8fa0b4">Chargement…</div>`;
  try{
    const snap=await get(ref(db,"worlds")),all=snap.val()||{},arr=[];
    for(const [code,w] of Object.entries(all)){if(w.meta?.public&&w.meta?.hostOnline!==false)arr.push({code,...w.meta,count:Object.keys(w.players||{}).length})}
    arr.sort((a,b)=>(b.lastActive||0)-(a.lastActive||0));
    box.innerHTML=arr.length?"":`<div style="color:#8fa0b4">Aucune partie publique pour le moment.</div>`;
    arr.slice(0,25).forEach(r=>{
      const d=document.createElement("div");d.className="roomCard";d.innerHTML=`<div class="grow"><b>${escapeHtml(r.name||"Monde")}</b><small>${r.mode==="normal"?"Normal":"Skyblock"} · ${r.count}/${r.maxPlayers||4} · ${r.code}</small></div><button>Rejoindre</button>`;
      d.querySelector("button").onclick=()=>{closeModal();joinOnlineWorld(r.code)};box.appendChild(d);
    });
  }catch(e){box.innerHTML=`<div style="color:#ff7b82">Impossible de charger les salons.</div>`}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}

function loading(text){$("#loadingText").textContent=text;$("#loading").classList.remove("hidden")}
function unloading(){$("#loading").classList.add("hidden")}

function loop(now){
  if(!gameRunning)return;
  const dt=Math.min(.033,(now-lastTime)/1000);lastTime=now;
  if(!paused){
    movePlayer(dt);
    if(mouse.down)mineHeld(dt,false);else if(keys["x"])mineHeld(dt,true);else resetMining();
    updateWorldSystems(dt);updateMobs(dt);updateProjectiles(dt);updateFluids(dt);
    autosaveTimer+=dt;networkTimer+=dt;mobNetworkTimer+=dt;
    if(autosaveTimer>5){autosaveTimer=0;saveNow()}
    if(!isSolo&&user&&networkTimer>.18){networkTimer=0;set(ref(db,`worlds/${worldCode}/players/${user.uid}`),playerNetData(false)).catch(()=>{})}
    if(!isSolo&&isHost&&mobNetworkTimer>.8){mobNetworkTimer=0;set(ref(db,`worlds/${worldCode}/mobs`),mobs).catch(()=>{})}
  }
  updateAim();draw();updateHud();requestAnimationFrame(loop);
}

function openPause(){
  paused=true;
  modal(`<h2>Pause</h2>
    <div style="font-size:12px;color:#aab6c5;line-height:1.7">
      Monde : <b>${escapeHtml(currentWorld?.name||"")}</b><br>
      ${isSolo?"Sauvegarde locale":`Code : <b style="user-select:all">${worldCode}</b>`}
    </div>
    <div class="modalActions" style="flex-wrap:wrap">
      <button id="resume">Reprendre</button>
      <button id="pauseStyle">Style</button>
      <button id="exportSave">Exporter</button>
      <button id="quitGame" style="border-color:#7c3d43">Quitter</button>
    </div>`);
  $("#resume").onclick=()=>{closeModal();paused=false};
  $("#pauseStyle").onclick=()=>openStyleLocker(true);
  $("#exportSave").onclick=exportWorld;
  $("#quitGame").onclick=()=>{closeModal();leaveWorld()};
}

function setupUI(){
  $("#pseudoInput").value=player.pseudo;
  renderProfileMini();
  $("#styleBtn").onclick=()=>openStyleLocker(false);
  $("#profileAvatar").onclick=()=>openStyleLocker(false);
  $("#pseudoInput").addEventListener("change",()=>{
    let v=$("#pseudoInput").value.trim().replace(/[^\p{L}\p{N}_ -]/gu,"").slice(0,18)||"Mineur";
    player.pseudo=v;$("#pseudoInput").value=v;localStorage.setItem("stickmine_pseudo",v);renderProfileMini();
    if(gameRunning&&!isSolo&&user)set(ref(db,`worlds/${worldCode}/players/${user.uid}`),playerNetData(false)).catch(()=>{});
  });
  $("#soloBtn").onclick=()=>{
    const meta={name:"Skyblock local",mode:"skyblock",seed:Math.floor(Math.random()*1e9),public:false,hostUid:"local",createdAt:Date.now(),hostOnline:true,maxPlayers:1};
    const code="LOCAL-"+(localStorage.getItem("stickmine_last_solo")||Math.floor(Math.random()*1e7));
    localStorage.setItem("stickmine_last_solo",code.replace("LOCAL-",""));enterWorld(code,meta,true,true);
  };
  $("#createBtn").onclick=()=>{
    modal(`<h2>Créer une partie</h2>
      <div class="field"><label>Nom du monde</label><input id="worldName" maxlength="28" value="${escapeHtml(player.pseudo)}'s world"></div>
      <div class="row">
        <div class="field"><label>Mode</label><select id="worldMode"><option value="skyblock">Skyblock</option><option value="normal">Monde normal</option></select></div>
        <div class="field"><label>Accès</label><select id="worldPublic"><option value="0">Privé</option><option value="1">Public</option></select></div>
      </div>
      <div style="font-size:10px;color:#8191a4">Privé : seuls les joueurs avec le code peuvent rejoindre. Public : le monde apparaît dans la liste.</div>
      <div class="modalActions"><button id="cancelModal">Annuler</button><button class="go" id="doCreate">Créer</button></div>`);
    $("#cancelModal").onclick=closeModal;$("#doCreate").onclick=()=>{const opts={name:$("#worldName").value.trim()||"Mon monde",mode:$("#worldMode").value,public:$("#worldPublic").value==="1"};closeModal();createOnlineWorld(opts)}
  };
  $("#joinBtn").onclick=()=>{
    modal(`<h2>Rejoindre</h2><div class="field"><label>Code du monde</label><input id="joinCode" autocomplete="off" autocapitalize="characters" placeholder="ABCD-EFGH-JKLM-NPQR"></div><div class="modalActions"><button id="cancelModal">Annuler</button><button class="go" id="doJoin">Rejoindre</button></div>`);
    $("#cancelModal").onclick=closeModal;$("#doJoin").onclick=()=>{const c=$("#joinCode").value;closeModal();joinOnlineWorld(c)}
  };
  $("#browseBtn").onclick=openPublicBrowser;
  $("#importBtn").onclick=()=>{
    modal(`<h2>Importer une sauvegarde</h2><div class="field"><label>Code commençant par SM1:</label><input id="backupCode" placeholder="SM1:..."></div><div class="modalActions"><button id="cancelModal">Annuler</button><button class="go" id="doImport">Importer</button></div>`);
    $("#cancelModal").onclick=closeModal;$("#doImport").onclick=()=>{const c=$("#backupCode").value.trim();closeModal();importWorldCode(c)}
  };
  $("#helpBtn").onclick=()=>{
    modal(`<h2>Contrôles</h2><div style="font-size:12px;line-height:1.8;color:#c3cfdb">
      <b>PC</b><br>Q/D ou A/D : marcher · Espace : sauter · Clic gauche : miner · Clic droit : poser · F : attaquer · E : inventaire · 1–9 : hotbar<br><br>
      <b>Mobile</b><br>Joystick gauche · ↑ saut · ⛏ mine · ▣ utilise l'objet (poser, manger, labourer) · ⚔ attaque · 🎒 sac.<br><br>
      Touche une table de craft pour ouvrir directement les recettes. Les aliments se mangent avec ▣ quand ils sont sélectionnés.
      </div><div class="modalActions"><button id="cancelModal">Fermer</button></div>`);
    $("#cancelModal").onclick=closeModal;
  };
  $("#pauseBtn").onclick=openPause;$("#inventoryBtn").onclick=()=>toggleInventory(true,"bag");$("#closeInv").onclick=()=>toggleInventory(false);document.querySelectorAll(".invTab").forEach(b=>b.onclick=()=>setInventoryTab(b.dataset.tab));
}
setupUI();

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(!gameRunning)return;
  if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();
  if(e.key===" ")jump();
  if(e.key.toLowerCase()==="e")toggleInventory(undefined,"bag");
  if(e.key.toLowerCase()==="f")attack();
  if(e.key.toLowerCase()==="x")mining.key=null;
  if(/^[1-9]$/.test(e.key)){selectedSlot=Number(e.key)-1;renderHotbar()}
  if(e.key==="Escape"){if(inventoryOpen)toggleInventory(false);else openPause()}
});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});

canvas.addEventListener("pointermove",e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;updateAim()});
canvas.addEventListener("pointerdown",e=>{
  if(!gameRunning||inventoryOpen||paused)return;
  const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;updateAim();
  if(e.pointerType==="mouse"){
    if(e.button===0)mouse.down=true;if(e.button===2){e.preventDefault();useSelected(false)}
  }else{
    if(interactTarget(false))return;mouse.down=true;setTimeout(()=>{if(e.buttons===0)mouse.down=false},120);
  }
});
addEventListener("pointerup",()=>{mouse.down=false;mouse.right=false;resetMining()});
canvas.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dblclick",e=>{if(!e.target.closest("input,textarea"))e.preventDefault()},{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("selectstart",e=>{if(!e.target.closest("input,textarea"))e.preventDefault()},{passive:false});
document.addEventListener("contextmenu",e=>{if(!e.target.closest("input,textarea"))e.preventDefault()});

function setupHold(btn,down,up=()=>{}){
  btn.addEventListener("pointerdown",e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);down(e)});
  btn.addEventListener("pointerup",e=>{e.preventDefault();up(e)});
  btn.addEventListener("pointercancel",up);
}
setupHold($("#jumpAct"),()=>jump());
let mineAuto=false;
setupHold($("#mineAct"),()=>{mineAuto=true;keys["x"]=true},()=>{mineAuto=false;keys["x"]=false;resetMining()});
setupHold($("#placeAct"),()=>useSelected(true));
setupHold($("#attackAct"),()=>attack());

const jb=$("#joyBase"),jk=$("#joyKnob");
function joyMove(e){
  const r=jb.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=43,mag=Math.hypot(dx,dy)||1,q=Math.min(1,max/mag);
  const ox=dx*q,oy=dy*q;jk.style.transform=`translate(${ox}px,${oy}px)`;joy.x=clamp(dx/max,-1,1);joy.y=clamp(dy/max,-1,1);
}
jb.addEventListener("pointerdown",e=>{joy.active=true;joy.id=e.pointerId;jb.setPointerCapture?.(e.pointerId);joyMove(e)});
jb.addEventListener("pointermove",e=>{if(joy.active&&e.pointerId===joy.id)joyMove(e)});
function joyEnd(){joy.active=false;joy.x=joy.y=0;jk.style.transform="translate(0,0)"}
jb.addEventListener("pointerup",joyEnd);jb.addEventListener("pointercancel",joyEnd);

document.addEventListener("visibilitychange",()=>{if(document.hidden&&gameRunning)saveNow()});
addEventListener("beforeunload",()=>{if(gameRunning)saveNow()});

makeTextures();
function decorateMenuIcons(){const map=[["#soloBtn",BLOCK.GRASS],["#createBtn",BLOCK.CRAFT],["#joinBtn",BLOCK.CHEST],["#browseBtn",BLOCK.DIAMOND]];for(const [sel,id] of map){const b=$(sel);if(!b||b.querySelector("canvas.menuIcon"))continue;const c=copyCanvas(getBlockTexture(id,1,1));c.className="menuIcon";b.prepend(c)}const logo=$(".logo");if(logo&&!logo.querySelector(".logoPick")){const c=copyCanvas(getItemTex("iron_pickaxe"));c.className="logoPick";logo.prepend(c)}paintCanvas($("#mineIcon"),getItemTex("iron_pickaxe"));paintCanvas($("#attackIcon"),getItemTex("iron_sword"));paintCanvas($("#bagIcon"),getBlockTexture(BLOCK.CHEST,0,0))}
decorateMenuIcons();renderHotbar();

async function initFirebase(){
  try{
    await setPersistence(auth,browserLocalPersistence);
    onAuthStateChanged(auth,u=>{
      user=u;authReady=true;$("#authDot").classList.toggle("on",!!u);$("#authText").textContent=u?"Firebase connecté":"Hors ligne";
      if(u)unloading();
    });
    if(!auth.currentUser)await signInAnonymously(auth);
  }catch(e){
    console.error(e);$("#authText").textContent="Firebase indisponible";unloading();toast("Mode en ligne indisponible. Le solo fonctionne.",3500);
  }
}
initFirebase();
