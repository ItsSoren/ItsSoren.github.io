function makePlanetFromSeed(seed,index=save.planetIndex){

 const type=types[Math.floor(r()*types.length)], radius=Math.floor(9000+idx*1150+r()*9500);
 return{name:planetNames[Math.floor(r()*planetNames.length)]+"-"+String(Math.floor(r()*900)+100),type,radius,seed,

}

function ensurePlanetOffers(force=false){

 if(force||!Array.isArray(save.planetOffers)||save.planetOffers.length!==3||(save.planetOffers[0]&&save.planetOffers[0].index!==neededIndex)){
  save.planetOffers=[];

 }
 return save.planetOffers;
}

}

const moduleDefs={
 drill:{name:"Foreuse",icon:"DR",color:"var(--orange)",desc:"Puissance de forage"},
 engine:{name:"Moteur",icon:"MV",color:"var(--lime)",desc:"Vitesse et mobilite"},
 reactor:{name:"Reacteur",icon:"RT",color:"#68d6ff",desc:"Regeneration energetique"},
 battery:{name:"Batterie",icon:"BT",color:"#ffd95e",desc:"Capacite d'energie"},
 armor:{name:"Blindage",icon:"BD",color:"#c9c9c9",desc:"Coque maximale"},
 cooling:{name:"Refroid.",icon:"CL",color:"#7bb7ff",desc:"Reduit la surchauffe"},
 scanner:{name:"Scanner",icon:"SC",color:"#d78cff",desc:"Repere les minerais"},
 refinery:{name:"Raffin.",icon:"RF",color:"#ff8f8f",desc:"Valeur des ressources"}
};
function layoutCounts(){
 let c={drill:0,engine:0,reactor:0,battery:0,armor:0,cooling:0,scanner:0,refinery:0};
 for(const it of activeLayout()){if(it&&c[it]!=null)c[it]++;}
 return c;
}
function buildSummary(){
 const c=layoutCounts();
 return Object.entries(c).map(([k,v])=>`${moduleDefs[k].name}: ${v}`).join("  ");
}
function shipStats(){
 let u=save.upgrades,c=layoutCounts(),ch=chassis();
 let drillN=c.drill,engineN=c.engine,reactorN=c.reactor,batteryN=c.battery,armorN=c.armor,coolingN=c.cooling,scannerN=c.scanner,refineryN=c.refinery;
 let used=Object.values(c).reduce((a,b)=>a+b,0), mass=18+used*3.2+armorN*2.6+batteryN*1.5+reactorN*2;
 let regen=(0.45+reactorN*.92)*Math.pow(1.12,u.reactor-1)*(ch.regen||1);
 let cool=Math.max(.34,(1.48-coolingN*.14-u.cooling*.035)*(ch.cool||1));
 let drain=Math.max(.8,2.6+engineN*.38+drillN*.48+scannerN*.12+refineryN*.16);
 let energy=(32+batteryN*38+reactorN*9)*Math.pow(1.12,u.battery-1)*ch.energy;
 return{
  drill:(.45+drillN*.74)*Math.pow(1.17,u.drill-1)*ch.drill,
  speed:(22+engineN*23)*(1+reactorN*.025)*Math.pow(1.10,u.engine-1)*ch.speed*(has("armor")?.92:1),
  hp:(45+armorN*34+drillN*5)*Math.pow(1.13,u.armor-1)*ch.hp*(has("greed")?.72:1)*(has("armor")?1.3:1),
  energy,regen,cool,drain,mass,
  endurance:drain>regen?energy/(drain-regen):999,
  refine:(.72+refineryN*.22)*Math.pow(1.10,u.refinery-1)*(has("greed")?1.35:1),
  scan:.65+scannerN*.24+u.scanner*.07,
  valid:c.drill>0&&c.engine>0&&c.reactor>0
 };
}
function resetRun(){
 const s=shipStats();
 if(!s.valid){notify("BUILD INVALIDE : DRILL + MOTEUR + REACTEUR");return}
 ship={x:0,y:-12,vx:0,vy:0,angle:0,hp:s.hp,maxHp:s.hp,en:s.energy,maxEn:s.energy,speed:0,blocks:0,loot:0,alive:true,shock:0,time:0,combo:0,comboTimer:0,contact:false,refine:s.refine};
 chunks.clear();particles=[];enemies=[];enemySpawnTimer=5.5;running=true;save.stats.runs++;save.run++;notify("DESCENTE #"+save.run);
}
function noise(x,y,seed=save.seed){let n=Math.sin(x*12.9898+y*78.233+seed*.0001)*43758.5453;return n-Math.floor(n)}
function getCell(wx,wy){
 if(wy<0)return null;
 const size=34,cx=Math.floor(wx/size),cy=Math.floor(wy/size),key=cx+","+cy;
 if(!chunks.has(key))chunks.set(key,genChunk(cx,cy,size));
 const ch=chunks.get(key), lx=((Math.floor(wx)%size)+size)%size,ly=((Math.floor(wy)%size)+size)%size;
 return ch[ly*size+lx];
}

function zoneForDepth(d){
 if(d>.95)return "core";
 if(d>.82&&d<.85)return "barrier4";
 if(d>.62&&d<.645)return "barrier3";
 if(d>.40&&d<.42)return "barrier2";
 if(d>.20&&d<.215)return "barrier1";
 if(d>.72)return "inner";
 if(d>.48)return "mantle";
 if(d>.22)return "lower";
 return "crust";
}

 for(let m of minerals){let n=save.found[m.id]||0;h+=`<div class="cardx d-flex align-items-center gap-3"><canvas width="32" height="32" class="codexSprite ${n?"":"unknown"}" data-mat="${m.id}"></canvas><div><b>${n?m.name:"???"}</b><div class="small text-secondary">${n?fmt(n)+" extraits  valeur "+m.v+" CR":"Non decouvert"}</div></div></div>`}
 h+=`<h5 class="mt-3">CRISTAUX SPECIAUX</h5><div class="small text-secondary mb-2">8 formes sans roche. Leur couleur depend de la planete.</div>`;
 crystalNames.forEach((name,i)=>{let n=save.found["crystal_"+i]||0;h+=`<div class="cardx d-flex align-items-center gap-3"><canvas width="32" height="32" class="codexSprite ${n?"":"unknown"}" data-crystal="${i}"></canvas><div><b>${n?name:"???"}</b><div class="small text-secondary">${n?fmt(n)+" cristaux extraits":"Non decouvert"}</div></div></div>`});

function renderStats(){
 let s=save.stats;$("#stats").innerHTML=`<h4>STATISTIQUES</h4><div class="cardx goodx"><b>Niveau ${save.level}</b><div class="small text-secondary">${fmt(save.xp)} / ${fmt(xpNeed())} XP  ${save.skillPoints} point(s)</div><div class="bar mt-2"><i style="width:${save.xp/xpNeed()*100}%"></i></div></div><div class="cardx quest"><b>Mission : ${activeQuest[0]}</b><div class="small text-secondary">${activeQuest[2]}  ${fmt(activeQuest[3])} CR</div></div><div class="statgrid">${[
 ["Temps de jeu",Math.floor(s.play/3600)+"h "+Math.floor(s.play/60%60)+"m"],["Descentes",fmt(s.runs)],["Blocs pulverises",fmt(s.blocks)],["Minerais extraits",fmt(s.ores)],["Distance foree",fmt(s.meters)+" m"],["Record profondeur",fmt(s.bestDepth)+" m"],["Vitesse max",fmt(s.bestSpeed)+" u/s"],["Credits gagnes",fmt(s.credits)],["Degats encaisses",fmt(s.damage)],["Planetes visitees",fmt(s.planets)],["Noyaux traverses",fmt(s.cores)],["Cristaux speciaux",fmt(s.crystals||0)],["Ennemis detruits",fmt(s.enemyKills||0)],["Seed",save.seed]
 ].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")}</div>
 <div class="cardx mt-3"><b>Progression globale</b><div class="small text-secondary">Le prototype conserve automatiquement ta partie dans le navigateur.</div><button id="wipe" class="btnx mt-2">EFFACER LA SAUVEGARDE</button></div>`;
 $("#wipe").onpointerup=(ev)=>{ev.preventDefault();if(confirm("Supprimer toute la progression ?")){localStorage.removeItem("odk_save");location.reload()}};
}

function renderSettings(){
 $("#settings").innerHTML=`<h4>REGLAGES</h4><div class="cardx"><b>Mobile</b><div class="small text-secondary mb-2">Optimisations tactiles et visuelles.</div>${[["particles","Particules"],["haptics","Vibrations"],["lowPower","Mode economie"]].map(x=>`<div class="switchx py-2"><span>${x[1]}</span><button class="btnx setting" data-k="${x[0]}">${save.settings[x[0]]?"ON":"OFF"}</button></div>`).join("")}</div><div class="cardx"><b>Console de test</b><p class="small text-secondary">Code developpeur pour tester le contenu sans grinder.</p><input id="cheatInput" type="text" autocapitalize="off" placeholder="Code developpeur"><button id="cheatGo" class="btnx mt-2">VALIDER</button><div id="devPanel" class="mt-2">${save.settings.dev?devHTML():""}</div></div><div class="cardx"><b>Overdrill Kill V0.15</b><div class="small text-secondary">Mobile-first  sauvegarde locale automatique</div></div>`;
 document.querySelectorAll(".setting").forEach(b=>b.onpointerup=(ev)=>{ev.preventDefault();let k=b.dataset.k;save.settings[k]=!save.settings[k];persist();renderSettings()});
 $("#cheatGo").onpointerup=(ev)=>{ev.preventDefault();if($("#cheatInput").value.trim().toUpperCase()==="COREBREAKER"){save.settings.dev=true;persist();notify("MODE TEST ACTIVE");renderSettings()}else notify("CODE INVALIDE")};bindDev()
}
function devHTML(){return `<div class="small text-warning mb-2">MODE TEST ACTIF</div><div class="d-grid gap-2"><button class="btnx dev" data-a="money">+10M CREDITS</button><button class="btnx dev" data-a="max">MODULES MK25</button><button class="btnx dev" data-a="level">NIVEAU +10</button><button class="btnx dev" data-a="chassis">DEBLOQUER CHASSIS</button><button class="btnx dev" data-a="core">TELEPORTER A 94%</button><button class="btnx dev" data-a="heal">REPARER / RECHARGER</button><button class="btnx dev" data-a="next">NOUVELLE PLANETE GRATUITE</button></div>`}
function bindDev(){document.querySelectorAll(".dev").forEach(b=>b.onpointerup=(ev)=>{ev.preventDefault();let a=b.dataset.a;if(a==="money")save.credits+=1e7;if(a==="max")for(let k in save.upgrades)save.upgrades[k]=25;if(a==="level"){save.level+=10;save.skillPoints+=10}if(a==="chassis"){save.level=Math.max(save.level,60);save.skillPoints+=10}if(a==="core"&&ship)ship.y=planet.radius*.94;if(a==="heal"&&ship){ship.hp=ship.maxHp;ship.en=ship.maxEn}if(a==="next"){save.planetIndex++;save.seed=Math.floor(Math.random()*2e9);planet=makePlanet();ensurePlanetOffers(true);rebuildSpriteCache();resetRun()}persist();updateHUD();notify("TEST APPLIQUE");renderSettings()})}

function persist(){localStorage.setItem("odk_save",JSON.stringify(save))}
ensurePlanetOffers();
document.querySelectorAll(".navb").forEach(b=>b.onpointerup=(ev)=>{ev.preventDefault();document.querySelectorAll(".navb").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".screen").forEach(x=>x.classList.remove("show"));let s=b.dataset.screen;if(s!=="game"){$("#"+s).classList.add("show");({hangar:renderHangar,planets:renderPlanets,codex:renderCodex,stats:renderStats,settings:renderSettings}[s])()}});
$("#play").onpointerup=(ev)=>{ev.preventDefault();$("#start").style.display="none";resetRun()};
setInterval(()=>{persist()},10000);
let accumulator=0;function loop(t){let frame=Math.min(.09,(t-last)/1000);last=t;accumulator+=frame;const step=1/60;let n=0;while(accumulator>=step&&n<4){update(step);accumulator-=step;n++}requestAnimationFrame(loop)}requestAnimationFrame(loop);requestAnimationFrame(draw);updateHUD();
</script>
