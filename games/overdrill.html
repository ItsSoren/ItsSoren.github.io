let storageOK=true;
function storageGet(k){try{return localStorage.getItem(k)}catch(e){storageOK=false;console.warn('Stockage local indisponible : sauvegarde temporaire',e);return null}}
function storageSet(k,v){try{localStorage.setItem(k,v);storageOK=true;return true}catch(e){storageOK=false;console.warn('Sauvegarde locale impossible',e);return false}}
function storageRemove(k){try{localStorage.removeItem(k);return true}catch(e){storageOK=false;console.warn('Effacement local impossible',e);return false}}
let save;try{save=JSON.parse(storageGet(SAVE_KEY))||freshSave()}catch(e){console.warn('Sauvegarde invalide, nouvelle partie temporaire',e);save=freshSave()}
function persist(){return storageSet(SAVE_KEY,JSON.stringify(save))}
function ensureStarterGear(){if(save.inventory.length)return;const starter=[makeGear('chassis',0,'common'),makeGear('drill',0,'common'),makeGear('engine',0,'common'),makeGear('reactor',0,'common'),makeGear('armor',0,'common'),makeGear('scanner',0,'common'),makeGear('booster',0,'common'),makeGear('utility',0,'common')];save.inventory.push(...starter);for(const g of starter)save.equipped[g.type]=g.uid;persist()}

function makeGear(type,baseIndex,rar='common',seed=(Math.random()*2e9)|0){const base=gearBases[type][clamp(baseIndex,0,gearBases[type].length-1)],R=rarities[rarityIndex(rar)],r=rng(seed),aff=[];const used=new Set();for(let i=0;i<R.aff;i++){let a=affixPool[Math.floor(r()*affixPool.length)];while(used.has(a[0]))a=affixPool[Math.floor(r()*affixPool.length)];used.add(a[0]);aff.push({k:a[0],name:a[1],v:lerp(a[2],a[3],r())*R.mult})}return{uid:'g'+Date.now().toString(36)+Math.floor(Math.random()*9999),type,name:base[0],req:base[1],tier:base[2],size:base[3],stats:{...base[4]},rar:R.id,seed,aff,level:1}}

function drawCarrier(x,y,s,t,accent){ctx.save();ctx.translate(x,y);ctx.imageSmoothingEnabled=false;const w=s,h=s*.50;if(assetReady('carrier')){ctx.shadowColor='#000';ctx.shadowBlur=Math.max(4,s*.035);ctx.drawImage(V22_IMG.carrier,0,0,192,96,-w/2,-h/2,w,h);ctx.shadowBlur=0}else{ctx.fillStyle='#394650';ctx.fillRect(-w/2,-h/4,w,h/2)}ctx.restore()}
function drawMiniDrill(x,y,s,frame,drop,accent){ctx.save();ctx.translate(x,y);ctx.fillStyle='#59636a';ctx.fillRect(-s*.24,-s*.4,s*.48,s*.55);ctx.fillStyle='#2a3136';ctx.fillRect(-s*.37,-s*.23,s*.14,s*.4);ctx.fillRect(s*.23,-s*.23,s*.14,s*.4);ctx.fillStyle=accent;ctx.fillRect(-s*.16,-s*.27,s*.32,s*.08);drawDrillHead(ctx,0,s*.14,s/42,frame,'#d98231');ctx.restore()}
function drawSkyDecor(W,H,p,prog=1){for(let i=0;i<45;i++){ctx.globalAlpha=.35;ctx.fillStyle=i%7?p.arch.atm:p.arch.accent;ctx.fillRect((i*71+p.seed)%W,(i*43+p.seed)%Math.floor(H*.55),i%9?1:2,1)}ctx.globalAlpha=1;const weather=p.arch.weather;if(weather==='PLUIE'||weather==='PLUIE ACIDE')for(let i=0;i<28;i++){ctx.strokeStyle=weather==='PLUIE ACIDE'?'#b8df64':'#74a9c2';let x=(i*31+performance.now()*.06)%W,y=(i*59+performance.now()*.16)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+8);ctx.stroke()}if(weather==='NEIGE')for(let i=0;i<24;i++){ctx.fillStyle='#dbeaf0';ctx.fillRect((i*47+performance.now()*.02)%W,(i*61+performance.now()*.03)%H,2,2)}if(weather==='SPORES')for(let i=0;i<20;i++){ctx.fillStyle='#98d66e';ctx.globalAlpha=.45;ctx.fillRect((i*53+performance.now()*.01)%W,(i*37+performance.now()*.02)%H,2,2)}ctx.globalAlpha=1}
function drawSurfaceProps(W,H,p,surfaceY){const row=V22_ARCH_PROP.indexOf(p.arch.id),n=16;if(row<0||!assetReady('props'))return;for(let i=0;i<n;i++){const x=(i+.25)*W/n+(hash(i,p.seed,2202)-.5)*W/n*.55,scale=.62+hash(i,p.seed,2203)*.9,v=Math.floor(hash(i,p.seed,2204)*3),w=48*scale,h=64*scale;ctx.save();ctx.globalAlpha=.78+.18*hash(i,p.seed,2205);ctx.drawImage(V22_IMG.props,v*48,row*64,48,64,x-w/2,surfaceY-h,w,h);ctx.restore()}}
function drawGame(){const W=canvas.width,H=canvas.height;if(!run){const p=currentPlanet();ctx.fillStyle=p.arch.sky;ctx.fillRect(0,0,W,H);drawSkyDecor(W,H,p);drawSurfaceProps(W,H,p,H*.78);ctx.fillStyle=p.arch.surface;ctx.fillRect(0,H*.78,W,H*.22);return}if(run.intro>0){drawCarrierIntro(W,H,run.planet,run.introT);return}const p=run.planet,view=18+clamp((equippedGear().chassis?.tier||1)-1,0,5)*1.8,cell=W/view,camX=run.x,camY=run.progress,cols=Math.ceil(W/cell)+4,rows=Math.ceil(H/cell)+4;ctx.save();if(run.shake>0){ctx.translate((Math.random()-.5)*run.shake,(Math.random()-.5)*run.shake);run.shake*=.88}ctx.fillStyle=p.arch.sky;ctx.fillRect(0,0,W,H);const surfaceLocal=localDepth(run.progress,p),nearSurface=surfaceLocal<30;if(nearSurface){drawSkyDecor(W,H,p);const sy=H/2+(0-run.progress)*(W/(18+clamp((equippedGear().chassis?.tier||1)-1,0,5)*1.8));if(sy>-80&&sy<H+80)drawSurfaceProps(W,H,p,sy)}const minX=Math.floor(camX-cols/2),maxX=Math.ceil(camX+cols/2),minY=Math.floor(camY-rows/2),maxY=Math.ceil(camY+rows/2);for(let wy=minY;wy<=maxY;wy++)for(let wx=minX;wx<=maxX;wx++){const depth=localDepth(wy,p);if(depth<0)continue;const [sx,sy]=worldToScreen(wx,wy,camX,camY,cell,W,H),c=getCell(wx,wy);if(!c||c.empty)continue;if(c.crystal)drawCrystal(c,sx,sy,cell,wx,wy);else drawTerrainBlock(c,sx,sy,cell,wx,wy)}for(const e of run.enemies)drawEnemy(e,camX,camY,cell,W,H);for(const pr of run.projectiles){const [x,y]=worldToScreen(pr.x,pr.y,camX,camY,cell,W,H);ctx.fillStyle=pr.c;ctx.fillRect(x-2,y-2,4,4)}for(const q of run.particles){q.x+=q.vx*.02;q.y+=q.vy*.02;q.vy+=.012;q.t-=.025;const [x,y]=worldToScreen(q.x,q.y,camX,camY,cell,W,H);ctx.globalAlpha=clamp(q.t,0,1);ctx.fillStyle=q.c;ctx.fillRect(x-q.s*.5,y-q.s*.5,q.s*1.5,q.s*1.5);if(q.t>.4){ctx.globalAlpha=.18*q.t;ctx.fillRect(x-q.s,y-q.s,q.s*3,q.s*3)}}run.particles=run.particles.filter(q=>q.t>0);ctx.globalAlpha=1;
 // lighting darkness after terrain
 const depthQ=clamp(localDepth(run.progress,p)/p.gameplayRadius,0,1),lightRadius=Math.min(W,H)*(.30*run.stats.light)/(1+depthQ*.35);ctx.save();ctx.globalCompositeOperation='source-over';const g=ctx.createRadialGradient(W/2,H/2,lightRadius*.25,W/2,H/2,lightRadius);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+(0.18+depthQ*.48)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
 // drill center
 ctx.save();ctx.translate(W/2,H/2);ctx.rotate(-run.angle);const size=Math.max(46,cell*2.5);drawDetailedDrill(0,0,size,Math.floor(performance.now()/85)%3,p.arch.accent,run.boostActive>0?1:0);if(run.orbital>0){ctx.globalAlpha=.3;ctx.fillStyle='#ff7b31';ctx.beginPath();ctx.arc(0,0,size*.78,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.restore();
 // floaters always in front of drill
 ctx.textAlign='center';ctx.font=Math.max(9,cell*.45)+'px '+getComputedStyle(document.body).fontFamily;for(const f of run.floaters){f.y-=.012;f.t-=.014;const [x,y]=worldToScreen(f.x,f.y,camX,camY,cell,W,H);ctx.globalAlpha=clamp(f.t,0,1);ctx.lineWidth=3;ctx.strokeStyle='#050709';ctx.strokeText(f.text,x,y);ctx.fillStyle=f.c;ctx.fillText(f.text,x,y)}run.floaters=run.floaters.filter(f=>f.t>0);ctx.globalAlpha=1;ctx.textAlign='left';ctx.restore()}
function renderDepthMeter(){const p=run?.planet||currentPlanet(),layers=layerProfile(p);$('#depthLayers').innerHTML=layers.map(l=>`<div style="position:absolute;left:0;right:0;top:${l.a*100}%;height:${(l.b-l.a)*100}%;background:${l.c};border-bottom:1px solid #090b0c"></div>`).join('')}
function updateHUD(){if(!run)return;const hp=clamp(run.hp/run.maxHp*100,0,100),en=clamp(run.en/run.maxEn*100,0,100),pct=phasePct(run.progress,run.planet)*100,ld=localDepth(run.progress,run.planet),lay=layerAt(ld,run.planet);$('#hpTxt').textContent=Math.round(hp)+'%';$('#hpBar').style.width=hp+'%';$('#enTxt').textContent=Math.round(en)+'%';$('#enBar').style.width=en+'%';$('#depthTxt').textContent=Math.max(0,Math.round(ld))+' m';$('#layerTxt').textContent=lay.name;$('#speedTxt').textContent=Math.round(run.speed);$('#comboTxt').textContent='x'+(1+run.combo*.08).toFixed(1);$('#lootTxt').textContent=fmt(run.loot);$('#lightTxt').textContent=Math.round(run.stats.light*100);$('#depthMark').style.top=pct+'%';$('#depthPct').textContent=Math.round(pct)+'%';$('#boostBtn').classList.toggle('ready',run.boostCharges>0&&run.boostActive<=0);$('#boostBtn').classList.toggle('active',run.boostActive>0);$('#boostTxt').textContent=run.boostActive>0?'ACTIVE':run.boostCharges+'/'+run.boostMax+(run.boostCharges<run.boostMax?' '+Math.round(run.boostRecharge/run.stats.boostRecharge*100)+'%':'')}

/* ---------- CODEX / STATS ---------- */
let codexTab='minerals';
function renderCodex(){const tabs=[['minerals','MINERAIS'],['crystals','CRISTAUX'],['enemies','ENNEMIS'],['planets','PLANETES']];let h=`<h4>CODEX</h4><div class="codexTabs">${tabs.map(t=>`<button class="chip ${codexTab===t[0]?'active':''}" data-codex="${t[0]}">${t[1]}</button>`).join('')}</div><div class="codexGrid">`;if(codexTab==='minerals')for(const m of mineralDefs){const seen=save.codex.minerals[m[0]]||m[0]==='stone';h+=`<div class="card codexItem"><canvas width="48" height="48" data-mineral="${m[0]}" class="${seen?'':'unknown'}"></canvas><b>${seen?m[1]:'???'}</b><small>${seen?fmt(save.codex.minerals[m[0]]||0)+' extraits · '+m[2]+' CR':'Non decouvert'}</small></div>`}else if(codexTab==='crystals')crystalNames.forEach((n,i)=>{const seen=save.codex.crystals[i];h+=`<div class="card codexItem"><canvas width="48" height="48" data-crystal="${i}" class="${seen?'':'unknown'}"></canvas><b>${seen?n:'???'}</b><small>${seen?seen+' trouves':'Non decouvert'}</small></div>`});else if(codexTab==='enemies')for(const [k,f] of Object.entries(familyDefs)){const seen=save.codex.enemies[k];h+=`<div class="card codexItem"><canvas width="48" height="48" data-family="${k}" class="${seen?'':'unknown'}"></canvas><b>${seen?f.name:'???'}</b><small>${seen?seen+' impacts':'Non rencontre'}</small></div>`}else for(const a of archetypes){const seen=save.codex.planets[a.id];h+=`<div class="card codexItem"><canvas width="48" height="48" data-arch="${a.id}" class="${seen?'':'unknown'}"></canvas><b>${seen?a.name:'???'}</b><small>${seen?'Archive planetaire':'Non visite'}</small></div>`}h+='</div>';$('#codex').innerHTML=h;$$('[data-codex]').forEach(b=>b.onclick=()=>{codexTab=b.dataset.codex;renderCodex()});paintCodex()}
function paintCodex(){
 $$('[data-mineral]').forEach(c=>{const x=c.getContext('2d'),M=mineralById[c.dataset.mineral],idx=Math.max(0,mineralDefs.findIndex(v=>v[0]===M.id));x.imageSmoothingEnabled=false;const g=x.createLinearGradient(0,0,0,48);g.addColorStop(0,'#333c42');g.addColorStop(1,'#151b1f');x.fillStyle=g;x.fillRect(0,0,48,48);x.strokeStyle='#090b0c';x.lineWidth=3;x.strokeRect(1.5,1.5,45,45);if(assetReady('oreItems'))x.drawImage(V22_IMG.oreItems,0,idx*32,32,32,8,8,32,32);else if(assetReady('terrain')){x.drawImage(V22_IMG.terrain,0,1*32,32,32,0,0,48,48);if(M.id!=='stone'){const m=tintAtlas('ore',0,oreStyle(M.id)*32,32,32,M.c);if(m)x.drawImage(m,0,0,48,48)}}});
 $$('[data-crystal]').forEach(c=>{const x=c.getContext('2d'),i=+c.dataset.crystal,col=['#d9e8ef','#e7c95b','#54b8e6','#ed7051','#a776df','#b8e8f1','#54e1ca','#e194df'][i];x.fillStyle='#11191e';x.fillRect(0,0,48,48);const s=tintAtlas('crystal',0,i*48,48,48,col);if(s)x.drawImage(s,0,0,48,48)});
 $$('[data-family]').forEach(c=>{const x=c.getContext('2d'),r=Math.max(0,V22_FAMILY.indexOf(c.dataset.family));x.fillStyle='#11181c';x.fillRect(0,0,48,48);if(assetReady('enemy'))x.drawImage(V22_IMG.enemy,0,r*48,48,48,0,0,48,48)});
 $$('[data-arch]').forEach(c=>{const a=archetypes.find(x=>x.id===c.dataset.arch);paintPlanet(c,{seed:123,arch:a,diameter:20000,bonus:false},false)})
}
function renderStats(){const s=save.stats,groups=[['PROGRESSION',[['Niveau',save.level],['XP',fmt(save.xp)+' / '+fmt(xpNeed())],['Credits',fmt(save.credits)],['Stuff',save.inventory.length]]],['EXPEDITIONS',[['Temps',Math.floor(s.play/3600)+'h '+Math.floor(s.play/60%60)+'m'],['Runs',fmt(s.runs)],['Meilleure profondeur',Math.round(s.bestDepth)+'%'],['Meilleur combo','x'+(1+(s.bestCombo||0)*.08).toFixed(1)]]],['EXPLORATION',[['Systemes',fmt(s.systems)],['Planetes',fmt(s.planets)],['Geodes',fmt(s.geodes)],['Structures',fmt(s.structures)],['Ennemis',fmt(s.kills)],['Minerais rares',fmt(s.rare)]]]];$('#stats').innerHTML=`<h4>STATISTIQUES</h4>${groups.map((g,i)=>`<details class="card" ${i===0?'open':''}><summary>${g[0]}</summary><div class="coreStats" style="margin-top:7px">${g[1].map(v=>`<div class="statBox"><small>${v[0]}</small><b>${v[1]}</b></div>`).join('')}</div></details>`).join('')}<div class="card"><button class="btn" id="wipe" style="width:100%">EFFACER LA SAUVEGARDE V2</button></div>`;$('#wipe').onclick=()=>{if(confirm('Tout effacer ?')){storageRemove(SAVE_KEY);save=freshSave();ensureStarterGear();ensureSystem();run=null;persist();updateTop();openScreen('hangar')}}}

/* ---------- APP ---------- */
function openScreen(id){$$('.screen').forEach(s=>s.classList.remove('show'));$('#'+id).classList.add('show');$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.screen===id));if(id==='hangar')renderHangar();if(id==='system')renderSystem();if(id==='skills')renderSkills();if(id==='codex')renderCodex();if(id==='stats')renderStats();if(id==='game'&&!run)showPreRun()}
function showPreRun(){const p=currentPlanet();save.codex.planets[p.arch.id]=1;$('#game').classList.add('show');$('#results').classList.remove('show');toast('PRET POUR '+p.name+' · TOUCHE FORAGE POUR LANCER');}
function toast(t){const e=$('#eventBanner');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1800)}
function updateTop(){const p=currentPlanet();$('#credits').textContent=fmt(save.credits);$('#level').textContent='LV.'+save.level;$('#topPlanet').textContent=p.name+' · '+p.arch.name}
$$('.nav').forEach(n=>n.onclick=()=>{if(run&&run.alive&&run.intro<=0&&n.dataset.screen!=='game')return toast('TERMINE LA DESCENTE AVANT');openScreen(n.dataset.screen)});
canvas.addEventListener('pointerdown',e=>{if(!run){startRun();return}if(run.intro>0)return;pointer.down=true;setSteer(e)});canvas.addEventListener('pointermove',e=>{if(pointer.down&&run)setSteer(e)});addEventListener('pointerup',()=>pointer.down=false);function setSteer(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;run.targetAngle=clamp((x-.5)*1.45,-.68,.68)}
$('#boostBtn').onclick=e=>{e.stopPropagation();triggerBoost()};$('#abortBtn').onclick=e=>{e.stopPropagation();if(run&&run.alive&&run.intro<=0)endRun('EXPEDITION TERMINEE')};$('#replayBtn').onclick=()=>startRun();$('#workshopBtn').onclick=()=>{run=null;$('#results').classList.remove('show');openScreen('hangar')};
let startTapAt=0;
function bindTap(el,fn){if(!el)return;const fire=e=>{const now=performance.now();if(e.type==='click'&&now-startTapAt<420)return;startTapAt=now;e.preventDefault();e.stopPropagation();fn()};el.addEventListener('pointerup',fire,{passive:false});el.addEventListener('click',fire,{passive:false})}
function enterApp(makeNew=false){
 try{
  if(makeNew){save=freshSave();ensureStarterGear();ensureSystem();run=null;persist()}
  else{ensureStarterGear();ensureSystem()}
  updateTop();openScreen('hangar');
  const s=$('#start');if(s){s.style.pointerEvents='none';s.style.opacity='0';setTimeout(()=>s.style.display='none',80)}
 }catch(err){
  console.error('Impossible d\'ouvrir le jeu',err);
  const sub=document.querySelector('.sub');if(sub)sub.textContent='ERREUR DE DEMARRAGE · '+(err?.message||err);
 }
}
function bindStartUI(){
 const c=$('#continueBtn'),n=$('#newSaveBtn');
 if(storageGet(SAVE_KEY)&&c)c.textContent='CONTINUER';
 bindTap(c,()=>enterApp(false));
 bindTap(n,()=>enterApp(true));
}
function boot(){
 console.log('ODK V2.2.3 STABLE TEXTURE PASS');
 bindStartUI();
 try{ensureSystem();updateTop();paintPlanet($('#startPlanet'),currentPlanet(),false);resizeCanvas();renderDepthMeter()}
 catch(err){console.error('Boot visuel partiel',err);const sub=document.querySelector('.sub');if(sub)sub.textContent='MODE DE SECOURS · APPUIE SUR COMMENCER'}
}
let acc=0,last=performance.now();function loop(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;acc+=dt;while(acc>=1/60){updateRun(1/60);acc-=1/60}updateHUD();drawGame();requestAnimationFrame(loop)}
boot();requestAnimationFrame(loop);setInterval(()=>{try{persist()}catch(e){console.warn(e)}},12000);
</script>
</body></html>
