/* --- V0.18 gameplay / mobile clarity --- */
#app.runMode{grid-template-rows:auto 1fr}#app.runMode .bottom{display:none!important}
.preflight,.runResult{position:absolute;inset:0;z-index:14;background:#1d2226;background-image:linear-gradient(90deg,#ffffff05 1px,transparent 1px),linear-gradient(#ffffff05 1px,transparent 1px);background-size:8px 8px;padding:10px;overflow:auto;display:none}
.preflight.show,.runResult.show{display:block}.preflightBox{max-width:430px;margin:0 auto}.preflightHero{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:center}.preflightShip{width:70px;height:70px;border:3px solid #090b0c;background:#12181c;image-rendering:pixelated}.launchBtn{width:100%;min-height:58px;background:var(--orange);color:#17191b;border:3px solid #07090a;font-weight:1000;font-size:14px;box-shadow:inset 3px 3px #f3ab5e,inset -3px -3px #9b471c,4px 4px #0008}.runResult .resultBox{max-width:360px;margin:12vh auto 0;text-align:center}.resultGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.resultGrid div{background:#272d31;border:2px solid #0b0d0e;padding:8px}.resultGrid b{display:block;color:var(--lime);font-size:16px}
.runControls{position:absolute;left:8px;right:8px;bottom:8px;z-index:9;display:none;pointer-events:none;align-items:end;justify-content:space-between}.runControls.show{display:flex}.runControls button{pointer-events:auto}.boostBtn{position:relative!important;right:auto!important;bottom:auto!important;width:76px!important;height:58px!important;background:#383d42!important}.boostBtn.ready{background:#d97725!important;color:#17191b!important}.boostBtn.active{background:#f29a39!important;color:#17191b!important}.boostBtn.cooling{opacity:.65}.boostBar{position:absolute;left:4px;right:4px;bottom:3px;height:5px;background:#111518;border:1px solid #07090a}.boostBar i{display:block;height:100%;width:100%;background:var(--lime)}.abortBtn{min-height:44px;padding:6px 9px;border:3px solid #07090a;background:#343a3f;color:#ddd8ca;box-shadow:inset 2px 2px #626970,inset -2px -2px #202326;font-weight:900;font-size:8px}
.depth{width:36px!important;height:60%!important;background:#14191d!important;border:3px solid #07090a!important}.depthPreview{inset:2px!important;background:none!important}.depthPreview .depthSeg{position:absolute;left:0;right:0;border-bottom:1px solid #0008}.depthPreview .depthSeg span{position:absolute;left:2px;top:2px;font-size:5px;color:#e7e7ddaa;text-shadow:1px 1px #000;writing-mode:vertical-rl}.depthFill{background:rgba(3,5,7,.18)!important}.depthShip{left:50%!important;right:auto!important;width:12px!important;height:8px!important;transform:translate(-50%,-50%);background:#535b61!important;border:1px solid #0a0c0d!important;box-shadow:0 1px #000!important}.depthShip:before{top:6px!important;border-left-width:5px!important;border-right-width:5px!important;border-bottom:0!important;border-top:6px solid #d6d9da!important}.depthShip:after{content:"";position:absolute;left:2px;right:2px;top:-3px;height:3px;background:var(--orange)}.depthPct{background:#0d1114;padding:2px;right:1px!important;top:1px!important}.depthTop,.depthBottom{display:none}
.systemMap{position:relative;width:100%;height:300px;background:#080e16;border:3px solid #090b0c;overflow:hidden;box-shadow:inset 0 0 0 2px #202a32}.systemMap:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#7891a955 1px,transparent 1px);background-size:31px 29px;opacity:.65}.systemStar{pointer-events:none;position:absolute;left:50%;top:50%;width:42px;height:42px;transform:translate(-50%,-50%);border-radius:50%;background:#e49a36;box-shadow:0 0 0 4px #8e4a20,0 0 18px #ef9b4166}.orbit{pointer-events:none;position:absolute;left:50%;top:50%;border:1px solid #6f7c8638;border-radius:50%;transform:translate(-50%,-50%)}.planetNode{position:absolute;width:52px;height:52px;padding:0;border:2px solid #0b0d0e;background:#12181d;border-radius:50%;transform:translate(-50%,-50%);box-shadow:2px 2px #0008;overflow:visible}.planetNode canvas{width:48px;height:48px;border-radius:50%;background:transparent}.planetNode.selected{outline:3px solid var(--orange);z-index:4}.planetNode.current:after{content:"ICI";position:absolute;left:50%;top:46px;transform:translateX(-50%);font-size:6px;background:#192026;color:var(--lime);padding:2px 3px;border:1px solid #07090a}.planetInspector{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center}.planetInspector .planetCanvas{width:80px;height:80px}.planetInfoButtons{display:grid;grid-template-columns:1fr 1fr;gap:6px}.systemToolbar{display:flex;gap:6px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.statsSections{display:grid;gap:8px}.statsSection h5{margin:0 0 5px!important}.statsReadable{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.statBig{background:#2a3034;border:2px solid #0b0d0e;padding:8px;min-height:70px;box-shadow:inset 2px 2px #485057}.statBig small{display:block;font-size:9px;color:#a9b0b4;line-height:1.15}.statBig b{display:block;margin-top:4px;font-size:17px;color:var(--lime)}
.codexCard{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center}.codexCard canvas{width:52px!important;height:52px!important;background:#20262a;border:2px solid #0b0d0e;image-rendering:pixelated}.codexCard b{font-size:15px}.codexCard .small{font-size:10px;line-height:1.25}.codexTabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}.codexTabs button{min-height:34px;padding:5px 8px}.enemyCanvas.unknown{filter:grayscale(1) brightness(.30)}
@media(max-width:390px){.systemMap{height:275px}.planetNode{width:46px;height:46px}.planetNode canvas{width:42px;height:42px}.planetInspector{grid-template-columns:72px minmax(0,1fr)}.planetInspector .planetCanvas{width:68px;height:68px}.statsReadable{grid-template-columns:repeat(2,1fr)}.statBig b{font-size:15px}}

</style>

function shipStats(){

 let drillN=c.drill,engineN=c.engine,reactorN=c.reactor,batteryN=c.battery,armorN=c.armor,coolingN=c.cooling,scannerN=c.scanner,refineryN=c.refinery;

 let cool=Math.max(.34,(1.48-coolingN*.14-u.cooling*.035)*(ch.cool||1));
 let drain=Math.max(2.4,(1.95+engineN*.10+drillN*.14+scannerN*.04+refineryN*.05)*3);
 let energy=(32+batteryN*38+reactorN*9)*Math.pow(1.12,u.battery-1)*ch.energy;
 return{
  drill:(.45+drillN*.74)*Math.pow(1.17,u.drill-1)*ch.drill,
  speed:(22+engineN*23)*(1+reactorN*.025)*Math.pow(1.10,u.engine-1)*ch.speed*(has("armor")?.92:1),
  hp:(45+armorN*34+drillN*5)*Math.pow(1.13,u.armor-1)*ch.hp*(has("greed")?.72:1)*(has("armor")?1.3:1),
  energy,regen,cool,drain,mass,
  endurance:drain>regen?energy/(drain-regen):999,
  refine:(.72+refineryN*.22)*Math.pow(1.10,u.refinery-1)*(has("greed")?1.35:1),
  scan:.65+scannerN*.24+u.scanner*.07,
  valid:c.drill>0&&c.engine>0&&c.reactor>0
 };
}

function getCell(wx,wy){
 if(wy<0)return null;
 const size=34,cx=Math.floor(wx/size),cy=Math.floor(wy/size),key=cx+","+cy;
 if(!chunks.has(key))chunks.set(key,genChunk(cx,cy,size));
 const ch=chunks.get(key), ix=Math.floor(wx),iy=Math.floor(wy),lx=((ix%size)+size)%size,ly=((iy%size)+size)%size,cell=ch[ly*size+lx];
 if(cell){const mem=blockMemory.get(ix+","+iy);if(mem!=null)cell.hp=Math.min(cell.hp,mem)}
 return cell;
}

function paintPlanetPreview(canvas,p,big=false){
 if(!canvas)return;const c=canvas.getContext('2d'),size=big?72:56;canvas.width=size;canvas.height=size;c.imageSmoothingEnabled=false;const pal=planetPaletteFor(p),cx=size/2,cy=size/2,r=size*.31,seed=p.seed||0,hasRing=((seed>>5)&7)>3;

 if(hasRing){c.save();c.translate(cx,cy);c.rotate(((seed>>4)&1)?.18:-.12);c.scale(1,.30);c.strokeStyle='#56616a';c.globalAlpha=.55;c.lineWidth=3;c.beginPath();c.arc(0,0,r*1.45,Math.PI,Math.PI*2);c.stroke();c.restore();c.globalAlpha=1;}

 for(let y=0;y<size;y++)for(let x=0;x<size;x++){const dx=(x+.5-cx)/r,dy=(y+.5-cy)/r,dist=Math.hypot(dx,dy);if(dist>1)continue;const light=clamp(1.02-dist*.72+(-dx-dy)*.11,.28,1.15);let base=pal.rock,n1=valueNoise(x+seed*.13,y+seed*.17,7,seed+71),n2=valueNoise(x-seed*.09,y+seed*.07,13,seed+311),n3=valueNoise(x+seed*.03,y-seed*.05,20,seed+607);if(p.type==='Tellurique'){if(n1>.57)base=pal.ocean;else if(n2>.62)base=pal.dust}else if(p.type==='Volcanique'){if(n1>.60)base=pal.accent;else if(n2>.50)base=pal.dust}else if(p.type==='Cristalline'){if(n1>.56)base=pal.accent;else if(n2>.58)base=pal.ocean}else if(p.type==='Metallique'){if(n1>.59)base=pal.dust;else if(n2>.67)base=pal.ocean}else if(p.type==='Glacee'){if(n1>.51)base=pal.ocean;else if(n2>.61)base=pal.cloud}else if(p.type==='Irradiee'){if(n1>.59)base=pal.accent;else if(n2>.55)base=pal.ocean}const rgb=hexRgb(base),i=(y*size+x)*4;d[i]=rgb[0]*light;d[i+1]=rgb[1]*light;d[i+2]=rgb[2]*light;d[i+3]=255}
 c.putImageData(img,0,0);c.strokeStyle='#080b0d';c.lineWidth=2;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();
 c.globalAlpha=.18;c.fillStyle=pal.cloud;c.beginPath();c.ellipse(cx-r*.12,cy-r*.22,r*.65,r*.18,-.2,0,Math.PI*2);c.fill();c.globalAlpha=1;
 if(hasRing){c.save();c.translate(cx,cy);c.rotate(((seed>>4)&1)?.18:-.12);c.scale(1,.30);c.strokeStyle='#a9afb3';c.globalAlpha=.70;c.lineWidth=2;c.beginPath();c.arc(0,0,r*1.45,0,Math.PI);c.stroke();c.restore();c.globalAlpha=1;}
 if(((seed>>3)&3)!==0){c.fillStyle=pal.cloud;c.beginPath();c.arc(cx+r*1.10,cy-r*.72,Math.max(2,size*.045),0,Math.PI*2);c.fill()}

function getAtlasTile(col,row){const c=document.createElement('canvas');c.width=c.height=ATLAS_TILE;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(atlasCanvas,col*ATLAS_TILE,row*ATLAS_TILE,ATLAS_TILE,ATLAS_TILE,0,0,ATLAS_TILE,ATLAS_TILE);return c}
function tintCanvas(src,color,alphaMul=1){
 const c=document.createElement('canvas');c.width=c.height=ATLAS_TILE;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(src,0,0);const im=x.getImageData(0,0,ATLAS_TILE,ATLAS_TILE),d=im.data,[cr,cg,cb]=hexRgb(color);

 const group=(title,a)=>`<div class="cardx statsSection"><h5>${title}</h5><div class="statsReadable">${a.map(x=>`<div class="statBig"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div></div>`;
 $("#stats").innerHTML=`<h4>STATISTIQUES</h4><div class="cardx goodx"><b>Niveau ${save.level}</b><div class="small text-secondary">${fmt(save.xp)} / ${fmt(xpNeed())} XP  â¢  ${save.skillPoints} point(s)</div><div class="bar mt-2"><i style="width:${save.xp/xpNeed()*100}%"></i></div></div><div class="cardx quest"><b>Mission : ${activeQuest[0]}</b><div class="small text-secondary">${activeQuest[2]}  â¢  ${fmt(activeQuest[3])} CR</div></div><div class="statsSections">${group('SESSION',main)}${group('MINAGE',mine)}${group('COMBAT / EXPLORATION',combat)}</div><div class="cardx"><div class="small text-secondary">Seed actuelle : ${save.seed}</div><button id="wipe" class="btnx mt-2">EFFACER LA SAUVEGARDE</button></div>`;$("#wipe").onpointerup=e=>{e.preventDefault();if(confirm("Supprimer toute la progression ?")){localStorage.removeItem("odk_save");location.reload()}};
}

function renderSettings(){
 $("#settings").innerHTML=`<h4>REGLAGES</h4><div class="cardx"><b>Mobile</b><div class="small text-secondary mb-2">Optimisations tactiles et visuelles.</div>${[["particles","Particules"],["haptics","Vibrations"],["lowPower","Mode economie"]].map(x=>`<div class="switchx py-2"><span>${x[1]}</span><button class="btnx setting" data-k="${x[0]}">${save.settings[x[0]]?"ON":"OFF"}</button></div>`).join("")}</div><div class="cardx"><b>Console de test</b><p class="small text-secondary">Code developpeur pour tester le contenu sans grinder.</p><input id="cheatInput" type="text" autocapitalize="off" placeholder="Code developpeur"><button id="cheatGo" class="btnx mt-2">VALIDER</button><div id="devPanel" class="mt-2">${save.settings.dev?devHTML():""}</div></div><div class="cardx"><b>Overdrill Kill V0.18</b><div class="small text-secondary">Mobile-first  sauvegarde locale automatique</div></div>`;
 document.querySelectorAll(".setting").forEach(b=>b.onpointerup=(ev)=>{ev.preventDefault();let k=b.dataset.k;save.settings[k]=!save.settings[k];persist();renderSettings()});
 $("#cheatGo").onpointerup=(ev)=>{ev.preventDefault();if($("#cheatInput").value.trim().toUpperCase()==="COREBREAKER"){save.settings.dev=true;persist();notify("MODE TEST ACTIVE");renderSettings()}else notify("CODE INVALIDE")};bindDev()
}
function devHTML(){return `<div class="small text-warning mb-2">MODE TEST ACTIF</div><div class="d-grid gap-2"><button class="btnx dev" data-a="money">+10M CREDITS</button><button class="btnx dev" data-a="max">MODULES MK25</button><button class="btnx dev" data-a="level">NIVEAU +10</button><button class="btnx dev" data-a="chassis">DEBLOQUER CHASSIS</button><button class="btnx dev" data-a="core">TELEPORTER A 94%</button><button class="btnx dev" data-a="heal">REPARER / RECHARGER</button><button class="btnx dev" data-a="next">NOUVELLE PLANETE GRATUITE</button></div>`}
function bindDev(){document.querySelectorAll(".dev").forEach(b=>b.onpointerup=(ev)=>{ev.preventDefault();let a=b.dataset.a;if(a==="money")save.credits+=1e7;if(a==="max")for(let k in save.upgrades)save.upgrades[k]=25;if(a==="level"){save.level+=10;save.skillPoints+=10}if(a==="chassis"){save.level=Math.max(save.level,60);save.skillPoints+=10}if(a==="core"&&ship)ship.y=planet.radius*.94;if(a==="heal"&&ship){ship.hp=ship.maxHp;ship.en=ship.maxEn}if(a==="next"){changeStarSystem()}persist();updateHUD();notify("TEST APPLIQUE");renderSettings()})}

function persist(){localStorage.setItem("odk_save",JSON.stringify(save))}
ensureSystem();
function openTab(s){if(running)return;document.querySelectorAll(".navb").forEach(x=>x.classList.toggle("active",x.dataset.screen===s));document.querySelectorAll(".screen").forEach(x=>x.classList.remove("show"));$("#preflight").classList.remove("show");$("#runResult").classList.remove("show");$("#depthMeter").style.display="none";$("#layerTag").style.display="none";$("#runControls").classList.remove("show");if(s==="game"){showGamePrep();return}$("#"+s).classList.add("show");({hangar:renderHangar,planets:renderPlanets,codex:renderCodex,stats:renderStats,settings:renderSettings}[s])()}
document.querySelectorAll(".navb").forEach(b=>b.onpointerup=ev=>{ev.preventDefault();openTab(b.dataset.screen)});
$("#play").onpointerup=ev=>{ev.preventDefault();$("#start").style.display="none";renderDepthMeter();showGamePrep()};
setInterval(()=>{persist()},10000);
renderDepthMeter();$("#depthMeter").style.display="none";$("#layerTag").style.display="none";$("#runControls").classList.remove("show");
let accumulator=0;function loop(t){let frame=Math.min(.09,(t-last)/1000);last=t;accumulator+=frame;const step=1/60;let n=0;while(accumulator>=step&&n<4){update(step);accumulator-=step;n++}requestAnimationFrame(loop)}requestAnimationFrame(loop);requestAnimationFrame(draw);updateHUD();
</script>
