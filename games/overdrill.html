const SAVE_KEY='odk_v2_save';

let save;try{save=JSON.parse(localStorage.getItem(SAVE_KEY))||freshSave()}catch{save=freshSave()}
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(save))}
function ensureStarterGear(){if(save.inventory.length)return;const starter=[makeGear('chassis',0,'common'),makeGear('drill',0,'common'),makeGear('engine',0,'common'),makeGear('reactor',0,'common'),makeGear('armor',0,'common'),makeGear('scanner',0,'common'),makeGear('booster',0,'common'),makeGear('utility',0,'common')];save.inventory.push(...starter);for(const g of starter)save.equipped[g.type]=g.uid;persist()}
function xpNeed(){return Math.floor(180*Math.pow(save.level,1.42))}function addXP(x){x*=skillMult().xp;save.xp+=x;while(save.xp>=xpNeed()){save.xp-=xpNeed();save.level++;save.skillPoints++;}}
function rarityIndex(id){return Math.max(0,rarities.findIndex(r=>r.id===id))}
function makeGear(type,baseIndex,rar='common',seed=(Math.random()*2e9)|0){const base=gearBases[type][clamp(baseIndex,0,gearBases[type].length-1)],R=rarities[rarityIndex(rar)],r=rng(seed),aff=[];const used=new Set();for(let i=0;i<R.aff;i++){let a=affixPool[Math.floor(r()*affixPool.length)];while(used.has(a[0]))a=affixPool[Math.floor(r()*affixPool.length)];used.add(a[0]);aff.push({k:a[0],name:a[1],v:lerp(a[2],a[3],r())*R.mult})}return{uid:'g'+Date.now().toString(36)+Math.floor(Math.random()*9999),type,name:base[0],req:base[1],tier:base[2],size:base[3],stats:{...base[4]},rar:R.id,seed,aff,level:1}}
function equippedGear(){const out={};for(const [t,uid] of Object.entries(save.equipped)){const g=save.inventory.find(x=>x.uid===uid);if(g)out[t]=g}return out}
function skillMult(){let m={drill:1,speed:1,hp:1,energy:1,money:1,xp:1,rare:0,geode:0,light:1,width:1,turnSpeed:1,turnSharp:1,boostCharges:0,repair:0,resist:0};for(const [id,lvl] of Object.entries(save.skills)){const s=skillById[id];if(!s||!s.fx)continue;for(const [k,v] of Object.entries(s.fx)){if(k==='boostCharges')m[k]+=v*lvl;else if(['rare','geode','repair','resist'].includes(k))m[k]+=v*lvl;else m[k]+=v*lvl}}return m}
function buildStats(){const eq=equippedGear(),sm=skillMult();let s={drill:1,speed:10,hp:70,energy:60,regen:.7,money:1,xp:1,rare:sm.rare,geode:sm.geode,light:1,width:1,turnSpeed:1,turnSharp:1,boost:1.35,boostCharges:1+sm.boostCharges,boostRecharge:7,repair:sm.repair,resist:sm.resist,capacity:16,used:0};for(const g of Object.values(eq)){s.used+=g.size||1;for(const [k,v] of Object.entries(g.stats)){if(k==='hp')s.hp+=v;else if(k==='energy')s.energy+=v;else if(k==='regen')s.regen+=v;else if(k==='capacity')s.capacity=v;else if(k==='drill')s.drill+=v;else if(k==='speed')s.speed*=v;else if(k==='width')s.width*=v;else if(k==='turnSpeed')s.turnSpeed*=v;else if(k==='turnSharp')s.turnSharp*=v;else if(k==='boost')s.boost=Math.max(s.boost,v);else if(k==='boostCharges')s.boostCharges+=v;else if(k==='boostRecharge')s.boostRecharge=v;else if(k==='light')s.light*=v;else if(k==='money')s.money+=v;else if(k==='rare')s.rare+=v;else if(k==='geode')s.geode+=v;else if(k==='repair')s.repair+=v}for(const a of g.aff){if(['hp','energy'].includes(a.k))s[a.k]*=1+a.v;else if(['rare','geode','repair'].includes(a.k))s[a.k]+=a.v;else if(['drill','speed','money','xp','light','turnSpeed','turnSharp','boost'].includes(a.k))s[a.k]*=1+a.v}}s.drill*=sm.drill;s.speed*=sm.speed;s.hp*=sm.hp;s.energy*=sm.energy;s.money*=sm.money;s.xp*=sm.xp;s.width*=sm.width;s.turnSpeed*=sm.turnSpeed;s.turnSharp*=sm.turnSharp;return s}

function planetMods(r,arch){const pool=[['Tempete magnetique','+ennemis / +rare'],['Activite tectonique','zones instables'],['Hypercroissance cristalline','geodes +'],['Zone militaire abandonnee','machines +'],['Noyau riche','minerais rares +'],['Faune agressive','hostilite +'],['Manteau fracturé','transitions dangereuses']];let n=r()<.45?1:r()<.2?2:0,res=[];for(let i=0;i<n;i++){const p=pool[Math.floor(r()*pool.length)];if(!res.some(x=>x[0]===p[0]))res.push(p)}return res}
function ensureSystem(){if(!save.systemSeeds||save.systemSeeds.length<4){const r=rng(save.systemSeed),n=4+Math.floor(r()*4);save.systemSeeds=Array.from({length:n},()=>Math.floor(r()*2e9));save.systemSlot=clamp(save.systemSlot||0,0,n-1);persist()}return save.systemSeeds}

function paintPlanet(c,p,selected=false){if(!c)return;const x=c.getContext('2d'),W=c.width,H=c.height,cx=W/2,cy=H/2,r=Math.min(W,H)*.34,a=p.arch;x.clearRect(0,0,W,H);x.imageSmoothingEnabled=false;const img=x.createImageData(W,H),dta=img.data;for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){const dx=(xx-cx)/r,dy=(yy-cy)/r,d=Math.hypot(dx,dy);if(d>1)continue;const n=noise(xx+p.seed*.01,yy-p.seed*.02,8,p.seed),n2=noise(xx,yy,17,p.seed+22);let col=n>.62?a.accent:n2>.54?a.base:a.deep;const light=clamp(1.1-d*.72-dx*.23-dy*.13,.25,1.2),rgb=hex(col),i=(yy*W+xx)*4;dta[i]=rgb[0]*light;dta[i+1]=rgb[1]*light;dta[i+2]=rgb[2]*light;dta[i+3]=255}x.putImageData(img,0,0);x.strokeStyle='#080a0c';x.lineWidth=2;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke();if((p.seed&3)===1){x.strokeStyle=mixHex(a.accent,'#ffffff',.35);x.globalAlpha=.55;x.beginPath();x.ellipse(cx,cy,r*1.38,r*.28,.12,0,Math.PI*2);x.stroke();x.globalAlpha=1}if(p.bonus){x.fillStyle='#ffd65c';x.fillRect(W-12,5,5,5)}if(selected){x.strokeStyle='#f09a42';x.lineWidth=2;x.strokeRect(1,1,W-2,H-2)}}

function drawGame(){const W=canvas.width,H=canvas.height;if(!run){const p=currentPlanet();ctx.fillStyle=p.arch.sky;ctx.fillRect(0,0,W,H);drawSkyDecor(W,H,p);drawSurfaceProps(W,H,p,H*.78);ctx.fillStyle=p.arch.surface;ctx.fillRect(0,H*.78,W,H*.22);return}if(run.intro>0){drawCarrierIntro(W,H,run.planet,run.introT);return}const p=run.planet,view=18+clamp((equippedGear().chassis?.tier||1)-1,0,5)*1.8,cell=W/view,camX=run.x,camY=run.progress,cols=Math.ceil(W/cell)+4,rows=Math.ceil(H/cell)+4;ctx.save();if(run.shake>0){ctx.translate((Math.random()-.5)*run.shake,(Math.random()-.5)*run.shake);run.shake*=.88}ctx.fillStyle=p.arch.sky;ctx.fillRect(0,0,W,H);const surfaceLocal=localDepth(run.progress,p),nearSurface=surfaceLocal<30;if(nearSurface)drawSkyDecor(W,H,p);const minX=Math.floor(camX-cols/2),maxX=Math.ceil(camX+cols/2),minY=Math.floor(camY-rows/2),maxY=Math.ceil(camY+rows/2);for(let wy=minY;wy<=maxY;wy++)for(let wx=minX;wx<=maxX;wx++){const depth=localDepth(wy,p);if(depth<0)continue;const [sx,sy]=worldToScreen(wx,wy,camX,camY,cell,W,H),c=getCell(wx,wy);if(!c||c.empty)continue;if(c.crystal)drawCrystal(c,sx,sy,cell,wx,wy);else drawTerrainBlock(c,sx,sy,cell,wx,wy)}for(const e of run.enemies)drawEnemy(e,camX,camY,cell,W,H);for(const pr of run.projectiles){const [x,y]=worldToScreen(pr.x,pr.y,camX,camY,cell,W,H);ctx.fillStyle=pr.c;ctx.fillRect(x-2,y-2,4,4)}for(const q of run.particles){q.x+=q.vx*.02;q.y+=q.vy*.02;q.t-=.025;const [x,y]=worldToScreen(q.x,q.y,camX,camY,cell,W,H);ctx.globalAlpha=clamp(q.t,0,1);ctx.fillStyle=q.c;ctx.fillRect(x,y,q.s,q.s)}run.particles=run.particles.filter(q=>q.t>0);ctx.globalAlpha=1;

let codexTab='minerals';
function renderCodex(){const tabs=[['minerals','MINERAIS'],['crystals','CRISTAUX'],['enemies','ENNEMIS'],['planets','PLANETES']];let h=`<h4>CODEX</h4><div class="codexTabs">${tabs.map(t=>`<button class="chip ${codexTab===t[0]?'active':''}" data-codex="${t[0]}">${t[1]}</button>`).join('')}</div><div class="codexGrid">`;if(codexTab==='minerals')for(const m of mineralDefs){const seen=save.codex.minerals[m[0]]||m[0]==='stone';h+=`<div class="card codexItem"><canvas width="48" height="48" data-mineral="${m[0]}" class="${seen?'':'unknown'}"></canvas><b>${seen?m[1]:'???'}</b><small>${seen?fmt(save.codex.minerals[m[0]]||0)+' extraits · '+m[2]+' CR':'Non decouvert'}</small></div>`}else if(codexTab==='crystals')crystalNames.forEach((n,i)=>{const seen=save.codex.crystals[i];h+=`<div class="card codexItem"><canvas width="48" height="48" data-crystal="${i}" class="${seen?'':'unknown'}"></canvas><b>${seen?n:'???'}</b><small>${seen?seen+' trouves':'Non decouvert'}</small></div>`});else if(codexTab==='enemies')for(const [k,f] of Object.entries(familyDefs)){const seen=save.codex.enemies[k];h+=`<div class="card codexItem"><canvas width="48" height="48" data-family="${k}" class="${seen?'':'unknown'}"></canvas><b>${seen?f.name:'???'}</b><small>${seen?seen+' impacts':'Non rencontre'}</small></div>`}else for(const a of archetypes){const seen=save.codex.planets[a.id];h+=`<div class="card codexItem"><canvas width="48" height="48" data-arch="${a.id}" class="${seen?'':'unknown'}"></canvas><b>${seen?a.name:'???'}</b><small>${seen?'Archive planetaire':'Non visite'}</small></div>`}h+='</div>';$('#codex').innerHTML=h;$$('[data-codex]').forEach(b=>b.onclick=()=>{codexTab=b.dataset.codex;renderCodex()});paintCodex()}
function paintCodex(){$$('[data-mineral]').forEach(c=>{const x=c.getContext('2d'),M=mineralById[c.dataset.mineral];x.fillStyle='#4b5359';x.fillRect(0,0,48,48);x.fillStyle=M.c;for(let i=0;i<8;i++)x.fillRect(7+(i*17)%35,8+(i*13)%34,5,5)});$$('[data-crystal]').forEach(c=>{const x=c.getContext('2d'),i=+c.dataset.crystal,col=['#d9e8ef','#e7c95b','#54b8e6','#ed7051','#a776df','#b8e8f1','#54e1ca','#e194df'][i];x.fillStyle='#141b20';x.fillRect(0,0,48,48);x.save();x.translate(24,27);x.fillStyle=col;x.beginPath();x.moveTo(0,-18);x.lineTo(8,-5);x.lineTo(5,10);x.lineTo(-5,10);x.lineTo(-8,-5);x.closePath();x.fill();x.globalAlpha=.35;x.fillStyle='#fff';x.fillRect(-2,-13,2,13);x.restore()});$$('[data-family]').forEach(c=>{const x=c.getContext('2d'),f=familyDefs[c.dataset.family];x.fillStyle='#11181c';x.fillRect(0,0,48,48);x.fillStyle=f.c;x.fillRect(11,16,26,16);x.fillStyle='#111';x.fillRect(17,21,4,4);x.fillRect(28,21,4,4)});$$('[data-arch]').forEach(c=>{const a=archetypes.find(x=>x.id===c.dataset.arch);paintPlanet(c,{seed:123,arch:a,diameter:20000,bonus:false},false)})}
function renderStats(){const s=save.stats,groups=[['PROGRESSION',[['Niveau',save.level],['XP',fmt(save.xp)+' / '+fmt(xpNeed())],['Credits',fmt(save.credits)],['Stuff',save.inventory.length]]],['EXPEDITIONS',[['Temps',Math.floor(s.play/3600)+'h '+Math.floor(s.play/60%60)+'m'],['Runs',fmt(s.runs)],['Meilleure profondeur',Math.round(s.bestDepth)+'%'],['Meilleur combo','x'+(1+(s.bestCombo||0)*.08).toFixed(1)]]],['EXPLORATION',[['Systemes',fmt(s.systems)],['Planetes',fmt(s.planets)],['Geodes',fmt(s.geodes)],['Structures',fmt(s.structures)],['Ennemis',fmt(s.kills)],['Minerais rares',fmt(s.rare)]]]];$('#stats').innerHTML=`<h4>STATISTIQUES</h4>${groups.map((g,i)=>`<details class="card" ${i===0?'open':''}><summary>${g[0]}</summary><div class="coreStats" style="margin-top:7px">${g[1].map(v=>`<div class="statBox"><small>${v[0]}</small><b>${v[1]}</b></div>`).join('')}</div></details>`).join('')}<div class="card"><button class="btn" id="wipe" style="width:100%">EFFACER LA SAUVEGARDE V2</button></div>`;$('#wipe').onclick=()=>{if(confirm('Tout effacer ?')){localStorage.removeItem(SAVE_KEY);location.reload()}}}

/* ---------- APP ---------- */
function openScreen(id){$$('.screen').forEach(s=>s.classList.remove('show'));$('#'+id).classList.add('show');$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.screen===id));if(id==='hangar')renderHangar();if(id==='system')renderSystem();if(id==='skills')renderSkills();if(id==='codex')renderCodex();if(id==='stats')renderStats();if(id==='game'&&!run)showPreRun()}
function showPreRun(){const p=currentPlanet();save.codex.planets[p.arch.id]=1;$('#game').classList.add('show');$('#results').classList.remove('show');toast('PRET POUR '+p.name+' · TOUCHE FORAGE POUR LANCER');}
function toast(t){const e=$('#eventBanner');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1800)}
function updateTop(){const p=currentPlanet();$('#credits').textContent=fmt(save.credits);$('#level').textContent='LV.'+save.level;$('#topPlanet').textContent=p.name+' · '+p.arch.name}
$$('.nav').forEach(n=>n.onclick=()=>{if(run&&run.alive&&run.intro<=0&&n.dataset.screen!=='game')return toast('TERMINE LA DESCENTE AVANT');openScreen(n.dataset.screen)});
canvas.addEventListener('pointerdown',e=>{if(!run){startRun();return}if(run.intro>0)return;pointer.down=true;setSteer(e)});canvas.addEventListener('pointermove',e=>{if(pointer.down&&run)setSteer(e)});addEventListener('pointerup',()=>pointer.down=false);function setSteer(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;run.targetAngle=clamp((x-.5)*1.45,-.68,.68)}
$('#boostBtn').onclick=e=>{e.stopPropagation();triggerBoost()};$('#abortBtn').onclick=e=>{e.stopPropagation();if(run&&run.alive&&run.intro<=0)endRun('EXPEDITION TERMINEE')};$('#replayBtn').onclick=()=>startRun();$('#workshopBtn').onclick=()=>{run=null;$('#results').classList.remove('show');openScreen('hangar')};
function boot(){ensureSystem();updateTop();paintPlanet($('#startPlanet'),currentPlanet(),false);resizeCanvas();renderDepthMeter();if(localStorage.getItem(SAVE_KEY))$('#continueBtn').textContent='CONTINUER';$('#continueBtn').onclick=()=>{$('#start').style.display='none';openScreen('hangar')};$('#newSaveBtn').onclick=()=>{if(confirm('Nouvelle sauvegarde V2 ?')){save=freshSave();ensureStarterGear();ensureSystem();persist();location.reload()}}}
let acc=0;function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;while(acc>=1/60){updateRun(1/60);acc-=1/60}updateHUD();drawGame();requestAnimationFrame(loop)}
boot();requestAnimationFrame(loop);setInterval(persist,12000);
</script>
</body></html>
