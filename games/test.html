<title>PixelTrail</title>
<style>

@media(pointer:coarse),(max-width:700px){#pad{display:block}#sc{display:none}#hud{width:154px;font-size:10px}#mc{width:108px;height:108px}#coords{bottom:122px}}

<body>

</div>

<canvas id="mc"></canvas>
<div id="coords">x 0  |  y 0</div>

  <button class="pd" id="pl" data-x="-1" data-y="0">&lt;</button>

</div>

<script>
const CFG={PROJECT_ID:`${location.hostname||"pixeltrail.local"}${location.pathname||"/"}_mirror_v3`.replace(/[^a-zA-Z0-9._\/-]/g,"_"),CLOUD_HOST:"wss://clouddata.turbowarp.org",TILE:20,MOVE_MS:80,POS_MS:260,SNAPSHOT_MS:12000,SLOTS:29,BANKS:95,BANK_MOVES:48000,CHUNK:32,MINI_CELL:16,WORLD_LIMIT:999,WORLD_SPAN:1999,PLAYER_TTL:15000,CLAIM_WAIT:520,RECONNECT_MS:2500,DPR_MAX:2,PARTICLES:180};
const $=id=>document.getElementById(id);

const encoder=new TextEncoder();

function packDirs(dirs){

function unpackDirs(payload,count){

}
function colorFromToken(token){

  return {css:`hsl(${hue|0} 82% 62%)`,rgb:hslToRgb(hue/360,.82,.62)};
}
function hslToRgb(h,s,l){
  const f=n=>{const k=(n+h*12)%12;return l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1));};

const THEMES=[
  {id:0,name:"Auto",css:null},
  {id:1,name:"Cyan",css:"hsl(195 88% 62%)"},
  {id:2,name:"Rose",css:"hsl(335 88% 66%)"},
  {id:3,name:"Lime",css:"hsl(95 80% 60%)"},
  {id:4,name:"Gold",css:"hsl(42 96% 60%)"},
  {id:5,name:"Purple",css:"hsl(272 86% 67%)"},
  {id:6,name:"Red",css:"hsl(6 92% 63%)"},
  {id:7,name:"Ice",css:"hsl(210 92% 72%)"}
];
const SHAPES=[
  {id:0,name:"Square",icon:"SQ"},
  {id:1,name:"Round",icon:"O"},
  {id:2,name:"Diamond",icon:"<>"},
  {id:3,name:"Soft",icon:"RR"}
];
function getTheme(themeId,token){
  if(themeId){
    const item=THEMES.find(t=>t.id===themeId);
    if(item&&item.css){
      const m=item.css.match(/hsl\((\d+) (\d+)% (\d+)%\)/);
      const h=Number(m[1])/360,s=Number(m[2])/100,l=Number(m[3])/100;

}
function drawShape(ctx,x,y,size,color,shape,stroke=false){

function normalizeName(text){

}
function alphaForCount(n){return Math.min(.92,.16+Math.log2(n+1)*.17)}
function floorDiv(a,b){return Math.floor(a/b)}
function mod(a,b){return ((a%b)+b)%b}
class TrailChunk{

  }
  remove(index){
    if(this.counts[index]===0)return false;
    this.counts[index]--;

  recolor(rgb){this.rgb=rgb;for(const index of this.used)this.paint(index)}
}
class TrailStore{
  constructor(color){this.color=color.css;this.rgb=color.rgb;this.chunks=new Map();this.coarse=new Map();this.unique=0;this.visits=0}
  key(cx,cy){return `${cx},${cy}`}
  getChunk(cx,cy,create=false){
    const k=this.key(cx,cy);
    let c=this.chunks.get(k);
    if(!c&&create){c=new TrailChunk(cx,cy,this.rgb);this.chunks.set(k,c)}
    return c;
  }
  add(x,y){
    const cx=floorDiv(x,CFG.CHUNK),cy=floorDiv(y,CFG.CHUNK),lx=mod(x,CFG.CHUNK),ly=mod(y,CFG.CHUNK),c=this.getChunk(cx,cy,true),first=c.add(ly*CFG.CHUNK+lx);
    if(first)this.unique++;
    this.visits++;
    const mx=floorDiv(x,CFG.MINI_CELL),my=floorDiv(y,CFG.MINI_CELL),mk=this.key(mx,my);
    this.coarse.set(mk,(this.coarse.get(mk)||0)+1);
  }
  remove(x,y){
    const cx=floorDiv(x,CFG.CHUNK),cy=floorDiv(y,CFG.CHUNK),c=this.getChunk(cx,cy,false);

    const index=mod(y,CFG.CHUNK)*CFG.CHUNK+mod(x,CFG.CHUNK),gone=c.remove(index);

  }
  addPath(path){for(let i=0;i<path.length;i+=2)this.add(path[i],path[i+1])}

  recolor(color){this.color=color.css;this.rgb=color.rgb;for(const c of this.chunks.values())c.recolor(this.rgb)}
  draw(ctx,vx0,vy0,vx1,vy1,left,top,tile,offX=0,offY=0){

function buildPath(startX,startY,payload,from,to,paintStart){

function buildLivePath(startX,startY,payload,count){return buildPath(startX,startY,payload,0,count,false).data}
function encodeBank(slot,token,seq,revision,paintStart,startX,startY,dirs){

function decodeBank(value){

function encodePlayer(token,themeId,shapeId,ts,x,y,score,bankId,bankSeq,snapCount,tailStartX,tailStartY,tailDirs,name){
  return "1"+PAD(token,9)+PAD(themeId,2)+PAD(shapeId,1)+PAD(ts,10)+encCoord(x)+encCoord(y)+PAD(score,12)+PAD(bankId,2)+PAD(bankSeq,4)+PAD(snapCount,5)+encCoord(tailStartX)+encCoord(tailStartY)+PAD(tailDirs.length,3)+packDirs(tailDirs)+encodeText(name);
}

function drawParticles(left,top,now){

  }

  if(speed){ctx.save();ctx.strokeStyle=myColor.css;ctx.lineWidth=2;ctx.globalAlpha=.13+.12*Math.sin(now*.018);for(let i=0;i<5;i++){const side=(i-2)*5,len=10+i*3,px1=sx-dx*(14+i*4)+dy*side,py1=sy-dy*(14+i*4)-dx*side;ctx.beginPath();ctx.moveTo(px1,py1);ctx.lineTo(px1-dx*len,py1-dy*len);ctx.stroke()}ctx.restore()}

function drawMinimap(now){
  const size=parseFloat(getComputedStyle(mc).width),r=size/2,scale=size/CFG.WORLD_SPAN;
  mctx.clearRect(0,0,size,size);mctx.save();mctx.beginPath();mctx.arc(r,r,r-1,0,Math.PI*2);mctx.clip();mctx.fillStyle="#05080c";mctx.fillRect(0,0,size,size);

function loop(now){
  if(!running)return;
  if(now-lastMoveAt>=CFG.MOVE_MS){
    const steps=Math.min(3,Math.floor((now-lastMoveAt)/CFG.MOVE_MS));lastMoveAt+=steps*CFG.MOVE_MS;
    for(let i=0;i<steps;i++)if((dx||dy)&&currentDirs.length<CFG.BANK_MOVES)addMove(dx,dy);
  }
  if(now-lastPosAt>=CFG.POS_MS){lastPosAt=now;broadcastPlayer()}
  syncCurrentBank(false);
  if(now-lastCleanupAt>2000){lastCleanupAt=now;cleanupPlayers()}
  if(now-lastScoreboardAt>500){lastScoreboardAt=now;updateHud();updateScoreboard()}
  drawWorld(now);
  if(now-lastMiniAt>120){lastMiniAt=now;drawMinimap(now)}
  requestAnimationFrame(loop);
}

let canvasPointer=-1;
cv.addEventListener("pointerdown",e=>{
