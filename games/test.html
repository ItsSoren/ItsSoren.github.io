function encodeBank(slot,token,seq,revision,paintStart,startX,startY,dirs){

function decodePlayer(value){

function applyBankRecord(id,rec){

function hydratePlayerBanks(slot){

  ids.sort((a,b)=>bankRecords[a].parsed.seq-bankRecords[b].parsed.seq);

function rebuildPlayer(slot){

function removeLive(p){if(p&&p.livePath){p.store.removePath(p.livePath);p.livePath=null}}
function refreshLive(p){

function parseAllBanks(){

function ownBankGroups(){

function slotFree(slot){

function restoreLocal(group){

  }

function randomSpawn(){return Math.floor(Math.random()*1001)-500}
async function claimSlot(preferred=-1){
  claiming=true;
  const candidates=[];
  if(preferred>=0)candidates.push(preferred);
  const rest=Array.from({length:CFG.SLOTS},(_,i)=>i).filter(i=>i!==preferred).sort(()=>Math.random()-.5);
  candidates.push(...rest);
  for(const slot of candidates){
    const present=decodePlayer(cvars[`P${slot}`]);
    if(present&&present.token!==myToken&&!slotFree(slot))continue;
    mySlot=slot;
    broadcastPlayer();
    await sleep(CFG.CLAIM_WAIT);
    let check=decodePlayer(cvars[`P${slot}`]);
    if(check&&check.token!==myToken&&myToken<check.token){broadcastPlayer();await sleep(CFG.CLAIM_WAIT);check=decodePlayer(cvars[`P${slot}`])}
    if(check&&check.token===myToken){claiming=false;return true}
  }
  mySlot=-1;claiming=false;return false;
}
async function reacquireSlot(){

  claiming=true;
  const old=mySlot;
  mySlot=-1;
  const ok=await claimSlot(-1);
  if(!ok){running=false;toast("Aucun slot disponible");return}

  if(old>=0&&old!==mySlot)cloudSet(`P${old}`,"0");

function bankOwnerActive(bank){

}
function bankAvailable(id){
  const value=cvars[`D${id}`];
  if(!value||value==="0")return true;
  const b=decodeBank(value);
  return !b||!bankOwnerActive(b);
}
async function claimBank(seq,startX,startY,paintStart){
  const ids=Array.from({length:CFG.BANKS},(_,i)=>i).sort(()=>Math.random()-.5);
  const active=Math.max(1,countActive()+(running?0:1)),reserve=Math.max(0,CFG.SLOTS-active),freeNow=ids.filter(bankAvailable).length;
  if(freeNow<=reserve)return -1;
  for(const id of ids){
    if(!bankAvailable(id))continue;
    const value=encodeBank(mySlot,myToken,seq,1,paintStart,startX,startY,[]);
    cloudSet(`D${id}`,value);
    await sleep(CFG.CLAIM_WAIT);
    let check=decodeBank(cvars[`D${id}`]);
    if(check&&check.token!==myToken&&myToken<check.token){cloudSet(`D${id}`,value);await sleep(CFG.CLAIM_WAIT);check=decodeBank(cvars[`D${id}`])}

async function allocateNextBank(){

  currentBankId=id;currentBankSeq++;currentBankRevision=1;currentBankStartX=px;currentBankStartY=py;currentBankPaintStart=false;currentDirs=[];snapCount=0;tailStartX=px;tailStartY=py;tailDirs=[];lastSnapshotAt=performance.now();broadcastPlayer();allocatingBank=false;return true;

function syncCurrentBank(force=false){

function broadcastPlayer(){

async function bootstrapGame(){
  parseAllBanks();
  const restore=findRestoreGroup();
  if(restore)restoreLocal(restore);else{px=randomSpawn();py=randomSpawn();myStore=new TrailStore(myColor);myStore.add(px,py);score=0;currentBankSeq=0;currentBankStartX=px;currentBankStartY=py;currentBankPaintStart=true;currentDirs=[];snapCount=0;tailStartX=px;tailStartY=py;tailDirs=[];ownedBanks=[]}

function updateCounts(){$("hp").textContent=countActive();$("hb").textContent=ownedBanks.length}

const cv=$("cv"),ctx=cv.getContext("2d",{alpha:false}),mc=$("mc"),mctx=mc.getContext("2d");
let viewW=innerWidth,viewH=innerHeight,dpr=1;
function resize(){
  dpr=Math.min(devicePixelRatio||1,CFG.DPR_MAX);viewW=innerWidth;viewH=innerHeight;cv.width=Math.round(viewW*dpr);cv.height=Math.round(viewH*dpr);cv.style.width=`${viewW}px`;cv.style.height=`${viewH}px`;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
  const size=parseFloat(getComputedStyle(mc).width);mc.width=Math.round(size*dpr);mc.height=Math.round(size*dpr);mctx.setTransform(dpr,0,0,dpr,0,0);mctx.imageSmoothingEnabled=false;

addEventListener("resize",resize,{passive:true});resize();
function drawWorld(){

  const left=camX-viewW/2,top=camY-viewH/2,vx0=Math.floor(left/CFG.TILE)-1,vy0=Math.floor(top/CFG.TILE)-1,vx1=Math.ceil((left+viewW)/CFG.TILE)+1,vy1=Math.ceil((top+viewH)/CFG.TILE)+1;

function drawMinimap(){

function loop(now){

const KEYMAP={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1],q:[-1,0],z:[0,-1]};
