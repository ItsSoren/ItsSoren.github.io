<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TAPIS // party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#152A22; --panel:#1E3B31; --line:#325548; --text:#F5EFE0; --dim:#8FAD9E;
  --accent:#F2B705; --accent2:#FF6B6B; --ok:#6BE38B; --bad:#FF5D73;
  --disp:'Fredoka',sans-serif; --body:'Nunito Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;touch-action:manipulation}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 15% 25%,#F2B70522 0 5px,transparent 6px),
    radial-gradient(circle at 75% 55%,#FF6B6B22 0 5px,transparent 6px),
    radial-gradient(circle at 40% 82%,#6BE38B1c 0 4px,transparent 5px),
    radial-gradient(circle at 88% 12%,#F2B70518 0 4px,transparent 5px);
  background-size:150px 150px,190px 190px,130px 130px,170px 170px}
.scr{position:relative;z-index:1;min-height:100vh;display:none;flex-direction:column;align-items:center;padding:56px 16px 40px}
.scr.active{display:flex}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:11px;color:var(--dim);background:#152A22ee;border-bottom:1px solid var(--line)}
#bar .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:6px}
#bar.on .dot{background:var(--ok);box-shadow:0 0 6px var(--ok)}
h1{font-family:var(--disp);font-size:clamp(1.5em,7vw,2.2em);font-weight:600;letter-spacing:.2px}
h1 .a{color:var(--accent)}
h2{font-family:var(--disp);font-size:1.05em;color:var(--dim);font-weight:600;margin-bottom:12px}
.eyebrow{font-family:var(--disp);font-size:11px;letter-spacing:2px;color:var(--accent2);text-transform:uppercase;margin-bottom:6px}
p.lead{color:var(--dim);font-size:13px;max-width:400px;line-height:1.5;margin-top:6px}
.wrap{width:100%;max-width:440px;margin-top:10px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
input[type=text]{width:100%;background:#0F211B;border:2px solid var(--line);color:var(--text);font-family:var(--body);font-weight:700;font-size:16px;padding:14px;border-radius:12px;outline:none}
input[type=text]:focus{border-color:var(--accent2)}
.bigcode{text-align:center;font-family:var(--disp);font-size:1.9em;letter-spacing:7px;font-weight:600;color:var(--accent2)}
label{display:block;font-family:var(--disp);font-size:10px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.field{margin-bottom:14px}
button{font-family:var(--disp);font-weight:600;font-size:14px;border:none;border-radius:14px;padding:15px;cursor:pointer;transition:transform .08s ease,opacity .08s ease;-webkit-user-select:none;user-select:none;min-height:46px}
button:active:not(:disabled){transform:scale(.95);opacity:.75}
button:disabled{opacity:.35}
.p{background:var(--accent);color:#2A1D00;width:100%}
.o{background:transparent;color:var(--accent2);border:2px solid var(--accent2);width:100%}
.msg{font-size:12px;color:var(--dim);min-height:16px;margin-top:8px;text-align:center}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.div{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--dim);font-family:var(--disp);font-size:10px;letter-spacing:2px}
.div::before,.div::after{content:'';flex:1;height:1px;background:var(--line)}
.prow{display:flex;align-items:center;justify-content:space-between;background:#0F211B;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px}
.pdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:8px}
.tag{font-family:var(--disp);font-size:9px;background:var(--accent);color:#2A1D00;padding:3px 8px;border-radius:20px;font-weight:600}
.tag.off{background:var(--bad);color:#2A0505}
.kickbtn{background:transparent;border:2px solid var(--bad);color:var(--bad);font-size:9px;padding:5px 10px;border-radius:20px;min-height:0}
.gamegrid{display:grid;gap:12px;width:100%;max-width:440px;margin-top:14px}
.gcard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:18px;text-align:left}
.gcard:active:not(:disabled){border-color:var(--accent)}
.gcard:disabled{opacity:.4}
.gtag{font-family:var(--disp);font-size:9px;letter-spacing:1.5px;color:var(--accent2);text-transform:uppercase;display:block;margin-bottom:6px}
.gname{font-family:var(--disp);font-size:1.1em;font-weight:600}
.gdesc{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
#top{position:fixed;top:34px;left:0;right:0;z-index:40;display:flex;justify-content:center}
#top .pill{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:6px 16px;font-family:var(--disp);font-size:12px;color:var(--dim)}
#top .pill b{color:var(--accent)}
.bignum{font-family:var(--disp);font-size:3em;font-weight:600;color:var(--accent2);text-align:center;margin-top:8px}
.sbrow{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px;font-size:13px}
.sbrow.me{border-color:var(--accent)}
.sbrank{font-family:var(--disp);color:var(--dim);width:24px;font-weight:600}
.sbname{flex:1;margin-left:6px;display:flex;align-items:center}
.sbscore{font-family:var(--disp);color:var(--accent2);font-weight:600}
.row2{display:flex;gap:10px;width:100%;max-width:440px;margin-top:16px}
.row2 button{flex:1}
.tablewrap{width:100%;max-width:460px;margin-top:18px}
.oppstrip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.oppchip{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:11px;text-align:center;min-width:64px}
.oppchip.turn{border-color:var(--accent)}
.oppchip .nm{color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.oppchip .ct{color:var(--dim);font-family:var(--disp);margin-top:2px}
.pile{display:flex;justify-content:center;align-items:center;gap:14px;min-height:120px;margin:10px 0}
.card{width:70px;height:100px;border-radius:12px;background:#F5EFE0;color:#152A22;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:600;box-shadow:0 3px 0 #0002;position:relative}
.card.red{color:#C0392B}
.card .v{font-size:1.4em}
.card .s{font-size:1.1em;margin-top:2px}
.card.back{background:linear-gradient(135deg,var(--accent2),#B33A3A);color:transparent}
.card.trump{box-shadow:0 3px 0 #0002,0 0 0 2px var(--accent)}
.card.mini{width:52px;height:76px}
.card.mini .v{font-size:1.05em}
.handrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:16px;max-width:460px}
.handrow .card{cursor:pointer;transition:transform .1s}
.handrow .card:active{transform:translateY(-6px)}
.handrow .card.dis{opacity:.35;cursor:default}
.handrow .card.dis:active{transform:none}
.trickzone{display:flex;justify-content:center;gap:10px;min-height:110px;align-items:center;flex-wrap:wrap}
.trickslot{display:flex;flex-direction:column;align-items:center;gap:4px}
.trickslot .nm{font-size:10px;color:var(--dim);font-family:var(--disp)}
.centerlabel{font-family:var(--disp);font-size:11px;color:var(--dim);text-align:center;margin-top:6px;letter-spacing:1px;text-transform:uppercase}
.waitbox{text-align:center;padding:30px 0;color:var(--dim);font-family:var(--disp);font-size:13px}
</style>
</head>
<body>
<div id="bar"><span><span class="dot"></span><span id="bartxt">Non connecté</span></span><span id="barroom"></span></div>

<section class="scr active" id="s-name">
  <div class="wrap">
    <div class="eyebrow">// tapis de jeu</div>
    <h1>Choisis ton <span class="a">pseudo</span></h1>
    <p class="lead">2 à 4 joueurs, une manette chacun. Aucun compte — juste un pseudo et un code.</p>
    <div class="card" style="width:auto;height:auto;background:var(--panel);color:var(--text);display:block;box-shadow:none">
      <div class="field"><label>Pseudo</label><input type="text" id="i-name" maxlength="12" placeholder="Nova"></div>
      <button class="p" id="b-name">Continuer →</button>
      <div class="msg" id="m-name"></div>
    </div>
  </div>
</section>

<section class="scr" id="s-join">
  <div class="wrap">
    <div class="eyebrow">// salon</div>
    <h1>Rejoindre ou <span class="a">créer</span></h1>
    <div class="card" style="width:auto;height:auto;background:var(--panel);color:var(--text);display:block;box-shadow:none"><label>Créer un salon (2-4 joueurs)</label><button class="p" id="b-create">Créer un salon</button></div>
    <div class="div">OU</div>
    <div class="card" style="width:auto;height:auto;background:var(--panel);color:var(--text);display:block;box-shadow:none">
      <label>Code du salon</label>
      <input type="text" id="i-code" class="bigcode" maxlength="4" inputmode="numeric" placeholder="0000">
      <button class="o" id="b-join" style="margin-top:10px">Rejoindre</button>
      <div class="msg" id="m-join"></div>
    </div>
  </div>
</section>

<section class="scr" id="s-lobby">
  <div class="wrap">
    <div class="eyebrow">// salon <span id="lobbycode"></span></div>
    <h1>Salle d'<span class="a">attente</span></h1>
    <p class="lead" id="lobbyhint"></p>
    <div class="card" style="width:auto;height:auto;background:var(--panel);color:var(--text);display:block;box-shadow:none"><h2>Joueurs (<span id="lc">1</span>/4)</h2><div id="plist"></div></div>
    <div id="hostctl" style="display:none;width:100%"><button class="p" id="b-picker" style="margin-top:14px">Choisir un jeu →</button></div>
  </div>
</section>

<section class="scr" id="s-picker">
  <div class="wrap"><div class="eyebrow">// chef de partie</div><h1>Choisis le <span class="a">jeu</span></h1><p class="lead" id="pk-hint"></p></div>
  <div class="gamegrid">
    <button class="gcard" data-g="1"><span class="gtag">Cartes · 52</span><div class="gname">BATAILLE</div><div class="gdesc">Paquet réparti. La plus forte carte ramasse le pli. Égalité = bataille. Dernier avec des cartes gagne.</div></button>
    <button class="gcard" data-g="2"><span class="gtag">Cartes · 78 · Atouts</span><div class="gname">TAROT ALLÉGÉ</div><div class="gdesc">4 couleurs + 22 atouts. Plis tour par tour, obligation de suivre ou couper.</div></button>
    <button class="gcard" data-g="3"><span class="gtag">Cartes · Casino</span><div class="gname">BLACKJACK</div><div class="gdesc">Chacun joue son tour face au croupier. Approche-toi de 21 sans dépasser.</div></button>
  </div>
</section>

<section class="scr" id="s-game">
  <div id="top"><div class="pill" id="g-pill">–</div></div>
  <div class="wrap" style="margin-top:60px;text-align:center">
    <div class="eyebrow" id="g-eyebrow">// jeu</div>
    <h1 id="g-title">…</h1>
  </div>
  <div class="tablewrap">
    <div class="oppstrip" id="g-opps"></div>
    <div class="trickzone" id="g-trick"></div>
    <div class="centerlabel" id="g-center"></div>
    <div class="pile" id="g-pile"></div>
  </div>
  <div id="g-controls" style="width:100%;max-width:460px"></div>
  <div class="handrow" id="g-hand"></div>
  <div class="msg" id="g-msg"></div>
</section>

<section class="scr" id="s-results">
  <div class="wrap">
    <div class="eyebrow">// résultats</div><h1>Fin de <span class="a">partie</span></h1>
    <div class="card" id="res-detail" style="width:auto;height:auto;background:var(--panel);color:var(--text);display:block;box-shadow:none"></div>
    <h2 style="margin-top:22px">Classement</h2>
    <div id="res-sb"></div>
    <div id="res-hostctl" style="display:none;width:100%;margin-top:8px">
      <button class="p" id="b-next">Rejouer ce jeu →</button>
      <button class="o" id="b-back" style="margin-top:8px">Changer de jeu</button>
    </div>
  </div>
</section>

<script>
'use strict';
/* project_id texte non-numérique = conforme aux règles TurboWarp cloud
   (un ID purement numérique est traité comme un vrai projet Scratch et
   déclenche une vérification qui échoue silencieusement) */
const CFG = {PROJECT_ID:"soren-lab.github.io/nebula-party", SLOTS:4};
const PAD=(n,d)=>String(Math.max(0,Math.min(Math.trunc(n),10**d-1))).padStart(d,"0");
function checksum2(s){let sum=0;for(let i=0;i<s.length;i++)sum+=s.charCodeAt(i);return PAD(sum%100,2)}

function n2d(s){let o="";for(let i=0;i<Math.min(s.length,14);i++)o+=PAD(s.charCodeAt(i),3);return o}
function d2n(s){let o="";for(let i=0;i+2<s.length;i+=3){const c=parseInt(s.slice(i,i+3));if(c>=32&&c<127)o+=String.fromCharCode(c)}return o}

function encSlot(room,host,present,score,name){return PAD(room,4)+(host?"1":"0")+(present?"1":"0")+PAD(score+5000000,7)+n2d(name)}
function decSlot(v){if(!v||v.length<14)return null;const r=parseInt(v.slice(0,4));if(isNaN(r))return null;
  return {room:r,isHost:v[4]==="1",present:v[5]==="1",score:parseInt(v.slice(6,13))-5000000,name:d2n(v.slice(13))}}

function encGame(room,phase,gid,round,epoch){return PAD(room,4)+PAD(phase,2)+PAD(gid,2)+PAD(round,2)+PAD(epoch%1e10,10)}
function decGame(v){if(!v||v.length<20)return null;return{room:parseInt(v.slice(0,4)),phase:parseInt(v.slice(4,6)),gameId:parseInt(v.slice(6,8)),round:parseInt(v.slice(8,10)),epoch:parseInt(v.slice(10,20))}}

// ETAT{n}: un blob JSON encodé en base numérique (chiffres seulement), fragmenté si besoin.
// On encode chaque caractère JSON en 2 chiffres (index dans un alphabet de 90 symboles imprimables).
const B90="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!\"#$%&'()*+,-./:;<=>?@[]^_`{|}~ ";
function txt2num(s){let o="";for(let i=0;i<s.length;i++){const idx=B90.indexOf(s[i]);o+=PAD(idx<0?89:idx,2)}return o}
function num2txt(s){let o="";for(let i=0;i+1<s.length;i+=2){const idx=parseInt(s.slice(i,i+2));if(!isNaN(idx)&&B90[idx])o+=B90[idx]}return o}

function encState(room,seq,obj){
  const body=JSON.stringify(obj);
  const payload=PAD(room,4)+PAD(seq%10000,4)+txt2num(body);
  return payload+checksum2(payload);
}
function decState(v){
  if(!v||v.length<10)return null;
  const body=v.slice(0,-2),cs=v.slice(-2);
  if(checksum2(body)!==cs)return null;
  const room=parseInt(body.slice(0,4)),seq=parseInt(body.slice(4,8));
  try{const obj=JSON.parse(num2txt(body.slice(8)));return{room,seq,obj}}catch(_){return null}
}

// KICK{n}: RRRR EEEEE (epoch tronqué, juste besoin d'un changement de valeur)
function encKick(room,epoch){return PAD(room,4)+PAD(epoch%100000,5)}
function encBeat(room,epoch){return PAD(room,4)+PAD(epoch%100000,5)}

function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seed){const rnd=mulberry32(seed),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let ws=null,myName="",mySlot=-1,myRoom=0,isHost=false,myScore=0,lastGame=null,handled=-1,joinedAt=0;
const cvars={},players={};
let lastHostBeatSeen=Date.now();
let gHost=null;     // état complet du jeu, détenu par le chef
let gView=null;     // dernière vue reçue (tous les clients, y compris le chef)
let gSeqSeen=-1;
let gHandled=-1;    // clé de manche déjà lancée localement

function connect(cb){
  const user="p"+Math.floor(1000+Math.random()*8999);
  ws=new WebSocket("wss://clouddata.turbowarp.org");
  ws.onopen=()=>{ws.send(JSON.stringify({method:"handshake",project_id:CFG.PROJECT_ID,user}));setBar(true,"Connecté");if(cb)setTimeout(cb,350)};
  ws.onmessage=e=>{for(const l of e.data.split("\n")){if(!l.trim())continue;try{
    const d=JSON.parse(l);
    if(d.method==="set"){const nm=d.name.replace(/^☁\s?/,"");cvars[nm]=String(d.value);onVar(nm,String(d.value))}
  }catch(_){}}};
  ws.onclose=()=>{setBar(false,"Déconnecté — reconnexion…");setTimeout(()=>connect(),2500)};
  ws.onerror=()=>setBar(false,"Erreur réseau");
}
function cset(name,val){const s=String(val).replace(/[^0-9]/g,"");if(!ws||ws.readyState!==1||!s)return;ws.send(JSON.stringify({method:"set",name:"☁ "+name,value:s}))}
function setBar(on,txt){document.getElementById("bar").classList.toggle("on",on);document.getElementById("bartxt").textContent=txt}

function onVar(name,val){
  if(/^SLOT\d$/.test(name)){
    const slot=parseInt(name.slice(4));if(slot===mySlot)return;
    const d=decSlot(val);if(!d)return;
    if(!d.present||d.room!==myRoom)delete players[slot];
    else{d.lastSeen=Date.now();players[slot]=d}
    refreshLobby();refreshResults();return;
  }
  if(name==="GAME"){const d=decGame(val);if(!d)return;if(myRoom&&d.room!==myRoom)return;lastGame=d;onPhase(d);return}
  if(name==="HOSTBEAT"){lastHostBeatSeen=Date.now();return}
  if(name==="STATE"){
    const d=decState(val);if(!d||d.room!==myRoom)return;
    if(d.seq===gSeqSeen)return;gSeqSeen=d.seq;
    gView=d.obj;renderGame();return;
  }
  if(name==="ACT"){
    if(!isHost||!gHost)return;
    const d=decState(val);if(!d||d.room!==myRoom)return;
    handleAction(d.obj);return;
  }
  if(/^KICK\d$/.test(name)){
    const slot=parseInt(name.slice(4));if(slot!==mySlot)return;
    const room=parseInt(val.slice(0,4));if(room!==myRoom)return;
    if(Date.now()-joinedAt<1500)return;
    kicked();return;
  }
}

function show(id){document.querySelectorAll(".scr").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function msg(id,t,c){const e=document.getElementById(id);e.textContent=t||"";e.className="msg"+(c?" "+c:"")}
function esc(s){return String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}
function color(name){let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%360;return `hsl(${h},65%,60%)`}
function isOnline(slot){return slot===mySlot||(players[slot]&&Date.now()-players[slot].lastSeen<9000)}
function dot(p){const on=p.__me||isOnline(p.__slot);return `<span class="pdot" style="background:${color(p.name)}${on?"":";opacity:.3;filter:grayscale(1)"}"></span>`}

document.getElementById("b-name").onclick=()=>{
  const raw=document.getElementById("i-name").value.trim();
  if(!raw){msg("m-name","Entre un pseudo.","err");return}
  myName=raw.slice(0,12);show("s-join");
};
document.getElementById("i-name").onkeydown=e=>{if(e.key==="Enter")document.getElementById("b-name").click()};

function freeSlot(){
  for(let i=0;i<CFG.SLOTS;i++){
    if(!cvars["SLOT"+i])return i;
    const d=decSlot(cvars["SLOT"+i]);
    if(!d||!d.present)return i;
  }
  return -1;
}
function claim(room,host){
  mySlot=freeSlot();
  if(mySlot<0){msg("m-join","Salon complet (4 joueurs max).","err");return false}
  myRoom=room;isHost=host;myScore=0;joinedAt=Date.now();
  cset("SLOT"+mySlot,encSlot(myRoom,isHost,true,myScore,myName));
  players[mySlot]={room:myRoom,isHost,present:true,score:myScore,name:myName};
  return true;
}

document.getElementById("b-create").onclick=()=>{
  msg("m-join","Création…");
  connect(()=>{const room=1000+Math.floor(Math.random()*9000);
    if(claim(room,true)){enterLobby(room);cset("GAME",encGame(room,0,0,0,Date.now()))}});
};
document.getElementById("b-join").onclick=()=>{
  const code=document.getElementById("i-code").value.trim();
  if(!/^\d{4}$/.test(code)){msg("m-join","Le code fait 4 chiffres.","err");return}
  msg("m-join","Connexion…");
  connect(()=>{if(claim(parseInt(code),false))enterLobby(parseInt(code))});
};
document.getElementById("i-code").oninput=e=>{e.target.value=e.target.value.replace(/[^0-9]/g,"").slice(0,4)};

const SUITS=["♥","♦","♣","♠"]; // 0..3, rouge=0,1
const RANKN={1:"A",11:"V",12:"D",13:"R"};
function rankLabel(r){return RANKN[r]||String(r)}
function isRed(suit){return suit===0||suit===1}
function cardHTML(suit,rank,opts){
  opts=opts||{};
  const cls="card"+(isRed(suit)?" red":"")+(opts.mini?" mini":"")+(opts.trump?" trump":"")+(opts.dis?" dis":"");
  return `<div class="${cls}" data-suit="${suit}" data-rank="${rank}"><div class="v">${rankLabel(rank)}</div><div class="s">${SUITS[suit]}</div></div>`;
}
function backHTML(mini){return `<div class="card back${mini?" mini":""}"></div>`}
function deck52(seed){const d=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)d.push({suit:s,rank:r});return shuffled(d,seed)}
function war52Value(rank){return rank===1?14:rank} // As haut

function pName(slot){if(slot===mySlot)return myName;return players[slot]?players[slot].name:("J"+slot)}
function oppStrip(activeSlot,extraFn){
  return onlinePlayers().map(p=>{
    const cls="oppchip"+(p.__slot===activeSlot?" turn":"");
    return `<div class="${cls}"><div class="nm">${esc(p.name)}${p.__me?" (toi)":""}</div><div class="ct">${extraFn?extraFn(p.__slot):""}</div></div>`;

}

function pushState(){

  gHost.seq=(gHost.seq||0)+1;
  gView=gHost;gSeqSeen=gHost.seq; // le chef voit son propre état tout de suite, sans attendre l'écho du serveur

}
function sendAction(obj){

function handleAction(obj){

// ================= BATAILLE CLASSIQUE =================
function warInit(order,seed){
  const deck=deck52(seed),piles={};
  order.forEach((s,i)=>piles[s]=[]);
  deck.forEach((c,i)=>{const s=order[i%order.length];piles[s].push(c)});
  return{piles,order,alive:order.slice(),active:order.slice(),table:[],flipped:{},lastWinner:null};
}
// g.active = joueurs qui doivent poser une carte visible dans le tour de résolution en cours
//            (tous les vivants au départ, seulement ceux à égalité en cas de bataille)
// g.flipped = cartes visibles déjà posées pour le tour en cours, par slot
function warHasCards(g,slot){return g.piles[slot]&&g.piles[slot].length>0}
function warAction(obj){
  if(obj.type!=="flip")return;
  const g=gHost;
  if(!g.active.includes(obj.slot))return;
  if(g.flipped[obj.slot])return;
  if(!warHasCards(g,obj.slot))return; // sera géré par warCheckEliminations
  const card=g.piles[obj.slot].shift();
  g.flipped[obj.slot]={card};
  g.table.push({slot:obj.slot,card,hidden:false});
  if(g.active.every(s=>g.flipped[s]||!warHasCards(g,s)))resolveWar();
  pushState();
}
function warCheckEliminations(){
  const g=gHost;
  g.alive=g.alive.filter(s=>warHasCards(g,s)||g.flipped[s]);
  const stillIn=g.alive.filter(s=>warHasCards(g,s));
  if(stillIn.length<g.alive.length){
    // des joueurs sans carte au moment de poser sont éliminés immédiatement
    g.alive=g.alive.filter(s=>warHasCards(g,s)||g.flipped[s]);
  }
}
function resolveWar(){
  const g=gHost;
  // ignore les joueurs qui n'ont pas pu poser faute de cartes : ils sont éliminés
  const participants=g.active.filter(s=>g.flipped[s]);
  const eliminated=g.active.filter(s=>!g.flipped[s]);
  eliminated.forEach(s=>{g.alive=g.alive.filter(x=>x!==s)});
  if(g.alive.length<=1){finishWar();return}
  if(!participants.length){g.active=g.alive.slice();g.flipped={};pushState();return}
  const entries=participants.map(s=>({slot:s,val:war52Value(g.flipped[s].card.rank)}));
  const max=Math.max(...entries.map(e=>e.val));
  const top=entries.filter(e=>e.val===max).map(e=>e.slot);
  if(top.length===1){
    const winner=top[0];
    const won=g.table.map(t=>t.card);
    g.piles[winner]=(g.piles[winner]||[]).concat(shuffled(won,(Date.now()+winner)%100000));
    g.lastWinner=winner;g.table=[];g.flipped={};g.active=g.alive.slice();
    if(g.alive.length<=1){finishWar();return}
  }else{
    // bataille entre les joueurs à égalité : chacun pose 1 carte cachée puis 1 visible
    const stillTop=top.filter(s=>g.alive.includes(s));
    stillTop.forEach(s=>{
      if(warHasCards(g,s)){const c=g.piles[s].shift();g.table.push({slot:s,card:c,hidden:true})}
    });
    // élimine ceux qui n'ont plus rien pour la carte cachée
    g.alive=g.alive.filter(s=>!stillTop.includes(s)||warHasCards(g,s)||g.table.some(t=>t.slot===s));
    g.flipped={};
    g.active=stillTop.filter(s=>g.alive.includes(s));
    if(g.active.length<=1&&g.alive.length<=1){finishWar();return}
  }
  pushState();
}
function finishWar(){
  const g=gHost,winner=g.alive[0];
  const delta={};
  onlinePlayers().forEach(p=>delta[p.__slot]=p.__slot===winner?100:0);
  broadcastScoreAndFinish(g,delta,{winnerSlot:winner});
}
function warRender(){
  const g=gView;
  document.getElementById("g-eyebrow").textContent="// bataille";
  document.getElementById("g-title").textContent="Dernier avec des cartes gagne";
  document.getElementById("g-pill").textContent=(g.alive?g.alive.length:0)+" en jeu";
  document.getElementById("g-opps").innerHTML=oppStrip(null,s=>(g.piles&&g.piles[s]?g.piles[s].length:0)+" cartes"+(g.alive&&!g.alive.includes(s)?" · éliminé":""));
  const trick=document.getElementById("g-trick");
  trick.innerHTML=(g.table||[]).map(t=>`<div class="trickslot"><div class="nm">${esc(pName(t.slot))}</div>${t.hidden?backHTML():cardHTML(t.card.suit,t.card.rank)}</div>`).join("")||'<div class="waitbox">En attente…</div>';
  const inBattle=g.active&&g.active.length&&g.table&&g.table.length>(g.alive?g.alive.length:0);
  document.getElementById("g-center").textContent=inBattle?"Bataille ! Retournez une carte pour trancher":(g.lastWinner!==null&&g.lastWinner!==undefined?pName(g.lastWinner)+" a ramassé le pli":"");
  const mySlotAlive=g.alive&&g.alive.includes(mySlot);
  const needFlip=g.active&&g.active.includes(mySlot)&&!(g.flipped&&g.flipped[mySlot]);
  const ctl=document.getElementById("g-controls");
  if(mySlotAlive&&needFlip){
    ctl.innerHTML=`<button class="p" id="warflip">Retourner ma carte</button>`;
    document.getElementById("warflip").onclick=()=>sendAction({type:"flip"});
  }else{
    ctl.innerHTML=`<div class="waitbox">${mySlotAlive?"Carte envoyée, en attente des autres…":"Tu es éliminé, tu observes la suite."}</div>`;
  }
  document.getElementById("g-hand").innerHTML="";
  document.getElementById("g-pile").innerHTML="";
}

// ================= TAROT ALLÉGÉ =================
const TAROT_SUIT=["♥","♦","♣","♠"];
function tarotDeck(seed){
  const d=[];
  for(let s=0;s<4;s++)for(let r=1;r<=10;r++)d.push({kind:"suit",suit:s,rank:r,pts:(r>=11?0:0)});
  // valet/cavalier/dame/roi = rangs 11 (V) 12 (C) 13 (D) 14 (R) par couleur, remplace 11-14 fictifs
  const dd=[];
  for(let s=0;s<4;s++){
    for(let r=1;r<=10;r++)dd.push({kind:"suit",suit:s,rank:r,val:r,pts:0.5});
    dd.push({kind:"suit",suit:s,rank:11,val:11,pts:1.5,face:"V"});
    dd.push({kind:"suit",suit:s,rank:12,val:12,pts:2.5,face:"C"});
    dd.push({kind:"suit",suit:s,rank:13,val:13,pts:3.5,face:"D"});
    dd.push({kind:"suit",suit:s,rank:14,val:14,pts:4.5,face:"R"});
  }
  for(let a=1;a<=21;a++)dd.push({kind:"trump",rank:a,val:a,pts:0.5});
  dd.push({kind:"excuse",rank:0,val:0,pts:0.5});
  return shuffled(dd,seed);
}
function tarotFace(c){if(c.kind==="trump")return"AT."+c.rank;if(c.kind==="excuse")return"EXC";return c.face||String(c.rank)}
function tarotCardHTML(c,opts){
  opts=opts||{};
  if(c.kind==="trump"){
    return `<div class="card${opts.mini?" mini":""}${opts.trump?" trump":""}${opts.dis?" dis":""}" style="background:#F5EFE0"><div class="v">${c.rank}</div><div class="s">Atout</div></div>`;
  }
  if(c.kind==="excuse")return `<div class="card${opts.mini?" mini":""}${opts.dis?" dis":""}" style="background:#F5EFE0"><div class="v">✦</div><div class="s">Excuse</div></div>`;
  return `<div class="card${isRed(c.suit)?" red":""}${opts.mini?" mini":""}${opts.dis?" dis":""}"><div class="v">${rankLabel(c.rank<=10?c.rank:c.rank)}</div><div class="s">${TAROT_SUIT[c.suit]}</div></div>`;
}
function tarotInit(order,seed){
  const deck=tarotDeck(seed);
  const perPlayer=Math.floor(deck.length/order.length);
  const chien=deck.slice(perPlayer*order.length); // cartes en trop si non divisible, mises de côté
  const hands={};order.forEach(s=>hands[s]=[]);
  let i=0;
  for(let k=0;k<perPlayer*order.length;k++){const s=order[i%order.length];hands[s].push(deck[k]);i++}
  order.forEach(s=>hands[s].sort((a,b)=>{
    const ka=a.kind==="trump"?2:a.kind==="excuse"?3:0,kb=b.kind==="trump"?2:b.kind==="excuse"?3:0;
    if(ka!==kb)return ka-kb;
    if(ka===0)return a.suit-b.suit||a.rank-b.rank;
    return a.rank-b.rank;
  }));
  const firstIdx=1%order.length;
  return{order,hands,chien,
    turnIdx:firstIdx,leadSuit:null,trick:[],tricksWon:Object.fromEntries(order.map(s=>[s,[]])),
    roundOver:false};
}
function tarotLegal(hand,leadKind,leadSuit,hasTrumpLeft){
  if(leadKind===null)return hand.map((_,i)=>i);
  const followSuit=hand.map((c,i)=>({c,i})).filter(x=>leadKind==="suit"?(x.c.kind==="suit"&&x.c.suit===leadSuit):(x.c.kind==="trump"));
  if(followSuit.length)return followSuit.map(x=>x.i);
  const trumps=hand.map((c,i)=>({c,i})).filter(x=>x.c.kind==="trump");
  if(leadKind==="suit"&&trumps.length)return trumps.map(x=>x.i);
  return hand.map((_,i)=>i);
}
function tarotAction(obj){
  if(obj.type!=="play")return;
  const g=gHost;
  if(g.order[g.turnIdx]!==obj.slot)return;
  const hand=g.hands[obj.slot];
  const idx=obj.cardIdx;
  if(idx<0||idx>=hand.length)return;
  const leadKind=g.trick.length?g.trick[0].card.kind:null;
  const leadSuit=g.trick.length&&g.trick[0].card.kind==="suit"?g.trick[0].card.suit:null;
  const legal=tarotLegal(hand,leadKind,leadSuit);
  if(!legal.includes(idx))return;
  const card=hand.splice(idx,1)[0];
  g.trick.push({slot:obj.slot,card});
  if(g.trick.length===g.order.length){
    resolveTarotTrick();
  }else{
    g.turnIdx=(g.turnIdx+1)%g.order.length;
  }
  pushState();
}
function tarotCardStrength(card,leadKind,leadSuit){
  if(card.kind==="excuse")return -1;
  if(card.kind==="trump")return 1000+card.rank;
  if(leadKind==="trump")return -1;
  if(card.suit===leadSuit)return card.rank;
  return -1;
}
function resolveTarotTrick(){
  const g=gHost;
  const leadKind=g.trick[0].card.kind,leadSuit=leadKind==="suit"?g.trick[0].card.suit:null;
  let best=null,bestVal=-2;
  g.trick.forEach(t=>{
    const v=tarotCardStrength(t.card,leadKind,leadSuit);
    if(v>bestVal){bestVal=v;best=t.slot}
  });
  g.tricksWon[best]=g.tricksWon[best].concat(g.trick.map(t=>t.card));
  g.trick=[];
  g.turnIdx=g.order.indexOf(best);
  const allEmpty=g.order.every(s=>g.hands[s].length===0);
  if(allEmpty){
    if(g.chien&&g.chien.length)g.tricksWon[best]=g.tricksWon[best].concat(g.chien);
    finishTarot();
  }
}
function finishTarot(){
  const g=gHost,delta={};
  g.order.forEach(s=>{
    const won=g.tricksWon[s];
    const pts=won.reduce((a,c)=>a+(c.pts||0),0);
    delta[s]=Math.round(pts*10);
  });
  broadcastScoreAndFinish(g,delta,{tricksWon:g.tricksWon});
}
function tarotRender(){
  const g=gView;
  document.getElementById("g-eyebrow").textContent="// tarot allégé";
  document.getElementById("g-title").textContent="Suis la couleur ou coupe à l'atout";
  document.getElementById("g-pill").textContent=(g.hands&&g.hands[g.order[g.turnIdx]]?"Tour de "+pName(g.order[g.turnIdx]):"");
  document.getElementById("g-opps").innerHTML=oppStrip(g.order[g.turnIdx],s=>(g.hands&&g.hands[s]?g.hands[s].length:0)+" cartes · "+((g.tricksWon&&g.tricksWon[s])?g.tricksWon[s].length:0)+" plis");
  const trick=document.getElementById("g-trick");
  trick.innerHTML=(g.trick||[]).map(t=>`<div class="trickslot"><div class="nm">${esc(pName(t.slot))}</div>${tarotCardHTML(t.card)}</div>`).join("")||'<div class="waitbox">Nouveau pli…</div>';
  document.getElementById("g-center").textContent="";
  document.getElementById("g-pile").innerHTML="";
  const ctl=document.getElementById("g-controls");
  ctl.innerHTML="";
  const hand=document.getElementById("g-hand");
  const myHand=(g.hands&&g.hands[mySlot])||[];
  const isMyTurn=g.order[g.turnIdx]===mySlot;
  const leadKind=g.trick&&g.trick.length?g.trick[0].card.kind:null;
  const leadSuit=g.trick&&g.trick.length&&g.trick[0].card.kind==="suit"?g.trick[0].card.suit:null;
  const legal=isMyTurn?tarotLegal(myHand,leadKind,leadSuit):[];
  hand.innerHTML=myHand.map((c,i)=>{
    const dis=!isMyTurn||!legal.includes(i);
    return `<div class="cardwrap" data-i="${i}">${tarotCardHTML(c,{dis})}</div>`;
  }).join("");
  if(isMyTurn){
    hand.querySelectorAll(".cardwrap").forEach(el=>{
      const i=parseInt(el.dataset.i);
      if(!legal.includes(i))return;
      el.onclick=()=>sendAction({type:"play",cardIdx:i});
    });
    msg("g-msg","À toi de jouer.","ok");
  }else{
    msg("g-msg","Tour de "+pName(g.order[g.turnIdx])+"…","");
  }
}

// ================= BLACKJACK (tour par tour réel, croupier fixe) =================
function bjVal(rank){if(rank===1)return 11;if(rank>=11)return 10;return rank}
function bjHandTotal(hand){
  let total=hand.reduce((a,c)=>a+bjVal(c.rank),0),aces=hand.filter(c=>c.rank===1).length;
  while(total>21&&aces>0){total-=10;aces--}
  return total;
}
function bjInit(order,seed){
  const deck=deck52(seed);
  const hands={};order.forEach(s=>hands[s]=[deck.pop(),deck.pop()]);
  const dealer=[deck.pop(),deck.pop()];
  return{order,deck,hands,dealer,turnIdx:0,done:{},dealerRevealed:false,dealerDone:false};
}
function bjAction(obj){
  const g=gHost;
  if(g.order[g.turnIdx]!==obj.slot)return;
  if(g.done[obj.slot])return;
  if(obj.type==="hit"){
    g.hands[obj.slot].push(g.deck.pop());
    if(bjHandTotal(g.hands[obj.slot])>=21)bjAdvanceTurn();
  }else if(obj.type==="stand"){
    bjAdvanceTurn();
  }else return;
  pushState();
}
function bjAdvanceTurn(){
  const g=gHost;
  g.done[g.order[g.turnIdx]]=true;
  g.turnIdx++;
  if(g.turnIdx>=g.order.length){
    bjDealerPlay();
  }
}
function bjDealerPlay(){
  const g=gHost;g.dealerRevealed=true;
  while(bjHandTotal(g.dealer)<17)g.dealer.push(g.deck.pop());
  g.dealerDone=true;
  finishBJ();
}
function finishBJ(){
  const g=gHost,delta={},dTotal=bjHandTotal(g.dealer),dBust=dTotal>21;
  g.order.forEach(s=>{
    const t=bjHandTotal(g.hands[s]);
    let pts=0;
    if(t>21)pts=0;
    else if(dBust||t>dTotal)pts=100;
    else if(t===dTotal)pts=40;
    else pts=0;
    delta[s]=pts;
  });
  broadcastScoreAndFinish(g,delta,{dealerTotal:dTotal});
}
function bjRender(){
  const g=gView;
  document.getElementById("g-eyebrow").textContent="// blackjack";
  document.getElementById("g-title").textContent="Approche-toi de 21";
  const activeSlot=g.turnIdx<g.order.length?g.order[g.turnIdx]:null;
  document.getElementById("g-pill").textContent=activeSlot!==null?"Tour de "+pName(activeSlot):"Croupier joue…";
  document.getElementById("g-opps").innerHTML=oppStrip(activeSlot,s=>{
    const t=g.hands&&g.hands[s]?bjHandTotal(g.hands[s]):0;
    return t+(g.done&&g.done[s]?" · fini":"");
  });
  const trick=document.getElementById("g-trick");
  const dealerCards=g.dealer||[];
  const shown=g.dealerRevealed?dealerCards:dealerCards.slice(0,1);
  trick.innerHTML=`<div class="trickslot"><div class="nm">Croupier${g.dealerRevealed?" ("+bjHandTotal(dealerCards)+")":""}</div><div style="display:flex;gap:4px">${shown.map(c=>cardHTML(c.suit,c.rank,{mini:true})).join("")}${g.dealerRevealed?"":backHTML(true)}</div></div>`;
  document.getElementById("g-center").textContent="";
  document.getElementById("g-pile").innerHTML="";
  const myHand=(g.hands&&g.hands[mySlot])||[];
  document.getElementById("g-hand").innerHTML=myHand.map(c=>cardHTML(c.suit,c.rank)).join("")+
    (myHand.length?`<div class="waitbox" style="width:100%">Total : ${bjHandTotal(myHand)}</div>`:"");
  const ctl=document.getElementById("g-controls");
  const isMyTurn=activeSlot===mySlot&&!(g.done&&g.done[mySlot]);
  if(isMyTurn&&bjHandTotal(myHand)<21){
    ctl.innerHTML=`<div class="row2"><button class="p" id="bjhit">Tirer</button><button class="o" id="bjstand">Rester</button></div>`;
    document.getElementById("bjhit").onclick=()=>sendAction({type:"hit"});
    document.getElementById("bjstand").onclick=()=>sendAction({type:"stand"});
    msg("g-msg","","");
  }else{
    ctl.innerHTML="";
    msg("g-msg",activeSlot===null?"Le croupier tire ses cartes…":"Tour de "+pName(activeSlot)+"…","");
  }
}

// ================= FIN DE PARTIE COMMUNE =================
function broadcastScoreAndFinish(g,delta,extra){
  Object.keys(delta).forEach(s=>{
    const slot=+s;
    if(slot===mySlot){myScore+=delta[s];cset("SLOT"+mySlot,encSlot(myRoom,isHost,true,myScore,myName))}
  });
  g.finalDelta=delta;g.finalExtra=extra||{};
  pushState();
  cset("GAME",encGame(myRoom,PHASE.RESULTS,g.gid,g.round,Date.now()));
}
function showResults(st){
  show("s-results");
  const names={1:"Bataille",2:"Tarot allégé",3:"Blackjack"};
  const delta=(gView&&gView.finalDelta)||{};
  // applique le delta localement une seule fois si pas déjà fait via SLOT (au cas où on rejoint tard)
  const l=roomPlayers().sort((a,b)=>b.score-a.score);
  document.getElementById("res-detail").innerHTML=`<h2>${names[st.gameId]||"Partie"}</h2>`+l.map(p=>{
    const g=delta[p.__slot]||0;
    return `<div class="prow"><span style="display:flex;align-items:center">${dot(p)}${esc(p.name)}</span><span style="color:${g>0?"var(--ok)":"var(--dim)"}">+${g}</span></div>`;
  }).join("");
  document.getElementById("res-sb").innerHTML=l.map((p,i)=>`<div class="sbrow ${p.__me?"me":""}"><span class="sbrank">${i+1}</span><span class="sbname">${dot(p)}${esc(p.name)}${p.__me?" (toi)":""}</span><span class="sbscore">${p.score}</span></div>`).join("");
  document.getElementById("res-hostctl").style.display=isHost?"block":"none";
}
function refreshResults(){if(document.getElementById("s-results").classList.contains("active")&&lastGame)showResults(lastGame)}
document.getElementById("b-next").onclick=()=>{
  if(!isHost||!lastGame)return;
  if(onlinePlayers().length<2)return;
  const gid=lastGame.gameId,round=lastGame.round+1,epoch=Date.now();
  const st={room:myRoom,phase:PHASE.PLAY,gameId:gid,round,epoch};
  lastGame=st;gHandled=gid+":"+round+":"+epoch;launch(st);
  cset("GAME",encGame(myRoom,PHASE.PLAY,gid,round,epoch));
};
document.getElementById("b-back").onclick=()=>{
  if(!isHost)return;
  show("s-picker");
  cset("GAME",encGame(myRoom,PHASE.PICKER,0,lastGame?lastGame.round:0,Date.now()));
};

// ================= FAILOVER CHEF =================
function checkFailover(){
  if(!myRoom||isHost||!lastGame)return;
  if(lastGame.phase!==PHASE.PLAY&&lastGame.phase!==PHASE.RESULTS)return;
  if(Date.now()-lastHostBeatSeen<8000)return;
  const online=onlinePlayers();
  if(!online.length)return;
  const minSlot=Math.min(...online.map(p=>p.__slot));
  if(mySlot!==minSlot)return;
  promoteToHost();
}
function promoteToHost(){
  isHost=true;
  cset("SLOT"+mySlot,encSlot(myRoom,true,true,myScore,myName));
  cset("HOSTBEAT",encBeat(myRoom,Date.now()));
  refreshLobby();refreshResults();
  if(lastGame.phase===PHASE.PLAY&&gView){
    // reprend l'état depuis la dernière vue synchronisée reçue, sans redistribuer les cartes
    gHost=Object.assign({},gView);
    gHost.seq=(gHost.seq||0);
    pushState();
    msg("g-msg","Tu es devenu chef de partie (ancien chef déconnecté).","ok");
  }
}

window.addEventListener("beforeunload",()=>{
  if(mySlot>=0&&ws&&ws.readyState===1)ws.send(JSON.stringify({method:"set",name:"☁ SLOT"+mySlot,value:encSlot(myRoom,isHost,false,myScore,myName)}));
});
setInterval(()=>{refreshLobby();refreshResults();renderGame()},1200);
setInterval(()=>{if(isHost&&myRoom)cset("HOSTBEAT",encBeat(myRoom,Date.now()))},2000);
setInterval(checkFailover,3000);
</script>
